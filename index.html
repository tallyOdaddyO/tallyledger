/* ===== formatting / date helpers ===== */
function fmt(n){
  n = round2(n);
  const neg = n < 0;
  const s = Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  return (neg?'-':'') + '$' + s;
}
/* Whole dollars, for headline figures. Rounds to cents first so a value of
   -0.004 prints "$0" and not "-$0". */
function fmt0(n){
  n = round2(n);
  const rounded = Math.round(Math.abs(n));
  const neg = n < 0 && rounded !== 0;
  return (neg?'-':'') + '$' + rounded.toLocaleString('en-US');
}
function fmtSigned(n){ n = round2(n); return (n>0?'+':'') + fmt0(n); }
function pct(n){ return (Number.isFinite(n) ? Math.round(n*100) : 0) + '%'; }
function dispDate(iso){
  const d = parseISO(iso);
  if(!d) return '—';
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function dispDateShort(iso){
  const d = parseISO(iso);
  if(!d) return '—';
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function monthKey(iso){ return (typeof iso==='string' && iso.length>=7) ? iso.slice(0,7) : ''; }
function monthLabel(mk){
  const [y,m] = String(mk).split('-').map(Number);
  if(!y || !m) return '—';
  return new Date(y, m-1, 1, 12).toLocaleDateString('en-US',{month:'long',year:'numeric'});
}
function monthLabelShort(mk){
  const [y,m] = String(mk).split('-').map(Number);
  if(!y || !m) return '—';
  return new Date(y, m-1, 1, 12).toLocaleDateString('en-US',{month:'short',year:'2-digit'});
}
/* Civil-day arithmetic. Anchored at local noon so a DST jump — including
   zones that shift AT midnight — can never bump the result to a neighbouring
   day. Returns null-safe: a bad input gives back the input unchanged rather
   than an "Invalid Date" string that poisons string comparisons. */
function addDays(iso, days){
  const d = parseISO(iso);
  if(!d) return iso;
  d.setDate(d.getDate() + Math.trunc(days));
  return isoOf(d);
}
function addMonths(iso, months){
  const d = parseISO(iso);
  if(!d) return iso;
  const day = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + Math.trunc(months));
  // Clamp into the target month: Jan 31 + 1 month is Feb 28, never Mar 3.
  const lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0, 12).getDate();
  d.setDate(Math.min(day, lastDay));
  return isoOf(d);
}
/* Whole days from a to b (b − a). Rounds because a DST week is 167 or 169
   hours long, not 168. Returns 0 if either side isn't a real date. */
function daysBetween(a,b){
  const da = parseISO(a), db = parseISO(b);
  if(!da || !db) return 0;
  return Math.round((db - da) / 86400000);
}
function weeksBetween(a,b){ return daysBetween(a,b)/7; }
/* Calendar-accurate elapsed months, as a fraction. The old version divided
   days by 30.44, which drifts up to half a month over a year-long goal and
   disagreed with the month boundaries every other figure is built on. */
function monthsBetween(a,b){
  const da = parseISO(a), db = parseISO(b);
  if(!da || !db) return 0;
  if(db <= da) return 0;
  let whole = (db.getFullYear()-da.getFullYear())*12 + (db.getMonth()-da.getMonth());
  const anchor = parseISO(addMonths(a, whole));
  if(anchor > db){ whole -= 1; }
  const from = parseISO(addMonths(a, whole));
  const to   = parseISO(addMonths(a, whole+1));
  const span = Math.round((to-from)/86400000) || 30;
  const frac = Math.round((db-from)/86400000) / span;
  return Math.max(whole + frac, 0);
}
/* Sunday of the calendar week containing this date (Sun–Sat weeks). */
function startOfWeek(dateISO){
  const d = parseISO(dateISO);
  if(!d) return dateISO;
  return addDays(dateISO, -d.getDay());
}
function endOfWeek(dateISO){ return addDays(startOfWeek(dateISO), 6); }
/* Inclusive range test that tolerates missing/garbage dates. Every "is this
   entry in this window" check goes through here so one call site can't quietly
   use a different rule (or compare undefined with <=, which is always false). */
function inRange(iso, fromISO, toISO){
  return isValidISO(iso) && iso >= fromISO && iso <= toISO;
}

/* ===== duplicate detection for scanned entries ===== */
function amountsClose(a,b,tol){
  tol = tol==null ? 0.02 : tol;
  if(a==null || b==null) return false;
  return Math.abs(num(a)-num(b)) <= tol;
}
function datesClose(d1,d2,toleranceDays){
  toleranceDays = toleranceDays==null ? 1 : toleranceDays;
  if(!d1 || !d2) return false;
  return Math.abs(daysBetween(d1,d2)) <= toleranceDays;
}
/* Looks for an existing entry that plausibly matches a freshly-scanned one,
   so the user can be warned before adding a duplicate. Returns the matching
   record (with a human label) or null. */
function findScanDuplicate(targetType, data){
  if(targetType==='expense'){
    if(data.amount==null) return null;
    const hit = state.expenses.items.find(item=>{
      if(item.status==='cancelled') return false;
      if(item.frequency==='onetime') return amountsClose(item.amount,data.amount) && datesClose(item.date,data.date);
      return false;
    });
    if(hit) return { label: `${esc(hit.name)} — ${fmt(hit.amount)} on ${esc(dispDate(hit.date))}` };
    // also check logged actual payments on recurring items
    for(const key in state.expenses.monthlyLog){
      const [itemId, occ] = key.split('|');
      const amt = state.expenses.monthlyLog[key];
      if(amountsClose(amt, data.amount) && datesClose(occ, data.date)){
        const item = state.expenses.items.find(i=>i.id===itemId);
        if(item) return { label: `${esc(item.name)} — ${fmt(amt)} logged on ${esc(dispDate(occ))}` };
      }
    }
    return null;
  }
  if(targetType==='sidegig'){
    if(data.amount==null) return null;
    const hit = state.sideGig.entries.find(e=> amountsClose(e.amount,data.amount) && datesClose(e.date,data.date));
    if(hit) return { label: `${esc(hit.source)} — ${fmt(hit.amount)} on ${esc(dispDate(hit.date))}` };
    return null;
  }
  if(targetType==='jobstub'){
    if(data.netPay==null) return null;
    const hit = state.job.periods.find(p=> p.actualNet!=null && amountsClose(p.actualNet,data.netPay) && datesClose(p.payDate,data.payDate));
    if(hit) return { label: `Pay period ${dispDate(hit.start)}–${dispDate(hit.end)}, paid ${fmt(hit.actualNet)} on ${dispDate(hit.payDate)}` };
    return null;
  }
  return null;
}
/* =========================================================
   COMPUTATION
========================================================= */
/* The take-home fraction of gross pay. `avgRate x hours` is a GROSS figure,
   but the "actual net pay" field it sits beside — and every expense it is
   compared against — is post-tax. Mixing them credited the user with money
   that never reaches their account. Learned from their own stubs once two
   exist, so nobody has to know their effective tax rate. */
function jobNetFactor(){
  const stated = num(state.job.netFactor);
  if(stated > 0 && stated <= 1) return stated;
  const withBoth = state.job.periods.filter(p=>
    p.actualNet!=null && p.actualNet!=='' && num(p.hours) > 0);
  if(withBoth.length >= 2 && num(state.job.avgRate) > 0){
    const net = sumMoney(withBoth, p=>p.actualNet);
    const gross = sumMoney(withBoth, p=>num(p.hours)*num(state.job.avgRate));
    if(gross > 0){
      const f = net/gross;
      if(f > 0.3 && f <= 1) return f;   // ignore implausible ratios from bad data
    }
  }
  return 1;
}
function jobPeriodNetUsed(p){
  if(p.actualNet !== null && p.actualNet !== undefined && p.actualNet !== '') return {val:round2(p.actualNet), actual:true};
  if(state.job.payType === 'fixed'){
    return {val: round2(state.job.fixedAmount), actual:false};
  }
  const hrs = (p.hours!==null && p.hours!==undefined && p.hours!=='') ? num(p.hours) : num(state.job.defaultHours);
  return {val: round2(hrs * num(state.job.avgRate) * jobNetFactor()), actual:false};
}
const FIXED_FREQ_TO_MONTHLY = {weekly: 52/12, biweekly: 26/12, monthly: 1, yearly: 1/12};
/* What the main job brings in during a typical month, plus how confident we
   are in that. Fixed salary is known exactly; hourly is a stated rate; weekly
   variable has to be learned from history, and is the only one that carries a
   real spread. */
function jobEstimate(){
  if(state.job.payType === 'fixed'){
    const v = round2(num(state.job.fixedAmount) * (FIXED_FREQ_TO_MONTHLY[state.job.fixedFrequency] || 26/12));
    return { monthly:v, low:v, high:v, n:0, confidence:'exact' };
  }
  if(state.job.payType === 'weeklyVariable'){
    // Learned from completed months of logged weeks — the old version divided
    // the lifetime total by weeks elapsed since the first entry, so a gap in
    // logging permanently deflated the rate and it could never recover.
    const est = estimateMonthlyFrom((f,t)=>jobIncomeInRange(f,t).actual);
    if(est.n === 0){
      // Not enough completed months yet — fall back to whatever weeks exist,
      // averaged over the weeks they actually span.
      const entries = (state.job.weeklyVariable.entries||[]).filter(e=>isValidISO(e.weekEnd));
      if(entries.length === 0) return { monthly:0, low:0, high:0, n:0, confidence:'none' };
      const dates = entries.map(e=>e.weekEnd).sort();
      const weeksSpanned = Math.max(weeksBetween(dates[0], todayISO()), 1);
      const v = round2((sumMoney(entries, e=>e.amount)/weeksSpanned) * (52/12));
      return { monthly:v, low:v, high:v, n:entries.length, confidence:'low' };
    }
    return est;
  }
  const periodsPerYear = state.job.payFrequency === 'weekly' ? 52 : 26;
  const v = round2(num(state.job.avgRate) * num(state.job.defaultHours) * (periodsPerYear/12) * jobNetFactor());
  return { monthly:v, low:v, high:v, n:0, confidence:'stated' };
}
function jobEstimateMemo(){ return memo('jobEstimate', jobEstimate); }
function jobMonthlyEstimate(){ return jobEstimateMemo().monthly; }
/* Nominal days between paycheques, used to work out how much of a month a
   cheque already on the books accounts for. */
function jobCycleDays(){
  if(state.job.payType === 'weeklyVariable') return 7;
  const freq = state.job.payType === 'fixed' ? state.job.fixedFrequency : state.job.payFrequency;
  return ({weekly:7, biweekly:14, monthly:30, yearly:365})[freq] || 14;
}
/* The ongoing run-rate of a recurring item, in dollars per month.
   One-time purchases are 0 here on purpose — a thing you bought once is not a
   monthly obligation — but that means they must be added back wherever the
   question is "what did this month actually cost", which is what
   currentMonthCost() and monthClose() are for. */
/* Is this item live at any point inside [fromISO, toISO]?
   The whole-MONTH window is the unit, because that is the question every
   caller is actually asking. Comparing against a single day instead meant a
   bill starting on the 15th was $0 on the dashboard and full price in History,
   for the same month — the two screens disagreed because they compared the
   same startDate at different granularities. */
function expenseLiveIn(item, fromISO, toISO){
  if(!item || item.status === 'cancelled') return false;
  // A biweekly item with no usable anchor generates no occurrences anywhere
  // else, so charging for it would make the dashboard disagree with every
  // other screen. migrateState repairs these; this is the belt.
  if(item.frequency === 'biweekly' && !isValidISO(item.anchorDate)) return false;
  if(item.endDate && item.endDate < fromISO) return false;
  if(item.startDate && item.startDate > toISO) return false;
  return true;
}
function expenseMonthlyEquivalent(item, asOfISO){
  if(!item || item.frequency === 'onetime') return 0;
  const {from, to} = monthRange(monthKey(asOfISO || todayISO()));
  if(!expenseLiveIn(item, from, to)) return 0;
  if(item.frequency === 'biweekly') return round2(num(item.amount) * (26/12));
  return round2(num(item.amount));
}
/* Recurring monthly obligations — the "this is what my life costs every month"
   number. Excludes one-off purchases by design. */
function totalMonthlyExpenses(){
  return memo('totalMonthlyExpenses', ()=>sumMoney(state.expenses.items, i=>expenseMonthlyEquivalent(i)));
}
function oneTimeSpendInRange(fromISO, toISO){
  return sumMoney(
    state.expenses.items.filter(i=>
      i.status!=='cancelled' && i.frequency==='onetime' && inRange(i.date, fromISO, toISO)),
    i=>i.amount
  );
}
/* What THIS month actually costs: the recurring run-rate plus the one-off
   purchases genuinely dated inside it. This is the honest denominator for
   "am I breaking even", and the reason the dashboard and the Expenses tab
   used to disagree — the tab showed one-time spend, the dashboard didn't. */
function currentMonthCost(){
  const {from, to} = currentMonthRange();
  return round2(totalMonthlyExpenses() + oneTimeSpendInRange(from, to));
}
/* =========================================================
   ESTIMATION — learning a monthly rate from actual history

   A forecast built from one lifetime average is a bad forecast: a gig you
   stopped doing in March drags the number down forever, and one unusually big
   month skews it permanently. So estimates are built from the last few
   COMPLETED calendar months (the current month is excluded — it's partial, and
   including it always biases the estimate downward), and they carry a spread
   and a confidence level so the UI can say how much to trust them instead of
   presenting a guess as a fact.
========================================================= */
const LOOKBACK_MONTHS = 6;   // how far back we're willing to learn from
const RECENT_MONTHS   = 3;   // the window that actually sets the headline rate

/* Month keys for the N completed months before the current one, oldest first. */
function completedMonthKeys(n){
  const out = [];
  let mk = monthKey(addMonths(todayISO(), -1));
  for(let i=0; i<n; i++){ out.unshift(mk); mk = monthKey(addMonths(mk+'-01', -1)); }
  return out;
}
/* Turns a per-month total into a rate + honest error bars.
   `low`/`high` are one standard deviation either side of the mean, clamped at
   zero, which for the 3-6 samples we ever have is a fair "typical range"
   without pretending to statistical rigour we don't have. */
function estimateFromMonths(totals){
  const n = totals.length;
  if(n === 0) return { monthly:0, low:0, high:0, n:0, confidence:'none' };
  const mean = totals.reduce((s,v)=>s+v,0)/n;
  const variance = n>1 ? totals.reduce((s,v)=>s+(v-mean)*(v-mean),0)/(n-1) : 0;
  const sd = Math.sqrt(variance);
  return {
    monthly: round2(mean),
    low: round2(Math.min(Math.max(mean - sd, 0), mean)),
    high: round2(Math.max(mean + sd, mean)),
    n,
    spread: round2(sd),
    confidence: n>=5 ? 'high' : (n>=3 ? 'medium' : 'low')
  };
}
/* Runs a range-summing function over each completed month and estimates from

   stream has started — leading empty months (before the user had any data)
   are dropped, so signing up in June doesn't make May look like a $0 month. */

  const series = keys.map(mk=>{ const {from,to} = monthRange(mk); return { mk, total: round2(sumInRange(from,to)) }; });
  let firstActive = series.findIndex(s=>s.total !== 0);
  if(firstActive === -1) return { ...estimateFromMonths([]), series:[] };
  const active = series.slice(firstActive);
  const recent = active.slice(-RECENT_MONTHS);
  const est = estimateFromMonths(recent.map(s=>s.total));
  return { ...est, series: active };
}

/* Every date a recurring item comes due inside [fromISO, toISO], inclusive.
   Guarded so no malformed item can spin the loop forever: every branch is
   bounded by a computed step count rather than by "keep going until we pass
   the end", which never terminates if the step is a no-op. */
const MAX_OCCURRENCES = 2000;
const EXPENSE_PAGE = 60;      // expense rows drawn per category before "show more"
const TIMELINE_MAX_DAYS = 45;    // day columns drawn on the Timeline strip
const TIMELINE_MAX_PER_DAY = 12; // cards drawn per day column
function itemOccurrences(item, fromISO, toISO){
  if(!item || item.frequency === 'variable') return [];
  if(!isValidISO(fromISO) || !isValidISO(toISO) || fromISO > toISO) return [];
  // An item never occurs before it exists or after it ends.
  const lo = (item.startDate && item.startDate > fromISO) ? item.startDate : fromISO;
  const hi = (item.endDate && item.endDate < toISO) ? item.endDate : toISO;
  if(lo > hi) return [];

  if(item.frequency === 'onetime'){
    return inRange(item.date, lo, hi) ? [item.date] : [];
  }
  const out = [];
  if(item.frequency === 'monthly'){
    const day = Math.min(Math.max(Math.trunc(num(item.dueDay)) || 1, 1), 31);
    const [sy, sm] = lo.split('-').map(Number);
    let y = sy, m = sm;
    for(let i=0; i<MAX_OCCURRENCES; i++){
      const lastDay = new Date(y, m, 0, 12).getDate();      // last day of month m
      const occ = isoOf(new Date(y, m-1, Math.min(day, lastDay), 12));
      if(occ > hi) break;
      if(occ >= lo) out.push(occ);
      m++; if(m > 12){ m = 1; y++; }
    }
  } else if(item.frequency === 'biweekly' && isValidISO(item.anchorDate)){
    /* Land on the first on-cycle date at or after `lo` by arithmetic, not by
       stepping — an anchor years in the past used to cost hundreds of loops.

       The step count is deliberately allowed to go NEGATIVE. The anchor is
       labelled "next / anchor payment date", so users set it to an upcoming
       date; clamping at zero meant the cycle only ever ran forward from there
       and every month before the anchor showed no occurrences at all — while
       the dashboard still charged the item's full monthly run-rate. History and
       the run-rate disagreed by the entire cost of the bill. How far back it
       walks is bounded by startDate. */
    const offset = daysBetween(item.anchorDate, lo);
    const steps = Math.ceil(offset/14);
    let occ = addDays(item.anchorDate, steps*14);
    for(let i=0; i<MAX_OCCURRENCES && occ <= hi; i++){
      if(occ >= lo) out.push(occ);
      occ = addDays(occ, 14);
    }
  }
  return out;
}

   changed how they get paid. */

   day's income is either logged or it isn't), and strictly remaining. */
function currentMonthDayCounts(){
  const {from, to} = currentMonthRange();
  const today = todayISO();
  const D = daysBetween(from, to) + 1;
  const E = Math.min(Math.max(daysBetween(from, today) + 1, 0), D);
  return { D, E, R: D - E };

/* ---------------------------------------------------------
   PROJECTION — where this month is headed

   The previous model was `received + rate x (daysLeft/daysInMonth)`, which
   double counts: `received` scanned the WHOLE month, so a paycheck already
   entered for the 28th was counted as money in hand AND covered again by the
   rate applied to the remaining days.

   This model splits the month at today and never lets a dollar appear twice:

     received  — confirmed, dated on or before today. Fact.
     scheduled — pay periods already entered with a date after today, this
                 month. Known, so we use the known number instead of guessing.
     expected  — the learned rate applied ONLY to the remaining days, and only
                 for streams that have no schedule (side gigs), plus the job
                 but only if no future pay period is on the books.

  const fracLeft = D > 0 ? R/D : 0;

  /* Pay periods dated in the part of the month that has ALREADY happened but
     whose stub hasn't arrived yet. The app's own modal says "leave blank until
     the stub arrives", so this is the normal state of the most recent paycheck
     — and it belonged to no bucket: not `received` (not confirmed), not
     `scheduled` (that window starts tomorrow), and not `expected` (the rate
     only covers remaining days). The money simply vanished from the forecast
     while the history tab counted it. */
  const jobElapsed = jobIncomeInRange(from, today);
  const awaitingStub = jobElapsed.estimated;

  // Job pay already on the calendar for the rest of this month.
  const jobFuture = rest ? jobIncomeInRange(rest, to) : {total:0, actual:0, estimated:0};
  const jobEst = jobEstimate();
  /* The schedule is authoritative as far as it goes, and the rate fills only
     the gap AFTER it.

     Neither of the simpler rules works. "Switch the rate off whenever anything
     is scheduled" let a single $25 period dated tomorrow zero out the whole
     rest-of-month forecast. "Top up to the monthly rate" over-projects in the
     opposite direction: someone paid biweekly who has entered both of this
     month's cheques has a complete schedule, and topping up to the 26/12
     average invents a third paycheck that isn't coming.

     So: find the last pay date already on the calendar this month, and apply
     the rate only to the days beyond it. A complete schedule leaves no gap and
     gets no top-up; a token entry leaves most of the month uncovered. */

    ? (state.job.weeklyVariable.entries||[]).filter(e=>inRange(e.weekEnd, from, to)).map(e=>e.weekEnd)

  // cycle after the last one on the books. Measuring from the last pay date
  // alone would double-count the days that cheque already paid for.
  const cycleDays = jobCycleDays();
  const coveredUntil = lastPayDate ? addDays(lastPayDate, cycleDays) : today;
  const uncoveredFrom = coveredUntil > today ? coveredUntil : today;
  const uncoveredDays = Math.max(daysBetween(uncoveredFrom, to), 0);
  const jobExpected = round2(jobEst.monthly * (D > 0 ? uncoveredDays/D : 0));

  const sideEst = sideGigEstimate();
  const sideFutureRaw = rest ? sideGigIncomeInRange(rest, to) : 0;

    : [jobEst.confidence, sideEst.confidence].includes('medium') ? 'medium' : 'high';

    received, scheduled, expected, income, awaitingStub,
    low, high: round2(income + spread),
    spread, cost,
    net: round2(income - cost),
    netLow: round2(low - cost),

}

/* =========================================================
   GOALS

   A goal asks: to hold `target` on `targetDate` while still paying for life
   along the way, how much has to come in from outside the main job, and what
   does that mean per week?

   Two rules this code now holds to that it previously didn't:

   1. The pace and the weekly plan are derived from the SAME week count. They
      used to disagree — the pace divided by unaligned weeks-from-today while
      the plan listed Sunday-aligned weeks and rounded up, so the plan's rows
      summed to more than the goal actually required.
   2. Progress is graded against the pace the goal was CREATED with, not
      against a pace recomputed from today. Re-deriving the target every render
      makes the past move: bank a lump sum and every previously-missed week
      retroactively becomes a hit.
========================================================= */
/* The Sunday-aligned weeks still to play, from the current week through the
   week containing the deadline. This one list defines the horizon; the pace is
   whatever it takes to cover the need across exactly these weeks. */
const GOAL_MAX_WEEKS = 2610;   // ~50 years; a horizon no plan needs to exceed

  const today = todayISO();
  if(!isValidISO(g.targetDate) || g.targetDate < today) return [];
  const out = [];
  let weekStart = startOfWeek(today);
  for(let i=0; i<GOAL_MAX_WEEKS && weekStart <= g.targetDate; i++){
    out.push({ n:i+1, weekStart, weekEnd: addDays(weekStart, 6) });
    weekStart = addDays(weekStart, 7);
  }
  return out;
}
/* The number of weeks the pace is divided by. It has to be the TRUE horizon,
   not the number of rows we are willing to draw: a 20-year goal capped at 520
   rows divided the need by 520 while the upkeep term still covered 20 years,
   telling the user to save exactly double what the goal required — and the
   plan's last row landed a decade before the deadline. */

  const today = todayISO();
  if(!isValidISO(g.targetDate) || g.targetDate < today) return 0;
  return Math.max(Math.ceil(weeksBetween(startOfWeek(today), g.targetDate)), 1);

/* Records where the goal stood each week, so progress is a measured history

function recordGoalProgress(g){

  const today = todayISO();
  const wk = startOfWeek(today);
  if(g.targetDate && today > g.targetDate) return;
  if(g.progress.some(p=>p.week === wk)) return;

function goalStatsUncached(g){

  // Living costs still to be covered before the deadline, on top of the gap
  // to the target balance.
  const upkeep = round2(EE * M);

  const TN_max = round2(Math.max(maxTarget - A, 0) + upkeep);
  const outsideNeeded_min = Math.max(round2(TN_min - jobWindow), 0);
  const outsideNeeded_max = Math.max(round2(TN_max - jobWindow), 0);

  /* Divide by the real horizon so pace x weeks == need. When the deadline has

  const weeklyPace_max = nWeeks>0 ? round2(outsideNeeded_max/nWeeks) : 0;

  // neutral rather than being stamped "Behind" the moment it's created.

  // Progress toward the balance target, and toward the effort the plan asked for.
  const progress = maxTarget>0 ? Math.min(Math.max(A/maxTarget,0),1) : (A>0?1:0);

  const shortfall = round2(minTarget - projectedBalance);

    A, minTarget, maxTarget, valid: validDates,
    weeksRemaining:W, monthsRemaining:M, planWeeks:nWeeks, weeks, overdue,
    upkeep, neededMin:TN_min, neededMax:TN_max, jobWindow,

    startingSavings, savedSinceStart, avgWeeklySaved,
