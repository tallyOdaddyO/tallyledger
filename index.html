  const searchInput = wrap.querySelector('#expense-search');
  const itemById = new Map(state.expenses.items.map(i=>[i.id, i]));
  function applyFilter(){
    const q = expenseSearchQuery.trim().toLowerCase();
    let shown = 0;
    wrap.querySelectorAll('tr.exp-row').forEach(tr=>{
      const it = itemById.get(tr.dataset.id);
      const hit = !q || (it && ((it.name||'') + ' ' + (it.category||'')).toLowerCase().includes(q));
      tr.hidden = !hit;
      if(hit) shown++;
    });
    // Hide category groups and sections that no longer have a visible row.
    wrap.querySelectorAll('.cat-group').forEach(g=>{
      g.hidden = !g.querySelector('tr.exp-row:not([hidden])');
    });
    const countEl = wrap.querySelector('#search-count');
    if(countEl) countEl.textContent = q ? (shown + ' of ' + state.expenses.items.length + ' shown') : '';
    const none = wrap.querySelector('#search-empty');
    if(none) none.hidden = !(q && shown === 0);
    syncSelectionUi();
  }
  searchInput.addEventListener('input', e=>{
    expenseSearchQuery = e.target.value;
    applyFilter();
  });

  /* Selection is scoped to what is actually on screen. Previously you could
     select rows, change the search, and then "Delete Selected" would destroy
     items you could no longer see, confirmed by a dialog that named only a
     count. Now the delete is limited to visible rows and names them. */
  function visibleRowIds(){
    return Array.from(wrap.querySelectorAll('tr.exp-row:not([hidden])')).map(tr=>tr.dataset.id);
  }
  function syncSelectionUi(){
    const vis = visibleRowIds();
    const chosen = vis.filter(id=>selectedExpenseIds.has(id));
    const all = wrap.querySelector('#select-all-expenses');
    all.checked = vis.length>0 && chosen.length===vis.length;
    all.indeterminate = chosen.length>0 && chosen.length<vis.length;
    const btn = wrap.querySelector('#delete-selected-expenses');
    btn.disabled = chosen.length===0;
    btn.textContent = 'Delete Selected (' + chosen.length + ')';
  }
  wrap.querySelector('#select-all-expenses').addEventListener('change', e=>{
    const vis = visibleRowIds();
    vis.forEach(id=> e.target.checked ? selectedExpenseIds.add(id) : selectedExpenseIds.delete(id));
    wrap.querySelectorAll('.exp-select').forEach(cb=>{ cb.checked = selectedExpenseIds.has(cb.dataset.id); });
    syncSelectionUi();
  });
  wrap.querySelectorAll('.exp-select').forEach(cb=>{
    cb.addEventListener('change', e=>{
      const id = e.target.dataset.id;
      if(e.target.checked) selectedExpenseIds.add(id); else selectedExpenseIds.delete(id);
      syncSelectionUi();
    });
  });
  applyFilter();

  wrap.querySelector('#delete-selected-expenses').addEventListener('click', ()=>{
    const ids = visibleRowIds().filter(id=>selectedExpenseIds.has(id));
    if(ids.length===0) return;
    const removed = state.expenses.items.filter(i=>ids.includes(i.id));
    const names = removed.slice(0,6).map(i=>i.name).join(', ') + (removed.length>6 ? `, and ${removed.length-6} more` : '');
    if(!confirm(`Delete ${removed.length} expense(s)?\n\n${names}`)) return;
    const logs = {};
    Object.keys(state.expenses.monthlyLog).forEach(k=>{
      if(ids.includes(k.split('|')[0])){ logs[k]=state.expenses.monthlyLog[k]; delete state.expenses.monthlyLog[k]; }
    });
    state.expenses.items = state.expenses.items.filter(i=>!ids.includes(i.id));
    ids.forEach(id=>selectedExpenseIds.delete(id));
    pruneOrphanLogs();
    scheduleSave(); render();
    toast(`Deleted ${removed.length} expense(s)`, {kind:'ok', actionLabel:'Undo', onAction:()=>{
      state.expenses.items = state.expenses.items.concat(removed);
      Object.assign(state.expenses.monthlyLog, logs);
      scheduleSave(); render();
    }});
  });
  wrap.querySelector('#delete-all-expenses').addEventListener('click', ()=>{
    const n = state.expenses.items.length;
    if(n===0) return;
    confirmDestructive({
      title: `Delete all ${n} expenses?`,
      desc: 'This erases your entire expense list and every logged payment. Export a backup first if you want a copy.',
      confirmWord: 'DELETE',
      onConfirm(){
        const items = state.expenses.items, logs = state.expenses.monthlyLog;
        state.expenses.items = [];
        state.expenses.monthlyLog = {};
        state.dismissedPending = [];
        selectedExpenseIds.clear();
        scheduleSave(); render();
        toast(`Deleted all ${n} expenses`, {kind:'ok', actionLabel:'Undo', ms:15000, onAction:()=>{
          state.expenses.items = items; state.expenses.monthlyLog = logs;
          scheduleSave(); render();
        }});
      }
    });
  });

  attachExpenseEvents(wrap);
  return wrap;
}

/* Option lists were hand-written 8 times for members and 3 times for
   categories, each with its own escaping (or lack of it). */
function memberOptions(selectedId, sharedLabel){
  return (sharedLabel ? `<option value="">${esc(sharedLabel)}</option>` : '') +
    state.members.map(m=>`<option value="${esc(m.id)}" ${m.id===selectedId?'selected':''}>${esc(m.name)}</option>`).join('');
}
function catOptions(selected){
  return ALL_CATS.map(c=>`<option value="${esc(c)}" ${c===selected?'selected':''}>${esc(c)}</option>`).join('');
}
function expenseTableBody(items){
  const tbody = document.createElement('tbody');
  items.forEach(item=>{
    const nm = esc(item.name);
    const freqOpts = ['monthly','biweekly','variable','onetime'].map(f=>`<option value="${f}" ${f===item.frequency?'selected':''}>${f==='onetime'?'one-time':f}</option>`).join('');
    const dateField = item.frequency==='biweekly'
      ? `<input type="date" class="ex-field" data-field="anchorDate" value="${esc(item.anchorDate||'')}" aria-label="Anchor date for ${nm}">`
      : item.frequency==='monthly'
        ? `<input type="number" class="ex-field" data-field="dueDay" min="1" max="31" value="${esc(item.dueDay||1)}" aria-label="Day of month ${nm} is due" style="width:60px;">`
        : item.frequency==='onetime'
          ? `<input type="date" class="ex-field" data-field="date" value="${esc(item.date||'')}" aria-label="Purchase date for ${nm}">`
          : `<span class="muted-2">—</span>`;
    const notes = [];
    if(item.endDate) notes.push('ends ' + dispDate(item.endDate));
    if(item.startDate && item.startDate > monthStartISO(...monthKey(todayISO()).split('-').map(Number)))
      notes.push('starts ' + dispDate(item.startDate));
    const noteLine = notes.length
      ? `<div style="font-size:10.5px;color:var(--muted);margin-top:2px;">${esc(notes.join(' · '))}</div>` : '';
    const whoCell = state.members.length>1
      ? `<td><select class="ex-field" data-field="memberId" aria-label="Who ${nm} belongs to">${memberOptions(item.memberId,'Shared')}</select></td>`
      : '';
    // The three status actions used to live only behind a right-click menu,
    // which no keyboard and no touch device could ever reach.
    const actions = item.status==='flagged'
      ? `<button class="btn btn-sm" data-action="reactivate">Keep</button> <button class="btn btn-sm btn-danger" data-action="cancelnow">Cancel</button>`
      : item.status==='cancelled'
        ? `<button class="btn btn-sm" data-action="reactivate">Restore</button>`
        : `<button class="icon-btn ex-menu kebab" aria-label="Actions for ${nm}" aria-haspopup="menu">⋯</button>
           <button class="icon-btn ex-del" aria-label="Delete ${nm}">×</button>`;
    tbody.appendChild(elAll(`
      <tr class="exp-row ${esc(item.status)}" data-id="${esc(item.id)}">
        <td class="col-tight"><input type="checkbox" class="exp-select" data-id="${esc(item.id)}" aria-label="Select ${nm}" ${selectedExpenseIds.has(item.id)?'checked':''}></td>
        <td><input type="text" class="ex-field exp-name" data-field="name" value="${nm}" aria-label="Expense name">${noteLine}</td>
        <td><select class="ex-field" data-field="category" aria-label="Category for ${nm}">${catOptions(item.category)}</select></td>
        ${whoCell}
        <td class="money"><input type="number" step="0.01" class="ex-field" data-field="amount" value="${round2(item.amount)}" aria-label="Amount for ${nm}" style="width:92px;"></td>
        <td><select class="ex-field" data-field="frequency" aria-label="How often ${nm} recurs">${freqOpts}</select></td>
        <td>${dateField}</td>
        <td class="col-tight">${actions}</td>
      </tr>
    `));
  });
  return tbody;
}

function attachExpenseEvents(root){
  root.querySelectorAll('.ex-field').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const id = e.target.closest('tr').dataset.id, field = e.target.dataset.field;
      const item = state.expenses.items.find(x=>x.id===id); if(!item) return;
      if(!setEntryField(item, field, e.target.value, e.target)) return;
      scheduleSave(); render();
    });
  });
  root.querySelectorAll('.ex-menu').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const id = e.target.closest('tr').dataset.id;
      const item = state.expenses.items.find(x=>x.id===id);
      const r = e.target.getBoundingClientRect();
      if(item) showCtxMenu(r.left, r.bottom + 4, item, e.target);
    });
  });
  root.querySelectorAll('.ex-del').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const id = e.target.closest('tr').dataset.id;
      deleteExpenseWithUndo(id);
    });
  });
  root.querySelectorAll('[data-action="reactivate"]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const item = state.expenses.items.find(x=>x.id===e.target.closest('tr').dataset.id);
      if(item) setExpenseStatus(item, 'active');
    });
  });
  root.querySelectorAll('[data-action="cancelnow"]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const item = state.expenses.items.find(x=>x.id===e.target.closest('tr').dataset.id);
      if(item) setExpenseStatus(item, 'cancelled');
    });
  });
  root.querySelectorAll('tr.exp-row').forEach(row=>{
    row.addEventListener('contextmenu', e=>{
      e.preventDefault();
      const item = state.expenses.items.find(x=>x.id===row.dataset.id);
      if(item) showCtxMenu(e.clientX, e.clientY, item, row.querySelector('.ex-menu'));
    });
  });
}

/* Removes an expense along with the payment history keyed to it, and offers
   the whole thing back for a few seconds. Deleting used to be instant and
   permanent, and left orphaned monthlyLog rows that kept showing up in the
   history table forever. */
function deleteExpenseWithUndo(id){
  const idx = state.expenses.items.findIndex(x=>x.id===id);
  if(idx === -1) return;
  const item = state.expenses.items[idx];
  const logs = {};
  Object.keys(state.expenses.monthlyLog).forEach(k=>{
    if(k.split('|')[0]===id){ logs[k] = state.expenses.monthlyLog[k]; delete state.expenses.monthlyLog[k]; }
  });
  state.expenses.items.splice(idx, 1);
  selectedExpenseIds.delete(id);
  pruneOrphanLogs();
  scheduleSave(); render();
  toast('Deleted "' + item.name + '"', { kind:'ok', actionLabel:'Undo', onAction:()=>{
    state.expenses.items.splice(Math.min(idx, state.expenses.items.length), 0, item);
    Object.assign(state.expenses.monthlyLog, logs);
    scheduleSave(); render();
    toast('Restored "' + item.name + '"', {kind:'ok'});
  }});
}
function setExpenseStatus(item, status){
  const prev = item.status;
  item.status = status;
  scheduleSave(); render();
  if(prev !== status){
    toast(item.name + ' → ' + status, { actionLabel:'Undo', onAction:()=>{
      item.status = prev; scheduleSave(); render();
    }});
  }
}
function showCtxMenu(x, y, item, opener){
  closeCtxMenu();
  const menu = el(`<div class="ctx-menu" role="menu"></div>`);
  const addBtn = (label, fn, danger)=>{
    const b = el(`<button role="menuitem" ${danger?'class="danger"':''}>${esc(label)}</button>`);
    b.addEventListener('click', ()=>{ closeCtxMenu(); fn(); });
    menu.appendChild(b);
    return b;
  };
  if(item.status==='active')      addBtn('Flag for cancellation', ()=> setExpenseStatus(item,'flagged'));
  else if(item.status==='flagged'){
    addBtn('Keep active', ()=> setExpenseStatus(item,'active'));
    addBtn('Cancel now', ()=> setExpenseStatus(item,'cancelled'), true);
  } else addBtn('Restore', ()=> setExpenseStatus(item,'active'));
  if(item.frequency !== 'variable') addBtn(item.endDate ? 'Change end date…' : 'Set end date…', ()=> openEndDateModal(item));
  addBtn('Delete permanently', ()=> deleteExpenseWithUndo(item.id), true);

  document.body.appendChild(menu);
  // Clamp into the viewport — a fixed-position menu opened near the right or
  // bottom edge used to render partly off-screen with no way to reach it.
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.max(8, Math.min(x, window.innerWidth  - r.width  - 8)) + 'px';
  menu.style.top  = Math.max(8, Math.min(y, window.innerHeight - r.height - 8)) + 'px';
  ctxMenuState = { menu, opener: opener || null };

  const items = Array.from(menu.querySelectorAll('button'));
  if(items.length) items[0].focus();
  menu.addEventListener('keydown', e=>{
    const i = items.indexOf(document.activeElement);
    if(e.key==='ArrowDown'){ e.preventDefault(); items[(i+1)%items.length].focus(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); items[(i-1+items.length)%items.length].focus(); }
    else if(e.key==='Escape'){ e.preventDefault(); closeCtxMenu(); }
  });
  setTimeout(()=>{
    document.addEventListener('click', closeCtxMenu, {once:true});
    window.addEventListener('scroll', closeCtxMenu, {once:true, passive:true});
    window.addEventListener('resize', closeCtxMenu, {once:true});
  }, 0);
}

function openEndDateModal(item){
  openModal({
    title: "End date",
    desc: `Set when "${item.name}" stops recurring. Occurrences after this date won't be tracked or counted.`,
    bodyBuilder(body, close){
      body.appendChild(elAll(`
        <div class="field"><label for="ed-date">Ends on</label><input type="date" id="ed-date" value="${esc(item.endDate||'')}"></div>
        <div class="modal-actions">
          ${item.endDate ? '<button class="btn btn-danger" id="ed-clear">Clear end date</button>' : ''}
          <button class="btn" id="ed-cancel">Cancel</button>
          <button class="btn btn-gold" id="ed-save">Save</button>
        </div>
      `));
      body.querySelector('#ed-cancel').addEventListener('click', close);
      body.querySelector('#ed-clear')?.addEventListener('click', ()=>{
        item.endDate = null; scheduleSave(); close(); render();
      });
      body.querySelector('#ed-save').addEventListener('click', ()=>{
        const v = body.querySelector('#ed-date').value;
        item.endDate = v || null;
        scheduleSave(); close(); render();
      });
    }
  });
}
function closeCtxMenu(){
  if(!ctxMenuState) return;
  const {menu, opener} = ctxMenuState;
  ctxMenuState = null;
  menu.remove();
  if(opener && document.contains(opener)) opener.focus();
}

/* ---- Monthly history panel ---- */
/* Monthly history. The bodies are built only when a month is actually opened —
   they were 81% of every Expenses-tab render (measured ~30,000 elements and
   ~5,000 listeners for two years of data), all of it inside <details> that are
   closed by default. Which months are open now survives a re-render too. */
function renderHistoryPanel(){
  const panel = el(`<div class="panel"><div class="panel-head"><h2>Monthly History</h2><span class="muted" style="font-size:var(--fs-xs);">Completed months — open one to review or correct what was paid</span></div></div>`);
  const curMk = monthKey(todayISO());
  const months = monthsWithData().filter(mk => mk < curMk);
  if(months.length===0){
    panel.appendChild(el(`<div class="empty">No completed months yet — this fills in automatically once a month closes.</div>`));
    return panel;
  }
  months.slice().reverse().forEach(mk=>{
    const c = monthClose(mk);
    const det = el(`
      <details class="history-month" ${expandedHistoryMonths.has(mk)?'open':''}>
        <summary><span>${esc(monthLabel(mk))}</span><span class="net-preview" style="color:${c.net>=0?'var(--green)':'#EE6E63'}">${fmt(c.net)} net</span></summary>
        <div class="history-body"></div>
      </details>
    `);
    const body = det.querySelector('.history-body');
    const build = ()=>{
      if(body.dataset.built) return;
      body.dataset.built = '1';
      buildHistoryBody(body, mk, c);
    };
    det.addEventListener('toggle', ()=>{
      if(det.open){ expandedHistoryMonths.add(mk); build(); }
      else expandedHistoryMonths.delete(mk);
    });
    if(det.open) build();
    panel.appendChild(det);
  });
  return panel;
}
function buildHistoryBody(body, mk, c){
  body.appendChild(el(`
    <table class="month-table">
      <caption class="sr-only">Totals for ${esc(monthLabel(mk))}</caption>
      <thead><tr><th scope="col">Job</th><th scope="col">Side Gigs</th><th scope="col">Other</th><th scope="col">Costs</th><th scope="col">Net</th></tr></thead>
      <tbody><tr>
        <td class="mono">${fmt(c.job)}</td>
        <td class="mono">${fmt(c.side)}</td>
        <td class="mono">${fmt(c.other)}</td>
        <td class="mono">${fmt(c.exp)}</td>
        <td class="mono ${c.net>=0?'pos':'neg'}">${fmt(c.net)}</td>
      </tr></tbody>
    </table>
  `));
  body.appendChild(el(`<div class="eyebrow" style="margin-top:14px;">What this month was charged for — edit any amount to correct it</div>`));
  const {from, to} = monthRange(mk);
  const rows = [];
  state.expenses.items.forEach(item=>{
    if(item.status==='cancelled') return;
    // Ongoing budgets have no due date, so they never appeared in this list —
    // which meant the total above included them and the rows below didn't,
    // and the two could not be reconciled.
    if(item.frequency==='variable'){
      if(item.startDate && monthKey(item.startDate) > mk) return;
      if(item.endDate && monthKey(item.endDate) < mk) return;
      rows.push({item, occ:null, key:null, val:num(item.amount), isLogged:false, isBudget:true});
      return;
    }
    itemOccurrences(item, from, to).forEach(occ=>{
      const key = logKey(item.id, occ);
      const logged = state.expenses.monthlyLog[key];
      rows.push({item, occ, key, val: logged!==undefined ? num(logged) : num(item.amount), isLogged: logged!==undefined});
    });
  });
  if(rows.length===0){
    body.appendChild(el(`<div class="muted" style="font-size:var(--fs-sm);padding:6px 0;">No dated expense occurrences this month.</div>`));
    return;
  }
  const editBody = document.createElement('tbody');
  rows.sort((a,b)=>(a.occ||'').localeCompare(b.occ||'')).forEach(r=>{
    editBody.appendChild(el(`
      <tr ${r.key?`data-key="${esc(r.key)}"`:''}>
        <td>${esc(r.item.name)}${r.isBudget?' <span class="pill est">budget</span>':(r.isLogged?'':' <span class="pill est">est.</span>')}</td>
        <td class="muted" style="font-size:var(--fs-xs);">${r.occ?esc(dispDate(r.occ)):'—'}</td>
        <td class="money">${r.key
          ? `<input type="number" step="0.01" class="hist-edit" value="${round2(r.val)}" aria-label="Amount paid for ${esc(r.item.name)} on ${esc(dispDate(r.occ))}">`
          : `<span class="mono">${fmt(r.val)}</span>`}</td>
      </tr>
    `));
  });
  body.appendChild(scrollTable(editBody, 'Expense payments in ' + monthLabel(mk),
    [{label:'Item'},{label:'Date'},{label:'Amount paid'}]));
  body.querySelectorAll('.hist-edit').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const key = e.target.closest('tr').dataset.key;
      state.expenses.monthlyLog[key] = round2(e.target.value);
      scheduleSave();
      clearMemo();
      // Update the two figures this affects in place rather than rebuilding
      // the page and collapsing the month the user is working in.
      const c2 = monthClose(mk);
      const det = e.target.closest('details');
      const prev = det && det.querySelector('.net-preview');
      if(prev){ prev.textContent = fmt(c2.net) + ' net'; prev.style.color = c2.net>=0 ? 'var(--green)' : '#EE6E63'; }
      const cells = det && det.querySelectorAll('.month-table tbody td');
      if(cells && cells.length>=5){
        cells[3].textContent = fmt(c2.exp);
        cells[4].textContent = fmt(c2.net);
        cells[4].className = 'mono ' + (c2.net>=0?'pos':'neg');
      }
    });
  });
}

/* ===== pending payment check-in =====
   This used to open itself, unbidden, over whatever tab loaded first, with no
   backdrop dismissal and no Escape — and its softest-sounding button,
   "Skip for now", wrote every occurrence into dismissedPending permanently,
   with no UI anywhere to undo it. Those bills were then never asked about
   again and quietly skewed every future close-out.

   Now it is a banner the user chooses to open, and deferral is genuinely
   temporary; permanent dismissal is a separate, explicitly-labelled action. */
function pendingBanner(){
  const pend = pendingPayments();
  if(pend.length === 0) return null;
  const box = el(`
    <div class="panel" style="border-color:#6B4A1E;background:#221A10;display:flex;
         align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;">
      <div>
        <div style="font-weight:600;font-size:var(--fs-md);">${pend.length} bill${pend.length===1?'':'s'} came due recently</div>
        <div class="hint-sm" style="margin-top:2px;">Confirm what you actually paid so this month's close-out is accurate.</div>
      </div>
      <button class="btn btn-gold" id="pending-open">Review ${pend.length}</button>
    </div>`);
  box.querySelector('#pending-open').addEventListener('click', ()=> showPendingModal());
  return box;
}
function showPendingModal(){
  const pend = pendingPayments();
  openModal({
    title: 'Payment check-in',
    desc: pend.length === 0
      ? 'No unlogged payments due right now. Nice.'
      : 'Confirm what you actually paid — leave a row as-is if it matched the expected amount.',
    bodyBuilder(body, close){
      if(pend.length === 0){
        body.appendChild(el(`<div class="modal-actions"><button class="btn btn-gold" id="pm-close">Close</button></div>`));
        body.querySelector('#pm-close').addEventListener('click', close);
        return;
      }
      const list = document.createElement('div');
      pend.forEach(p=>{
        list.appendChild(el(`
          <div class="pending-item" data-key="${esc(p.key)}">
            <div>
              <div class="pi-name">${esc(p.item.name)}</div>
              <div class="pi-date">Due ${esc(dispDate(p.occ))} · expected ${fmt(p.item.amount)}</div>
            </div>
            <label class="sr-only" for="pm-${esc(p.key)}">Amount paid for ${esc(p.item.name)} due ${esc(dispDate(p.occ))}</label>
            <input type="number" step="0.01" id="pm-${esc(p.key)}" value="${round2(p.item.amount)}">
          </div>`));
      });
      body.appendChild(list);
      body.appendChild(el(`
        <div class="modal-actions" style="justify-content:space-between;">
          <button class="btn btn-danger btn-sm" id="pm-never">Don't ask about these again</button>
          <span style="display:flex;gap:8px;">
            <button class="btn" id="pm-later">Remind me later</button>
            <button class="btn btn-gold" id="pm-save">Save All</button>
          </span>
        </div>`));
      body.querySelector('#pm-later').addEventListener('click', ()=>{
        close();  // genuinely temporary — nothing is written, it returns next session
        toast('Left for later — the banner will still be on your Dashboard');
      });
      body.querySelector('#pm-never').addEventListener('click', ()=>{
        if(!confirm(`Permanently stop asking about these ${pend.length} payment(s)? They'll be left out of your monthly close-out.`)) return;
        state.dismissedPending = Array.from(new Set(state.dismissedPending.concat(pend.map(p=>p.key))));
        scheduleSave(); close(); render();
        toast('Dismissed ' + pend.length + ' payment(s)', {kind:'ok'});
      });
      body.querySelector('#pm-save').addEventListener('click', ()=>{
        let n = 0;
        list.querySelectorAll('.pending-item').forEach(row=>{
          state.expenses.monthlyLog[row.dataset.key] = round2(row.querySelector('input').value);
          n++;
        });
        scheduleSave(); close(); render();
        toast('Logged ' + n + ' payment' + (n===1?'':'s'), {kind:'ok'});
      });
    }
  });
}

/* =========================================================
   TIMELINE TAB
========================================================= */
function colorForMemberOrDefault(memberId, fallback){
  const m = state.members.find(x=>x.id===memberId);
  return m ? m.color : fallback;
}
/* Every dated money movement in a window, signed: income positive, expenses
   negative. `amount` is always the signed effect on the balance, so callers
   can sum it directly and the display just formats it — a refund entered as a
   negative expense used to render as "-$50" in a red bill card while
   *increasing* the running balance. */
function timelineEvents(fromISO, toISO){
  const events = [];
  const today = todayISO();
  const nameOf = id => { const m = state.members.find(x=>x.id===id); return m ? ' — ' + m.name : ''; };

  // Only the store matching the current pay type, or a user who ever switched
  // gets both counted.
  if(state.job.payType === 'weeklyVariable'){
    (state.job.weeklyVariable.entries||[]).forEach(e=>{
      if(!inRange(e.weekEnd, fromISO, toISO)) return;
      // `isFinal` was never written anywhere, so this read was always undefined
      // and every weekly paycheck was labelled "(week to date)" forever.
      const closed = e.weekEnd <= today;
      events.push({date:e.weekEnd, type:'income', label:'Weekly pay'+(closed?'':' (week to date)')+nameOf(e.memberId),
                   amount:num(e.amount), memberId:e.memberId, isProjected:!closed});
    });
  } else {
    state.job.periods.forEach(p=>{
      if(!inRange(p.payDate, fromISO, toISO)) return;
      const r = jobPeriodNetUsed(p);
      events.push({date:p.payDate, type:'income', label:'Paycheck'+nameOf(p.memberId),
                   amount:r.val, memberId:p.memberId, isProjected:(!r.actual || p.payDate>today)});
    });
  }
  state.sideGig.entries.forEach(e=>{
    if(!inRange(e.date, fromISO, toISO)) return;
    events.push({date:e.date, type:'income', label:(e.source||'Side gig')+nameOf(e.memberId),
                 amount:num(e.amount), memberId:e.memberId, isProjected:e.date>today});
  });
  state.otherIncome.entries.forEach(e=>{
    if(!inRange(e.date, fromISO, toISO)) return;
    events.push({date:e.date, type:'income', label:(e.label||'Other income')+nameOf(e.memberId),
                 amount:num(e.amount), memberId:e.memberId, isProjected:e.date>today});
  });
  state.expenses.items.forEach(item=>{
    if(item.status==='cancelled') return;
    if(item.frequency==='variable'){
      // An ongoing budget has no due date, so it never touched the projected
      // balance — a $600/mo grocery budget was invisible to the runway.
      // Spread it evenly across the window as a daily drip.
      const perDay = num(item.amount)/30.44;
      const start = (item.startDate && item.startDate > fromISO) ? item.startDate : fromISO;
      const end = (item.endDate && item.endDate < toISO) ? item.endDate : toISO;
      const days = daysBetween(start, end) + 1;
      if(days > 0 && perDay > 0){
        events.push({date:end, type:'expense', label:item.name+' (budget)'+nameOf(item.memberId),
                     amount:-round2(perDay*days), memberId:item.memberId, isProjected:true, isBudget:true});
      }
      return;
    }
    itemOccurrences(item, fromISO, toISO).forEach(occ=>{
      const logged = state.expenses.monthlyLog[logKey(item.id, occ)];
      const amt = (logged!==undefined) ? num(logged) : num(item.amount);
      events.push({date:occ, type:'expense', label:item.name+nameOf(item.memberId),
                   amount:-amt, memberId:item.memberId, isProjected: occ > today});
    });
  });
  events.sort((a,b)=> a.date===b.date ? (a.type==='income'?-1:1) : a.date.localeCompare(b.date));
  return events;
}

function renderTimeline(){
  const wrap = document.createElement('div');
  const panel = el(`<div class="panel" style="padding:24px;"></div>`);
  panel.appendChild(el(`
    <div class="panel-head">
      <h2 style="font-size:20px;">Timeline</h2>
      <div class="sub-tabs" style="margin-bottom:0;">
        <button id="tl-mode-projection" class="${state.settings.dashboardMode!=='needed'?'active':''}">Averaged Projection</button>
        <button id="tl-mode-needed" class="${state.settings.dashboardMode==='needed'?'active':''}">Needed to break even</button>
      </div>
    </div>
  `));

  if(state.settings.dashboardMode==='needed'){
    const needed = neededIncomeThisMonth();
    panel.appendChild(el(`<div class="auth-ok" style="margin-bottom:14px;">You need ${fmt0(needed)} more this month to cover expenses already scheduled, on top of what's already come in.</div>`));
  }

  const windowDays = 60;
  const today = todayISO();
  const from = addDays(today, -7);
  const to = addDays(today, windowDays);
  const events = timelineEvents(from, to);
  const startBalance = currentBalance();

  // The projected balance, drawn and dated.
  const runway = runwayPoints(windowDays);
  const lowest = runway.reduce((a,b)=> b.balance < a.balance ? b : a, runway[0]);
  panel.appendChild(chartCard('Projected balance',
    lowest.balance < 0
      ? `Dips to ${fmt(lowest.balance)} on ${dispDate(lowest.date)}.`
      : `Low point ${fmt(lowest.balance)} on ${dispDate(lowest.date)}.`,
    chartRunway(runway), [[CHART_COLORS.job,'Running balance']],
    'Nothing scheduled to project yet.'));

  panel.appendChild(el(`
    <div class="assump-row">
      <div class="assump-item" style="min-width:280px;">
        <div class="field-label">Balance today</div>
        <div class="mono" style="font-size:var(--fs-lg);padding:6px 0;">${fmt(startBalance)}</div>
        <div class="desc">${state.goals[0] ? `From your "${esc(state.goals[0].name)}" goal's current savings.` : 'No goal set yet — showing $0 as a baseline. Add a goal for a real starting point.'}</div>
      </div>
    </div>
  `));

  const legend = el(`<div style="display:flex;gap:16px;flex-wrap:wrap;margin:4px 0 18px;font-size:var(--fs-xs);color:var(--muted);"></div>`);
  legend.appendChild(el(`<span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:14px;height:14px;border-radius:4px;background:#1E5B3E;display:inline-block;"></span>Income (confirmed)</span>`));
  legend.appendChild(el(`<span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:14px;height:14px;border-radius:4px;background:#1E5B3E;display:inline-block;border:1px dashed #ECBA79;"></span>Income (expected)</span>`));
  legend.appendChild(el(`<span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:14px;height:14px;border-radius:4px;background:#5C231F;display:inline-block;"></span>Bill</span>`));
  state.members.forEach(m=> legend.appendChild(el(`<span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:8px;height:8px;border-radius:50%;background:${esc(m.color)};display:inline-block;"></span>${esc(m.name)}'s items</span>`)));
  panel.appendChild(legend);

  if(events.length===0){
    panel.appendChild(el(`<div class="empty">Nothing scheduled in the next ${windowDays} days yet — add pay periods or expense due dates to see them here.</div>`));
    panel.querySelector('#tl-mode-projection').addEventListener('click', ()=>{ state.settings.dashboardMode='projection'; scheduleSave(); render(); });
    panel.querySelector('#tl-mode-needed').addEventListener('click', ()=>{ state.settings.dashboardMode='needed'; scheduleSave(); render(); });
    wrap.appendChild(panel);
    return wrap;
  }

  // group events by date, chronological
  const byDate = {};
  const dateOrder = [];
  events.forEach(ev=>{
    if(!byDate[ev.date]){ byDate[ev.date] = []; dateOrder.push(ev.date); }
    byDate[ev.date].push(ev);
  });
  // Today always gets a column, even on a quiet day. Without it the strip loses
  // its only anchor — the past/future boundary simply isn't drawn anywhere.
  if(!byDate[today]){ byDate[today] = []; dateOrder.push(today); }
  dateOrder.sort();

  const strip = el(`<div tabindex="0" role="region" aria-label="Timeline of income and bills, day by day"
    style="display:flex;gap:16px;overflow-x:auto;padding:10px 4px 28px;align-items:flex-start;"></div>`);
  let todayCol = null;

  const shownDates = dateOrder.slice(0, TIMELINE_MAX_DAYS);
  shownDates.forEach(dateISO=>{
    const dayEvents = byDate[dateISO];
    const isToday = dateISO===today;
    const col = document.createElement('div');
    col.style.cssText = 'flex:0 0 220px;min-width:200px;';
    if(isToday) todayCol = col;
    col.appendChild(el(`
      <div style="text-align:center;padding-bottom:8px;margin-bottom:10px;border-bottom:2px solid ${isToday?'var(--gold)':'var(--border)'};">
        <div class="mono" style="font-size:var(--fs-sm);font-weight:700;color:${isToday?'var(--gold)':'var(--text)'};">${esc(dispDateShort(dateISO))}</div>
        ${isToday?'<div style="font-size:9px;color:var(--gold);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;">Today</div>':''}
      </div>
    `));

    /* Capping the number of DAYS wasn't enough: a single day can carry
       hundreds of bills, and each card is five nodes. Cap the cards per day
       too, and say what was left out. */
    const incomes = dayEvents.filter(e=>e.type==='income');
    const expensesToday = dayEvents.filter(e=>e.type==='expense');
    const hiddenCount = Math.max(incomes.length - TIMELINE_MAX_PER_DAY, 0) +
                        Math.max(expensesToday.length - TIMELINE_MAX_PER_DAY, 0);
    incomes.slice(0, TIMELINE_MAX_PER_DAY).forEach(ev=>{
      const dotColor = colorForMemberOrDefault(ev.memberId, 'var(--muted-2)');
      // #E2932E on this green measured 3.2:1; #ECBA79 clears 4.5:1.
      const textColor = ev.isProjected ? '#ECBA79' : '#FFFFFF';
      const border = ev.isProjected ? 'border:2px dashed #ECBA79;' : 'border:2px solid transparent;';

            <span style="width:8px;height:8px;border-radius:50%;background:${esc(dotColor)};display:inline-block;flex-shrink:0;"></span>
            <span>${esc(ev.label)}</span>
            ${ev.isProjected?'<span class="pill est" style="margin-left:auto;">est.</span>':''}
          </div>
          <div class="mono" style="font-size:19px;font-weight:700;margin-top:6px;">${esc(fmtSigned(ev.amount))}</div>
        </div>
      `));
    });
    expensesToday.slice(0, TIMELINE_MAX_PER_DAY).forEach(ev=>{
      const dotColor = colorForMemberOrDefault(ev.memberId, 'var(--muted-2)');
      col.appendChild(el(`
        <div style="background:#5C231F;border:2px ${ev.isBudget?'dashed #B4BAC4':'solid transparent'};border-radius:10px;padding:14px 16px;margin-bottom:10px;color:#C6CBD3;">
          <div style="display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);line-height:1.35;">
            <span style="width:8px;height:8px;border-radius:50%;background:${esc(dotColor)};display:inline-block;flex-shrink:0;"></span>
            <span>${esc(ev.label)}</span>
          </div>
          <div class="mono" style="font-size:19px;font-weight:700;margin-top:6px;">${esc(fmtSigned(ev.amount))}</div>
        </div>
      `));
    });
    if(hiddenCount > 0){
      col.appendChild(el(`<div class="hint-sm" style="text-align:center;padding:8px;border:1px dashed var(--border);border-radius:8px;">
        +${hiddenCount} more on this day · included in the balance below</div>`));
    }
    if(dayEvents.length === 0){
      col.appendChild(el(`<div class="hint-sm" style="text-align:center;padding:14px 8px;">Nothing due today</div>`));
    }
    strip.appendChild(col);
  });

  if(dateOrder.length > shownDates.length){
    strip.appendChild(el(`<div style="flex:0 0 200px;align-self:center;text-align:center;color:var(--muted);font-size:var(--fs-sm);">
      +${dateOrder.length - shownDates.length} more day${dateOrder.length - shownDates.length===1?'':'s'} in this window.<br>
      The balance figures below still include them.</div>`));
  }
  panel.appendChild(strip);
  // The Today column could start hundreds of pixels off-screen with nothing
  // scrolling it into view.
  if(todayCol) requestAnimationFrame(()=>{ strip.scrollLeft = Math.max(todayCol.offsetLeft - 16, 0); });

  /* The running balance starts from the balance as it stands TODAY, so only
     future events move it. The old loop replayed the previous seven days on
     top of a today-dated balance, double counting that week's whole swing. */
  const ending = runway[runway.length-1].balance;
  panel.appendChild(el(`<div style="text-align:right;font-size:var(--fs-md);margin-top:10px;">Balance at the end of this window: <span class="mono" style="font-weight:700;color:${ending>=0?'var(--green)':'#EE6E63'}">${fmt(ending)}</span></div>`));
  if(lowest.balance < 0){
    panel.appendChild(el(`<div class="auth-err" style="margin-top:14px;">Heads up — the balance goes negative around <strong>${esc(dispDate(lowest.date))}</strong>, reaching <strong class="mono">${fmt(lowest.balance)}</strong>. A bill lands before enough income does.</div>`));
  }

  panel.querySelector('#tl-mode-projection').addEventListener('click', ()=>{ state.settings.dashboardMode='projection'; scheduleSave(); render(); });
  panel.querySelector('#tl-mode-needed').addEventListener('click', ()=>{ state.settings.dashboardMode='needed'; scheduleSave(); render(); });

  wrap.appendChild(panel);
  return wrap;
}

/* =========================================================
   SETTINGS TAB
========================================================= */
function renderSettings(){
  const wrap = document.createElement('div');
  const panel = el(`<div class="panel"></div>`);
  panel.appendChild(el(`<div class="panel-head"><h2>Settings</h2></div>`));
  panel.appendChild(el(`
    <div class="field"><div class="field-label">Signed in as</div><div class="mono" style="padding:8px 0;">${session ? session.user.email : ''}</div></div>
  `));

  panel.appendChild(el(`<div class="eyebrow" style="margin-top:20px;">Preferences</div>`));
  const prefRow = el(`
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:8px;max-width:460px;">
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;">
        <input type="checkbox" id="pref-sidegigs" ${state.settings.sideGigsEnabled?'checked':''}> Track side gigs
      </label>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;">
        <input type="checkbox" id="pref-otherincome" ${state.settings.otherIncomeEnabled?'checked':''} ${state.otherIncome.entries.length>0?'disabled':''}> Show an "Other Income" tab
      </label>
      ${state.otherIncome.entries.length>0 ? `<div class="muted" style="font-size:11px;margin-top:-6px;">Locked on — you have ${state.otherIncome.entries.length} entr${state.otherIncome.entries.length===1?'y':'ies'} there. Delete them all first if you want to hide this tab.</div>` : ''}
      <div class="field-row" style="margin-top:4px;">
        <div class="field"><label for="pref-bonuses">Bonuses on pay periods?</label>
          <select id="pref-bonuses">
            <option value="no" ${!state.settings.jobHasBonuses?'selected':''}>No</option>
            <option value="yes" ${state.settings.jobHasBonuses?'selected':''}>Yes, sometimes</option>
          </select>
        </div>
      </div>
      <div class="muted" style="font-size:11px;">Pay type (hourly / fixed salary / weekly) is now set directly on the Job Income tab, since that's where the related fields live.</div>
    </div>
  `);
  panel.appendChild(prefRow);
  panel.appendChild(el(`<button class="btn btn-sm" id="redo-onboarding" style="margin-top:14px;">Redo setup wizard</button>`));

  panel.appendChild(el(`<div class="eyebrow" style="margin-top:24px;">Household Members</div>`));
  panel.appendChild(el(`<div class="muted" style="font-size:11.5px;margin-bottom:8px;">Add a second person to split income and expenses side by side while still seeing the combined household total.</div>`));
  const membersBox = document.createElement('div');
  membersBox.style.display = 'flex';
  membersBox.style.flexDirection = 'column';
  membersBox.style.gap = '8px';
  membersBox.style.maxWidth = '460px';
  state.members.forEach(m=>{
    const row = el(`
      <div style="display:flex;gap:8px;align-items:center;background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;padding:8px 10px;">
        <input type="color" class="member-color" data-id="${esc(m.id)}" value="${esc(m.color)}" style="width:32px;height:32px;border:none;background:none;padding:0;cursor:pointer;">
        <input type="text" class="member-name" data-id="${esc(m.id)}" value="${esc(m.name)}" style="flex:1;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:13px;">
        ${state.members.length>1 ? `<button class="icon-btn member-del" data-id="${esc(m.id)}">×</button>` : ''}
      </div>
    `);
    membersBox.appendChild(row);
  });
  panel.appendChild(membersBox);
  if(state.members.length<2){
    panel.appendChild(el(`<button class="btn btn-sm btn-gold" id="add-member" style="margin-top:10px;">+ Add a second person</button>`));
  }

  panel.appendChild(el(`<div class="eyebrow" style="margin-top:28px;">Data</div>`));
  const dataRow = el(`
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
      <button class="btn" id="settings-export">Export backup</button>
      <button class="btn btn-danger" id="settings-reset">Reset all data</button>
    </div>
  `);
  panel.appendChild(dataRow);
  panel.appendChild(el(`<div class="eyebrow" style="margin-top:28px;">Danger zone</div>`));
  const dangerRow = el(`
    <div style="margin-top:8px;">
      <button class="btn btn-danger" id="settings-delete-account">Delete my account</button>
      <div class="muted" style="font-size:11.5px;margin-top:8px;max-width:420px;">Permanently deletes your account and all your household's data. This cannot be undone — export a backup first if you want to keep a copy.</div>
    </div>
  `);
  panel.appendChild(dangerRow);
  wrap.appendChild(panel);

  panel.querySelector('#pref-sidegigs').addEventListener('change', e=>{ state.settings.sideGigsEnabled = e.target.checked; scheduleSave(); render(); });
  panel.querySelector('#pref-otherincome').addEventListener('change', e=>{ state.settings.otherIncomeEnabled = e.target.checked; scheduleSave(); render(); });
  panel.querySelector('#pref-bonuses').addEventListener('change', e=>{ state.settings.jobHasBonuses = (e.target.value==='yes'); scheduleSave(); });
  panel.querySelector('#redo-onboarding').addEventListener('click', ()=>{
    state.settings.onboarded = false;
    scheduleSave();
    render();
  });
  panel.querySelectorAll('.member-color').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const m = state.members.find(x=>x.id===e.target.dataset.id);
      if(m){ m.color = e.target.value; scheduleSave(); render(); }
    });
  });
  panel.querySelectorAll('.member-name').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const m = state.members.find(x=>x.id===e.target.dataset.id);
      if(m){ m.name = e.target.value || 'Unnamed'; scheduleSave(); render(); }
    });
  });
  panel.querySelectorAll('.member-del').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const id = e.target.dataset.id;
      if(!confirm('Remove this person? Their entries will become unassigned (shared), not deleted.')) return;
      state.members = state.members.filter(x=>x.id!==id);
      state.job.periods.forEach(p=>{ if(p.memberId===id) p.memberId = null; });
      state.sideGig.entries.forEach(x=>{ if(x.memberId===id) x.memberId = null; });
      state.otherIncome.entries.forEach(x=>{ if(x.memberId===id) x.memberId = null; });
      state.expenses.items.forEach(x=>{ if(x.memberId===id) x.memberId = null; });
      scheduleSave(); render();
    });
  });
  const addMemberBtn = panel.querySelector('#add-member');
  if(addMemberBtn){
    addMemberBtn.addEventListener('click', ()=>{
      const palette = ['#5B9BD9','#A78BFA','#4CAF7D','#E2574C','#C9A227'];
      const usedColors = state.members.map(m=>m.color);
      const nextColor = palette.find(c=>!usedColors.includes(c)) || '#5B9BD9';
      state.members.push({ id: uid(), name: 'Person 2', color: nextColor });
      scheduleSave(); render();
    });
  }

  panel.querySelector('#settings-export').addEventListener('click', exportBackup);
  panel.querySelector('#settings-reset').addEventListener('click', ()=>{
    if(!confirm('This permanently erases everything in this ledger (income, expenses, goals). Consider exporting a backup first. Continue?')) return;
    state = defaultState();
    scheduleSave();
    render();
  });
  panel.querySelector('#settings-delete-account').addEventListener('click', async ()=>{
    if(!confirm('This permanently deletes your account and ALL your data. This cannot be undone. Are you sure?')) return;
    if(!confirm('Really sure? Type-to-confirm isn\'t available here, so this is your last check.')) return;
    try{
      const { error } = await sb.rpc('delete_my_account');
      if(error) throw error;
      session = null; profile = null; state = null;
      renderAuthGate();
    }catch(err){
      alert('Could not delete account: ' + ((err && err.message) || 'unknown error'));
    }
  });
  return wrap;
}

/* =========================================================
   ADMIN TAB
========================================================= */
function renderAdmin(){
  const wrap = document.createElement('div');

  wrap.appendChild(renderAdminCalculations());

  const panel = el(`<div class="panel"></div>`);
  panel.appendChild(el(`<div class="panel-head"><h2>Invite Codes</h2><button class="btn btn-gold" id="gen-code">+ Generate Code</button></div>`));
  const codesBody = document.createElement('div');
  codesBody.innerHTML = '<div class="muted" style="font-size:12px;">Loading…</div>';
  panel.appendChild(codesBody);

  const usersPanel = el(`<div class="panel"><div class="panel-head"><h2>Users</h2></div></div>`);
  const usersBody = document.createElement('div');
  usersBody.innerHTML = '<div class="muted" style="font-size:12px;">Loading…</div>';
  usersPanel.appendChild(usersBody);

  wrap.appendChild(panel);
  wrap.appendChild(usersPanel);

  async function loadCodes(){
    const { data, error } = await sb.from('invite_codes').select('*').order('created_at', {ascending:false});
    if(error){ codesBody.innerHTML = '<div class="muted" style="font-size:12px;">Could not load codes.</div>'; return; }
    if(!data || data.length===0){ codesBody.innerHTML = '<div class="empty">No codes generated yet.</div>'; return; }
    const tbl = document.createElement('table');
    tbl.innerHTML = '<thead><tr><th>Code</th><th>Created</th><th>Expires</th><th>Status</th><th>Redeemed by</th></tr></thead>';
    const tbody = document.createElement('tbody');
    const now = new Date();
    data.forEach(c=>{
      let status = 'active', label = 'Active';
      if(c.redeemed_by){ status='redeemed'; label='Redeemed'; }
      else if(c.expires_at && new Date(c.expires_at) < now){ status='expired'; label='Expired'; }
      tbody.appendChild(el(`
        <tr>
          <td><span class="code-pill">${esc(c.code)}</span></td>
          <td class="muted" style="font-size:var(--fs-xs);">${esc(dispDate(String(c.created_at||'').slice(0,10)))}</td>
          <td class="muted" style="font-size:var(--fs-xs);">${esc(dispDate(String(c.expires_at||'').slice(0,10)))}</td>
          <td><span class="status-badge ${status}">${label}</span></td>
          <td class="muted" style="font-size:var(--fs-xs);">${c.redeemed_by ? esc(String(c.redeemed_by).slice(0,8)) : '—'}</td>
        </tr>
      `));
    });
    tbl.appendChild(tbody);
    codesBody.innerHTML = '';
    wrapScroll(codesBody, tbl, 'Invite codes');
  }
  async function loadUsers(){
    const { data, error } = await sb.from('profiles').select('*').order('created_at', {ascending:false});
    if(error){ usersBody.innerHTML = '<div class="muted" style="font-size:12px;">Could not load users.</div>'; return; }
    if(!data || data.length===0){ usersBody.innerHTML = '<div class="empty">No users yet.</div>'; return; }
    const tbl = document.createElement('table');
    tbl.innerHTML = '<thead><tr><th scope="col">Email</th><th scope="col">Joined</th><th scope="col">Admin</th></tr></thead>';
    const tbody = document.createElement('tbody');
    data.forEach(u=>{
      tbody.appendChild(el(`
        <tr>
          <td>${esc(u.email)}</td>
          <td class="muted" style="font-size:var(--fs-xs);">${esc(dispDate(String(u.created_at||'').slice(0,10)))}</td>
          <td>${u.is_admin ? '<span class="status-badge active">Admin</span>' : '—'}</td>
        </tr>
      `));
    });
    tbl.appendChild(tbody);
    usersBody.innerHTML = '';
    wrapScroll(usersBody, tbl, 'Users');
  }

  panel.querySelector('#gen-code').addEventListener('click', async ()=>{
    const code = Array.from({length:8}, ()=> "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*32)]).join('');
    const { error } = await sb.from('invite_codes').insert({ code });
    if(error){ alert('Could not generate code: ' + error.message); return; }
    loadCodes();
  });

  loadCodes();
  loadUsers();
  return wrap;
}

/* Read-only dump of every live variable behind the Dashboard and Goals math,
   pulled straight from the same functions the app itself uses — never a
   re-implementation — so it can't drift from what's actually shown to users. */
function debugRow(label, formula, value, fmtFn){
  const f = fmtFn || fmt0;
  return `
    <tr>
      <td style="font-size:12.5px;font-weight:600;">${label}</td>
      <td class="muted" style="font-size:11px;font-family:'IBM Plex Mono',monospace;">${formula}</td>
      <td class="mono" style="font-weight:700;text-align:right;">${f(value)}</td>
    </tr>`;
}
function renderAdminCalculations(){
  const panel = el(`<div class="panel"></div>`);
  panel.appendChild(el(`<div class="panel-head"><h2>Calculations (Debug)</h2><span class="muted" style="font-size:11px;">Live values from your own household's data — read-only</span></div>`));

  const today = todayISO();
  const {from: mStart, to: mEnd} = currentMonthRange();
  const {D, R} = currentMonthDayCounts();
  const IM = currentMonthActualIncome();
  const EE = totalMonthlyExpenses();
  const N1 = IM - EE;
  const JR = jobMonthlyEstimate();
  const SR = sideGigMonthlyEstimate();
  const FR = JR + SR;
  const PMI = projectedMonthlyIncome();
  const PN = projectedMonthlyNet();
  const NeedTM = neededIncomeThisMonth();

  panel.appendChild(el(`<div class="eyebrow">Dashboard — this month (${mStart} to ${mEnd})</div>`));
  const tbl1 = document.createElement('table');
  tbl1.innerHTML = `<thead><tr><th>Var</th><th>Formula</th><th style="text-align:right;">Value</th></tr></thead>
    <tbody>
      ${debugRow('today','—', today, ()=>today)}
      ${debugRow('D (days in month)','monthEnd − monthStart + 1', D, v=>String(v))}
      ${debugRow('R (days remaining)','monthEnd − today + 1', R, v=>String(v))}
      ${debugRow('IM (Income This Month)','Σ confirmed income, monthStart→today', IM)}
      ${debugRow('EE (Est. Monthly Expenses)','totalMonthlyExpenses()', EE)}
      ${debugRow('N1 (Est. Monthly Net)','IM − EE', N1)}
      ${debugRow('JR (Job Rate/mo)','jobMonthlyEstimate()', JR)}
      ${debugRow('SR (Side Gig Rate/mo)','sideGigMonthlyEstimate() — mode: '+esc(state.settings.projectionMode), SR)}
      ${debugRow('FR (Full Rate/mo)','JR + SR', FR)}
      ${debugRow('PMI (Projected Monthly Income)', IM>0 ? 'IM + FR × (R/D)' : 'FR (no actual income yet this month)', PMI)}
      ${debugRow('PN (Projected Monthly Net)','PMI − EE', PN)}
      ${debugRow('NeedTM (Needed to break even)','max(EE − IM, 0)', NeedTM)}
    </tbody>`;
  wrapScroll(panel, tbl1, 'Dashboard calculation variables');

  if(state.goals.length===0){
    panel.appendChild(el(`<div class="empty" style="margin-top:14px;">No goals to show calculations for.</div>`));
    return panel;
  }

  state.goals.forEach(g=>{
    const s = goalStats(g);
    const plan = goalForwardWeeklyPlan(g);
    const retro = goalWeeklyRetrospective(g);
    panel.appendChild(el(`<div class="eyebrow" style="margin-top:22px;">Goal: ${esc(g.name)}</div>`));
    const tbl2 = document.createElement('table');
    tbl2.innerHTML = `<thead><tr><th>Var</th><th>Formula</th><th style="text-align:right;">Value</th></tr></thead>
      <tbody>
        ${debugRow('A (currently in account)','g.currentSavings', s.A)}
        ${debugRow('S_min / S_max (target)','g.minTarget / g.maxTarget', g.minTarget, ()=>fmt0(g.minTarget)+' / '+fmt0(g.maxTarget))}
        ${debugRow('W (weeks remaining)','weeksBetween(today, targetDate)', s.weeksRemaining, v=>v.toFixed(2))}
        ${debugRow('M (months remaining)','monthsBetween(today, targetDate)', s.monthsRemaining, v=>v.toFixed(2))}
        ${debugRow('TN_min','max(S_min−A,0) + EE×M', s.neededMin)}
        ${debugRow('TN_max','max(S_max−A,0) + EE×M', s.neededMax)}
        ${debugRow('JR×M (job contribution)','JR × M', s.jobWindow)}
        ${debugRow('OutsideNeeded_min','max(TN_min − JR×M, 0)', s.outsideNeededMin)}
        ${debugRow('OutsideNeeded_max','max(TN_max − JR×M, 0)', s.outsideNeededMax)}
        ${debugRow('WeeklyPace_min','OutsideNeeded_min / W', s.paceMin)}
        ${debugRow('WeeklyPace_max','OutsideNeeded_max / W', s.paceMax)}
        ${debugRow('Earned since start','outsideIncomeInRange(startDate, today)', s.earnedSinceStart)}
        ${debugRow('Avg weekly pace so far','earnedSinceStart / weeksPassedExact', s.avgWeeklyPaceSoFar)}
        ${debugRow('onTrack','outsideNeededMin≤0 OR avgPaceSoFar≥paceMin', s.onTrack, v=>String(v))}
        ${debugRow('Forward plan weeks','ceil(weeksBetween(startOfWeek(today), targetDate))', plan.count, v=>String(v))}
        ${debugRow('Retrospective: weeks passed / total','floor(daysPassed/7) / round(weeksBetween(...))', retro.weeksPassed, ()=>retro.weeksPassed+' / '+retro.totalWeeks)}
      </tbody>`;
    wrapScroll(panel, tbl2, 'Goal calculation variables');
  });

  return panel;
}

/* =========================================================
   BOOT
========================================================= */
function renderFatalError(title, message){
  const app = document.getElementById('app');
  app.innerHTML = '';
  const wrap = el(`
    <div class="auth-wrap">
      <div class="brand" style="justify-content:center;margin-bottom:22px;"><span class="stamp">T</span><h1>TALLY</h1></div>
      <div class="auth-card">
        <h3>${title}</h3>
        <div class="auth-err" style="margin-top:12px;" role="alert">${message}</div>
        <div class="modal-actions" style="justify-content:space-between;">
          <button class="btn" id="fatal-logout">Log out</button>
          <button class="btn btn-gold" id="fatal-retry">Try again</button>
        </div>
      </div>
    </div>
  `);
  app.appendChild(wrap);
  wrap.querySelector('#fatal-retry').addEventListener('click', ()=> boot());
  wrap.querySelector('#fatal-logout').addEventListener('click', ()=> logOutFlow());
}

/* Nothing observed auth state, so a sign-out in another tab left this one
   rendering a ledger it could no longer write to — with every failed save
   reported as "Offline — will sync". */
sb.auth.onAuthStateChange((event, s)=>{
  session = s;
  if(event === 'SIGNED_OUT' && state){
    state = null; profile = null;
    resetUiState();
    renderAuthGate();
  }
});
/* Any uncaught error still leaves the user a screen with a way out, rather
   than a blank page. */
window.addEventListener('error', e=>{
  console.error('uncaught', e.error || e.message);
});
window.addEventListener('unhandledrejection', e=>{
  console.error('unhandled promise rejection', e.reason);
});

async function boot(){
  document.getElementById('app').innerHTML =
    '<div role="status" aria-live="polite" style="padding:60px;text-align:center;color:var(--muted);">Loading your ledger…</div>';
  const sessionResult = await checkSession();
  if(!session){
    renderAuthGate('login');
    return;
  }
  if(!sessionResult.ok){
    renderFatalError('Could not load your account', 'There was a problem loading your profile: ' + sessionResult.error + '. Screenshot this and send it over.');
    return;
  }
  if(!profile){
    renderFatalError('Could not load your account', 'Your profile could not be found. Try logging out and back in.');
    return;
  }
  if(!profile.household_id){
    renderFatalError('Account not fully set up', "Your account isn't linked to a household yet — this can happen if signup was interrupted partway through. Screenshot this and send it over so it can be fixed.");
    return;
  }
  await loadState();
  render();
}
boot();
</script>
