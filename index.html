/* =========================================================
   RECEIPT / SCREENSHOT SCANNING (Anthropic API)
========================================================= */
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result.split(',')[1]);
    r.onerror = ()=> reject(new Error('Read failed'));
    r.readAsDataURL(file);
  });
}
/* Offers a balance read off a statement, rather than applying it silently.
   Current savings drives the goal math, the progress bar and the Timeline's
   starting balance, so it is not something a scanned document gets to set on
   its own — and it applies to ONE chosen goal, not to every goal at once. */
function offerDetectedBalance(row){
  const bal = round2(row.balance_after);
  const scanDate = isValidISO(row.date) ? row.date : todayISO();
  // Reject a future-dated balance outright: it used to poison the staleness
  // guard permanently, silently rejecting every legitimate scan afterwards.
  if(scanDate > todayISO()) return;
  const last = state.lastBalanceDate;
  const stale = last && scanDate < last;
  openModal({
    title: 'Update your current savings?',
    desc: `This statement shows a balance of ${fmt(bal)} on ${dispDate(scanDate)}.`,
    bodyBuilder(body, close){
      const opts = state.goals.map(g=>`<option value="${esc(g.id)}">${esc(g.name)} — currently ${fmt(g.currentSavings)}</option>`).join('');
      body.appendChild(elAll(`
        ${stale ? `<div class="auth-err" style="margin-bottom:12px;">Heads up: this is older than your last balance update (${esc(dispDate(last))}).</div>` : ''}
        <div class="field"><label for="bal-goal">Apply it to</label><select id="bal-goal">${opts}</select></div>
        <div class="field"><label for="bal-amt">Balance</label><input type="number" step="0.01" id="bal-amt" value="${bal}"></div>
        <div class="modal-actions">
          <button class="btn" id="bal-skip">Leave it alone</button>
          <button class="btn btn-gold" id="bal-apply">Update savings</button>
        </div>`));
      body.querySelector('#bal-skip').addEventListener('click', close);
      body.querySelector('#bal-apply').addEventListener('click', ()=>{
        const g = state.goals.find(x=>x.id === body.querySelector('#bal-goal').value);
        if(g){
          const prev = g.currentSavings;
          g.currentSavings = round2(body.querySelector('#bal-amt').value);
          state.lastBalanceDate = scanDate;
          scheduleSave(); close(); render();
          toast('Savings updated', {kind:'ok', actionLabel:'Undo', onAction:()=>{
            g.currentSavings = prev; scheduleSave(); render();
          }});
        } else close();
      });
    }
  });
}

/* Low-level call to the scan Edge Function — takes any prompt, returns parsed JSON. */
const MAX_SCAN_BYTES = 8 * 1024 * 1024;
async function callScanAPI(base64, mediaType, promptKey, descriptors){
  const functionUrl = SUPABASE_URL + '/functions/v1/hyper-processor';
  // Rejected here as well as on the server, so the user gets a useful message
  // instead of a timeout after uploading a 40MB scan.
  if(base64 && base64.length * 0.75 > MAX_SCAN_BYTES){
    throw new Error('That file is too large to scan (limit is 8MB). Try exporting fewer pages.');
  }
  /* The access token is read at call time. It used to come from a module-level
     `session` captured once at login, so after the token expired (~1 hour) this
     one endpoint started returning 401 while everything else kept working —
     about as hard to diagnose as a bug gets. The anon-key fallback is gone:
     it let anyone with the shipped HTML call this endpoint. */
  const { data: fresh } = await sb.auth.getSession();
  const token = fresh && fresh.session && fresh.session.access_token;
  if(!token) throw new Error('Your session expired — log in again to scan documents.');
  session = fresh.session;
  let response;
  try{
    response = await fetch(functionUrl, {
      method: "POST",
      headers: { "Content-Type":"application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify(descriptors ? { promptKey, descriptors } : { base64, mediaType, promptKey })
    });
  }catch(networkErr){
    /* A rejected fetch() means the request never completed — the browser
       blocked it, or nothing answered. "Failed to fetch" alone sends people
       hunting for a connection problem when the usual cause is that the Edge
       Function is an older deployment (or missing), so its CORS preflight
       doesn't match this page's origin. Say so. */
    const offline = (typeof navigator !== 'undefined' && navigator.onLine === false);
    throw new Error(offline
      ? "You're offline — reconnect and try the upload again."
      : "Couldn't reach the document scanner. This is usually the scan function " +
        "being out of date or not deployed (its CORS preflight has to accept this page's " +
        "origin, " + (window.location.origin || 'file://') + "). Redeploy the scan-image " +
        "function, then try again. [" + (networkErr.message || 'fetch failed') + "]");
  }
  let data;
  try{ data = await response.json(); }
  catch(parseErr){ throw new Error('Server returned an unreadable response (status ' + response.status + ')'); }
  if(!response.ok){
    const apiMsg = (data && data.error && (data.error.message||data.error)) || ('HTTP ' + response.status);
    throw new Error(String(apiMsg));
  }
  const textBlock = (data.content||[]).find(b=>b.type==='text');
  if(!textBlock) throw new Error('No text in the model\'s response');
  if(data.stop_reason === 'max_tokens'){
    throw new Error('Response was cut off — too many transactions in one image. Try a shorter screenshot or fewer transactions per upload.');
  }
  const clean = textBlock.text.replace(/```json|```/g,'').trim();
  try{
    return JSON.parse(clean);
  }catch(jsonErr){
    // Fallback: the model may have added stray text around the JSON — try
    // pulling out the largest {...} or [...] block and parsing just that.
    const braceMatch = clean.match(/\{[\s\S]*\}/);
    const bracketMatch = clean.match(/\[[\s\S]*\]/);
    const candidate = braceMatch ? braceMatch[0] : (bracketMatch ? bracketMatch[0] : null);
    if(candidate){
      try{ return JSON.parse(candidate); }
      catch(e2){ /* fall through to the error below */ }
    }
    throw new Error('Could not parse the extracted details as JSON');
  }
}

/* =========================================================
   CENTRALIZED DOCUMENT UPLOADER
========================================================= */
const DOC_TYPES = [
  {key:'receipt', label:'Receipt', hint:'A purchase receipt — groceries, food, gas, retail, restaurants.'},
  {key:'bill', label:'Bill', hint:'A recurring bill — utility, bank, loan/debt, subscription, insurance.'},
  {key:'statement', label:'Bank Statement', hint:'A bank/card statement showing multiple transactions, income and expenses mixed.'},
  {key:'screenshot', label:'Bank Account Screenshot', hint:'A banking app screenshot showing a transaction list.'},
  {key:'paystub', label:'Pay Stub', hint:'A paycheck / pay stub — always income.'}
];
/* The extraction prompts used to be built here and posted to the Edge
   Function, which forwarded whatever arrived straight to the model. That made
   the endpoint a general-purpose LLM proxy on the owner's account. The prompts
   now live server-side and are selected by key; the doc type IS the key. */
/* Normalizes any doc-type's extraction into a flat array of review-row
   candidates in one common shape, ready for the review table. */
function normalizeDocExtraction(docType, raw){
  if(docType==='paystub'){
    return [{
      destination:'job', direction:'income',
      date: raw.payDate || raw.periodEnd || todayISO(),
      noDate: !(raw.payDate || raw.periodEnd),
      amount: raw.netPay,
      description: 'Pay stub',
      periodStart: raw.periodStart, periodEnd: raw.periodEnd, payDate: raw.payDate, hours: raw.hours
    }];
  }
  const txs = (raw && Array.isArray(raw.transactions)) ? raw.transactions : [];
  return txs.map(t=>{
    if(t.direction === 'income'){
      const isSideGig = t.income_type_guess === 'side_gig';
      return {
        destination: isSideGig ? 'sidegig' : 'otherincome', direction:'income',
        date: t.date || todayISO(), noDate: !t.date, amount: t.amount,
        description: t.description || (isSideGig ? (t.source_guess||'Side gig') : 'Other income'),
        source: t.source_guess || t.description || 'Other',
        balance_after: t.balance_after, uncertain: !!t.uncertain
      };
    }
    return {
      destination:'expense', direction:'expense',
      date: t.date || todayISO(), noDate: !t.date, amount: t.amount,
      description: t.description || 'Expense',
      category: (t.category_guess && ALL_CATS.includes(t.category_guess)) ? t.category_guess : ONETIME_CAT,
      frequency: ['onetime','monthly','biweekly'].includes(t.frequency_guess) ? t.frequency_guess : 'onetime',
      balance_after: t.balance_after, uncertain: !!t.uncertain
    };
  });
}
/* A row is "missing a field" if it has no usable amount or no date was found. */
function amountInvalid(r){
  return (r.amount==null || r.amount==='' || isNaN(Number(r.amount)) || Number(r.amount)===0);
}
function rowMissingField(r){
  return amountInvalid(r) || !!r.noDate;
}
/* Duplicate check that works across all four destinations. */
const normName = s => String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
/* Loose enough to WARN about a possible duplicate. Never used to decide a
   write — substring matching says "Netflix" matches "Netflix Premium Refund",
   which is fine for a warning and dangerous for anything else. */
function namesLooselyMatch(a, b){
  const na = normName(a), nb = normName(b);
  if(!na || !nb) return false;
  return na.includes(nb) || nb.includes(na);
}
/* The bar for silently logging a payment against an existing bill. */
function namesExactlyMatch(a, b){
  const na = normName(a), nb = normName(b);
  return !!na && na === nb;
}
/* If this "recurring-looking" row is actually the same subscription/bill we
   already track (same name, same amount), return the existing item so we log
   this occurrence against it instead of creating a duplicate recurring item. */
function findExistingRecurringItem(row){
  return state.expenses.items.find(item =>
    item.status!=='cancelled' &&
    (item.frequency==='monthly' || item.frequency==='biweekly') &&
    namesExactlyMatch(item.name, row.description) &&
    amountsClose(item.amount, row.amount, 0.02)
  );
}
function findGenericDuplicate(row){
  if(row.destination==='job') return findScanDuplicate('jobstub', {netPay:row.amount, payDate:row.date});
  if(row.destination==='sidegig') return findScanDuplicate('sidegig', {amount:row.amount, date:row.date});
  if(row.destination==='expense'){
    if(row.frequency==='monthly' || row.frequency==='biweekly'){
      /* Two different bars on purpose. An EXACT match silently logs a payment
         against the existing bill, so it has to be certain. A LOOSE match only
         raises a flag for the user to look at — "NETFLIX PREMIUM REFUND $16.20"
         should never quietly rewrite a real "Netflix $15.49", but the user
         should still be told the two look related. */
      const existing = findExistingRecurringItem(row);
      if(existing) return {
        label: `Same as your existing "${esc(existing.name)}" (${fmt(existing.amount)}/${esc(existing.frequency)}) — this will log as a payment on that item, not a new expense`,
        isRecurringMatch: true };
      const similar = state.expenses.items.find(item =>
        item.status!=='cancelled' &&
        (item.frequency==='monthly' || item.frequency==='biweekly') &&
        namesLooselyMatch(item.name, row.description));
      if(similar) return {
        label: `Looks related to your existing "${esc(similar.name)}" (${fmt(similar.amount)}/${esc(similar.frequency)}) — check whether this is the same bill or a separate charge. It will be added as a NEW expense.` };
    }
    return findScanDuplicate('expense', {amount:row.amount, date:row.date});
  }
  if(row.destination==='otherincome'){
    const hit = state.otherIncome.entries.find(e=> amountsClose(e.amount,row.amount) && datesClose(e.date,row.date));
    if(hit) return { label: `${esc(hit.label||'Other income')} — ${fmt(hit.amount)} on ${esc(dispDate(hit.date))}` };
  }
  return null;
}

function openDocumentUploadModal(){
  openModal({
    title: "Upload Document",
    desc: "Choose what kind of document this is, then upload one or more images. Everything gets extracted into a review list before anything is added.",
    wide: true,
    bodyBuilder(body, close){
      const typeOpts = DOC_TYPES.map(t=>`<option value="${t.key}">${t.label}</option>`).join('');
      body.appendChild(elAll(`
        <div class="field"><label for="doc-type">Document type</label><select id="doc-type">${typeOpts}</select></div>
        <div class="muted" style="font-size:11.5px;margin:-6px 0 6px;" id="doc-type-hint"></div>
        <div class="muted" style="font-size:11px;color:#E2932E;margin-bottom:10px;">⚠ PDFs are recommended for transaction history — screenshot reading isn't guaranteed to catch everything, especially on long scrollable lists.</div>
        <div class="scan-drop" id="doc-drop">Click to choose one or more images or PDFs</div>
        <input type="file" id="doc-file" accept="image/*,application/pdf" multiple style="display:none;">
        <div id="doc-file-list" class="muted" style="font-size:11.5px;margin-top:6px;"></div>
        <div class="modal-actions">
          <button class="btn" id="doc-cancel">Cancel</button>
          <button class="btn btn-gold" id="doc-scan" disabled>Scan Documents</button>
        </div>
      `));
      const typeSel = body.querySelector('#doc-type');
      const hintEl = body.querySelector('#doc-type-hint');
      function updateHint(){ hintEl.textContent = DOC_TYPES.find(t=>t.key===typeSel.value).hint; }
      updateHint();
      typeSel.addEventListener('change', updateHint);

      const fileInput = body.querySelector('#doc-file');
      const dropEl = body.querySelector('#doc-drop');
      const fileListEl = body.querySelector('#doc-file-list');
      const scanBtn = body.querySelector('#doc-scan');
      dropEl.addEventListener('click', ()=> fileInput.click());
      fileInput.addEventListener('change', ()=>{
        const files = Array.from(fileInput.files||[]);
        fileListEl.textContent = files.length ? files.length+' file(s) selected: '+files.map(f=>f.name).join(', ') : '';
        scanBtn.disabled = files.length===0;
      });
      body.querySelector('#doc-cancel').addEventListener('click', close);

      scanBtn.addEventListener('click', async ()=>{
        const files = Array.from(fileInput.files||[]);
        if(files.length===0) return;
        const docType = typeSel.value;
        scanBtn.disabled = true;
        dropEl.classList.add('busy');
        let allRows = [];
        for(let i=0;i<files.length;i++){
          dropEl.textContent = `Scanning ${i+1} of ${files.length}…`;
          try{
            const base64 = await fileToBase64(files[i]);
            const raw = await callScanAPI(base64, files[i].type, docType);
            const rows = normalizeDocExtraction(docType, raw);
            allRows = allRows.concat(rows);
          }catch(err){
            console.error(err);
            allRows.push({ error: true, description: files[i].name+' — '+((err&&err.message)||'failed to read') });
          }
        }
        allRows.forEach(r=>{
          if(!r.error){
            r.id = uid();
            r.dup = findGenericDuplicate(r);
            r.needsReview = rowMissingField(r) || !!r.uncertain;
            r.include = !r.needsReview && !r.dup;
          }
        });
        const okOnly = allRows.filter(r=>!r.error);
        if(okOnly.length){
          state.pendingDocReview = { docType, rows: okOnly };
          scheduleSave();
        }
        renderDocReviewStep(body, close, allRows);
      });
    }
  });
}

/* Reopens a previously-saved, unfinished document review — e.g. after an
   accidental close — straight to the review table, no re-scanning needed. */
function openSavedDocReview(){
  if(!state.pendingDocReview || !state.pendingDocReview.rows || state.pendingDocReview.rows.length===0) return;
  openModal({
    title: "Unfinished Review",
    desc: "Picking up where you left off — nothing was lost.",
    wide: true,
    bodyBuilder(body, close){
      renderDocReviewStep(body, close, state.pendingDocReview.rows);
    }
  });
}
function renderDocReviewStep(body, close, rows){
  body.innerHTML = '';
  const okRows = rows.filter(r=>!r.error);
  const errRows = rows.filter(r=>r.error);
  body.appendChild(el(`<div class="desc" style="margin-bottom:12px;">Found ${okRows.length} transaction${okRows.length===1?'':'s'}. Review, fix anything wrong, uncheck what you don't want, then add.</div>`));
  if(errRows.length){
    const errBox = el(`<div class="auth-err" style="margin-bottom:12px;"></div>`);
    errBox.innerHTML = errRows.map(r=>esc(r.description)).join('<br>');
    body.appendChild(errBox);
  }
  if(okRows.length===0){
    body.appendChild(el(`<div class="modal-actions"><button class="btn btn-gold" id="doc-close">Close</button></div>`));
    body.querySelector('#doc-close').addEventListener('click', close);
    return;
  }

  const scroller = document.createElement('div');
  scroller.style.cssText = 'max-height:50vh;overflow-y:auto;';
  const destLabels = {expense:'Expense', sidegig:'Side Gig', otherincome:'Other Income', job:'Job Income'};

  function groupOf(row){ return row.dup ? 0 : (row.needsReview ? 1 : 2); }
  const displayRows = okRows.slice().sort((a,b)=>{
    const ga = groupOf(a), gb = groupOf(b);
    if(ga !== gb) return ga - gb;
    return (a.date||'').localeCompare(b.date||'');
  });
  const groupTitles = { 0: '⚠ Possible duplicates — review before including', 1: '⚠ Needs review — missing info or uncertain read', 2: 'Transactions' };
  let lastGroup = null;

  displayRows.forEach(row=>{
    const g = groupOf(row);
    if(g !== lastGroup){
      scroller.appendChild(el(`<div class="eyebrow" style="margin-top:${lastGroup===null?'0':'16px'};">${groupTitles[g]}</div>`));
      lastGroup = g;
    }
    const reviewStyle = row.needsReview ? 'border:2px solid #E2932E;' : (row.dup ? 'border:2px solid var(--red);' : '');
    const reasons = [];
    if(amountInvalid(row)) reasons.push('missing an amount');
    if(row.noDate) reasons.push('no date found');
    if(row.uncertain) reasons.push('the reading may be inaccurate — double-check the description/amount');
    const reviewNote = reasons.length ? `⚠ Needs review — ${reasons.join('; ')}. Fix it and check the box to include it.` : '';
    const rowBox = el(`
      <div class="panel" style="background:var(--panel-alt);padding:12px 14px;margin-bottom:10px;${reviewStyle}">
        <div style="display:flex;align-items:flex-start;gap:10px;">
          <input type="checkbox" class="doc-include" data-id="${esc(row.id)}" ${row.include?'checked':''} style="margin-top:4px;">
          <div style="flex:1;">
            ${reviewNote ? `<div class="muted" style="font-size:11px;color:#E2932E;font-weight:600;margin-bottom:6px;">${reviewNote}</div>` : ''}
            <div class="field-row">
              <div class="field"><label>Description</label><input type="text" aria-label="Transaction description" class="doc-field" data-id="${esc(row.id)}" data-field="description" value="${esc(row.description||'')}"></div>
              <div class="field"><label>Amount</label><input type="number" step="0.01" aria-label="Transaction amount" class="doc-field" data-id="${esc(row.id)}" data-field="amount" value="${esc(row.amount??'')}"></div>
            </div>
            <div class="field-row">
              <div class="field"><label>Date</label><input type="date" aria-label="Transaction date" class="doc-field" data-id="${esc(row.id)}" data-field="date" value="${esc(row.date||todayISO())}"></div>
              <div class="field"><label>Goes to</label>
                <select class="doc-field" aria-label="Where this transaction goes" data-id="${esc(row.id)}" data-field="destination">
                  <option value="expense" ${row.destination==='expense'?'selected':''}>Expense</option>
                  <option value="sidegig" ${row.destination==='sidegig'?'selected':''}>Side Gig Income</option>
                  <option value="otherincome" ${row.destination==='otherincome'?'selected':''}>Other Income</option>
                  ${row.destination==='job' ? '<option value="job" selected>Job Income</option>' : ''}
                </select>
              </div>
            </div>
            ${row.destination==='expense' ? `
            <div class="field-row">
              <div class="field"><label>Category</label>
                <select class="doc-field" aria-label="Expense category" data-id="${esc(row.id)}" data-field="category">${catOptions(row.category)}</select>
              </div>
              <div class="field"><label>Frequency</label>
                <select class="doc-field" aria-label="How often this recurs" data-id="${esc(row.id)}" data-field="frequency">
                  <option value="onetime" ${row.frequency==='onetime'?'selected':''}>One-time</option>
                  <option value="monthly" ${row.frequency==='monthly'?'selected':''}>Monthly</option>
                  <option value="biweekly" ${row.frequency==='biweekly'?'selected':''}>Biweekly</option>
                </select>
              </div>
            </div>` : ''}
            ${row.dup ? `<div class="auth-err" style="margin-top:6px;padding:6px 10px;font-size:11.5px;">⚠ Might already be added: ${esc(row.dup.label)}</div>` : ''}
          </div>
        </div>
      </div>
    `);
    scroller.appendChild(rowBox);
  });
  body.appendChild(scroller);

  const includedCountEl = el(`<div class="muted" style="font-size:11.5px;margin-top:10px;"></div>`);
  function updateCount(){
    const n = okRows.filter(r=>r.include).length;
    includedCountEl.textContent = n + ' of ' + okRows.length + ' selected';
  }
  updateCount();
  body.appendChild(includedCountEl);
  body.appendChild(el(`<div class="muted" style="font-size:11px;margin-top:2px;">Closing without adding keeps this saved — look for "Unfinished Review" in the header to come back to it.</div>`));
  body.appendChild(el(`
    <div class="modal-actions">
      <button class="btn btn-danger" id="doc-discard">Discard</button>
      <button class="btn" id="doc-cancel-review">Close (keep for later)</button>
      <button class="btn btn-gold" id="doc-add">Add Selected</button>
    </div>
  `));

  body.querySelectorAll('.doc-include').forEach(cb=>{
    cb.addEventListener('change', e=>{
      const row = okRows.find(r=>r.id===e.target.dataset.id);
      if(row){ row.include = e.target.checked; updateCount(); scheduleSave(); }
    });
  });
  body.querySelectorAll('.doc-field').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const row = okRows.find(r=>r.id===e.target.dataset.id);
      const field = e.target.dataset.field;
      if(!row) return;
      row[field] = (field==='amount') ? round2(e.target.value) : String(e.target.value).slice(0,200);
      if(field==='date') row.noDate = false;
      if(field==='amount' || field==='date'){
        row.needsReview = rowMissingField(row) || !!row.uncertain;
      }
      scheduleSave();
    });
  });
  body.querySelector('#doc-cancel-review').addEventListener('click', close);
  body.querySelector('#doc-discard').addEventListener('click', ()=>{
    if(!confirm('Discard this whole review? All extracted transactions will be lost.')) return;
    state.pendingDocReview = null;
    scheduleSave(); close(); render();
  });
  body.querySelector('#doc-add').addEventListener('click', ()=>{
    const checked = okRows.filter(r=>r.include);
    const stillBroken = checked.filter(amountInvalid);
    if(stillBroken.length){
      const proceed = confirm(stillBroken.length + ' selected item(s) still have no amount and will be skipped: ' + stillBroken.map(r=>r.description||'(untitled)').join(', ') + '. Add the rest anyway?');
      if(!proceed) return;
    }
    /* Everything below treats the extracted row as hostile input. It came from
       a model reading a document that the app did not write, so a receipt can
       contain text addressed to the extractor. Amounts, dates and names are
       re-coerced here rather than trusted, and nothing is written to a field
       the review table didn't show the user. */
    let added = 0;
    checked.filter(row => !amountInvalid(row)).forEach(row=>{
      const amount = round2(row.amount);
      const date = isValidISO(row.date) ? row.date : todayISO();
      const desc = String(row.description||'').trim().slice(0,200);
      if(row.destination==='expense'){
        const looksRecurring = row.frequency==='monthly' || row.frequency==='biweekly';
        const existing = looksRecurring ? findExistingRecurringItem(row) : null;
        if(existing){
          // Same subscription/bill we already have — log this payment against
          // it instead of creating a duplicate. The key must be the item's real
          // due date: keying on the posting date produced entries that no
          // reader ever looked up, so the payment was invisible in history and
          // the month silently kept using the estimate.
          state.expenses.monthlyLog[logKey(existing.id, nearestOccurrence(existing, date))] = amount;
        } else {
          const dueDay = parseISO(date) ? parseISO(date).getDate() : 1;
          const newItem = {
            id:uid(), name: desc || 'Untitled expense', category: ALL_CATS.includes(row.category) ? row.category : ONETIME_CAT,
            amount, frequency: ['monthly','biweekly','onetime'].includes(row.frequency) ? row.frequency : 'onetime',
            dueDay: row.frequency==='monthly' ? dueDay : null,
            anchorDate: row.frequency==='biweekly' ? date : null,
            date: row.frequency==='onetime' ? date : null,
            // An imported bill starts the month it was first seen, not at the
            // beginning of recorded history.
            startDate: row.frequency==='onetime' ? null : monthKey(date)+'-01',
            endDate:null, memberId:null, status:"active"
          };
          state.expenses.items.push(newItem);
          if(looksRecurring) state.expenses.monthlyLog[logKey(newItem.id, date)] = amount;
        }
      } else if(row.destination==='sidegig'){
        const src = String(row.source||'Other').trim().slice(0,60) || 'Other';
        state.sideGig.entries.push({ id:uid(), date, source:src, amount, notes:'', memberId:null });
        // Capped and coerced: this list is rendered in every source dropdown,
        // and the extractor could otherwise grow it without bound.
        if(!state.sideGig.sources.includes(src) && state.sideGig.sources.length < 50) state.sideGig.sources.push(src);
      } else if(row.destination==='otherincome'){
        state.otherIncome.entries.push({ id:uid(), date, label: desc || 'Other income', amount, memberId:null, notes:'' });
        state.settings.otherIncomeEnabled = true;
      } else if(row.destination==='job'){
        const payDate = isValidISO(row.payDate) ? row.payDate : date;
        state.job.periods.push({
          id:uid(),
          start: isValidISO(row.periodStart) ? row.periodStart : payDate,
          end:   isValidISO(row.periodEnd)   ? row.periodEnd   : payDate,
          payDate,
          hours: num(row.hours) > 0 ? num(row.hours) : null,
          actualNet: amount, notes:'', memberId: state.members[0]?state.members[0].id:null
        });
      }
      added++;
    });
    /* `balance_after` is deliberately NOT applied here. It is the one extracted
       field the review table never showed and never let the user edit, and it
       overwrote currentSavings on EVERY goal — so a number printed on a
       scanned document could silently rewrite the figure that drives the goal
       math, the progress bar and the whole Timeline. It is now offered
       explicitly, once, after the user can see it. */
    const balances = checked
      .filter(r => r.balance_after != null && Number.isFinite(Number(r.balance_after)) && isValidISO(r.date))
      .sort((a,b)=> a.date.localeCompare(b.date));
    state.pendingDocReview = null;
    scheduleSave(); close(); render();
    toast('Added ' + added + ' transaction' + (added===1?'':'s'), {kind:'ok'});
    if(balances.length && state.goals.length) offerDetectedBalance(balances[balances.length-1]);
  });
}
/* The one way a total is ever rendered (§6). The cash figure is the headline;
   any credit inside that same scope goes underneath, smaller, in orange, and
   is NEVER added into the number above it — $500 cash + $200 credit shows
   "$500.00" with "$200.00 (CREDIT)" beneath, never "$700.00".
   Every screen calls this, so no view can quietly merge the two. */
function moneyWithCredit(cash, credit, opts){
  opts = opts || {};
  const cls = opts.cls || 'mono';
  const fmtFn = opts.whole ? fmt0 : fmt;
  const main = `<span class="${esc(cls)}">${fmtFn(cash)}</span>`;
  if(!credit || Math.abs(round2(credit)) < 0.005) return main;
  return main + `<span class="credit-sub">${fmtFn(credit)} (CREDIT)</span>`;
}
/* Same, as a detached node, for callers building DOM rather than strings. */
function moneyWithCreditEl(cash, credit, opts){
  const box = document.createElement('div');
  box.innerHTML = moneyWithCredit(cash, credit, opts);
  return box;
}

const CONF_LABEL = { high:'High confidence', medium:'Fair confidence', low:'Low confidence',
                     none:'No history yet', exact:'Exact', stated:'From your settings',
                     fixed:'Your fixed estimate', settled:'Month complete' };
/* A card for a number the app MEASURED. Rendered to the cent, because the
   whole point is that it reconciles against a bank statement. */
function statCardActual(label, value, note, tone){
  return `
    <div class="stat-card">
      <h3 class="eyebrow">${esc(label)}</h3>
      <div class="value mono ${tone||''}">${fmt(value)}</div>
      <div class="note">${esc(note)}</div>
    </div>`;
}
/* A card for a number the app GUESSED. Dashed border, rounded to the dollar,
   carries its range and how much history it is built on. Precision is a claim
   about confidence, so an estimate must not look like a measurement. */
function statCardEstimate(label, value, note, range, confidence, tone){
  const conf = confidence || 'none';
  return `
    <div class="stat-card estimated">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
        <h3 class="eyebrow" style="margin-bottom:8px;">${esc(label)}</h3>
        <span class="conf ${esc(conf)}">${esc(CONF_LABEL[conf] || conf)}</span>
      </div>
      <div class="value mono ${tone||''}">${fmt0(value)}</div>
      <div class="note">${esc(note)}</div>
      ${range ? `<div class="range-note">likely ${fmt0(range[0])} – ${fmt0(range[1])}</div>` : ''}
    </div>`;
}

function renderDashboard(){
  const wrap = document.createElement('div');
  const banner = pendingBanner();
  if(banner) wrap.appendChild(banner);

  const mk = monthKey(todayISO());
  const m = monthReport(mk);          // scope B
  const sc = storedCash();            // scope A
  const proj = projectMonthReport(mk);// scope C
  const credit = creditBalances();
  const needed = Math.max(round2(m.thisMonthAllIn - m.income), 0);

  /* The month leads, because that is the question being asked most often.
     Stored Cash is deliberately quieter but always present (§8). */
  const grid = el(`<div class="stat-grid"></div>`);
  grid.appendChild(elAll(`
    <div class="stat-card">
      <h3 class="eyebrow">This Month All In</h3>
      <div class="value mono expense">${fmt(m.thisMonthAllIn)}</div>
      ${m.creditSpend ? `<div class="credit-sub" style="font-size:12px;">${fmt(m.creditSpend)} (CREDIT)</div>` : ''}
      <div class="note">${fmt(m.otherCash)} other + ${fmt(m.recurringCash)} recurring that has passed${
        m.comingUpCash ? ` · ${fmt(m.comingUpCash)} still coming up` : ''}</div>
      ${(m.budgetedCash || m.comingUpCash) ? `<div class="hint-sm" style="margin-top:6px;">
        On track for about <strong class="mono">${fmt(m.expectedAllIn)}</strong> by month end${
          m.budgetedCash ? ` — includes ${fmt(m.budgetedCash)} of ongoing budgets that aren't dated payments` : ''}.</div>` : ''}
    </div>` +
    statCardActual('Income This Month', m.income,
      'Dated on or before today — nothing estimated', 'income') +
    `<div class="stat-card">
      <h3 class="eyebrow">Net So Far</h3>
      <div class="value mono ${m.net>=0?'income':'expense'}">${fmt(m.net)}</div>
      <div class="note">${m.net>=0 ? 'Income has covered this month so far' : 'Spending is ahead of income this month'}</div>
    </div>`
  ));
  grid.appendChild(elAll(
    (needed > 0
      ? `<div class="stat-card" style="border-color:#6B4A1E;">
           <h3 class="eyebrow">Still Needed To Break Even</h3>
           <div class="value mono" style="color:var(--amber);">${fmt(needed)}</div>
           <div class="note">On top of what has come in, to cover this month's cash spending</div>
         </div>`
      : `<div class="stat-card" style="border-color:#2C5741;">
           <h3 class="eyebrow">Break-Even</h3>
           <div class="value mono income">Covered</div>
           <div class="note">This month's cash spending is already covered by income</div>
         </div>`) +
    statCardEstimate('Projected Month-End Net', proj.net,
      `Projects the rest of ${esc(monthLabel(mk))} from your obligations and recent pattern`,
      proj.spread > 0 ? [proj.low, proj.high] : null, proj.confidence,
      proj.net>=0 ? 'income' : 'expense')
  ));
  wrap.appendChild(grid);

  /* Stored Cash — the master number, lower in the visual order (§8). */
  const cashPanel = el(`<div class="panel"><div class="panel-head">
      <h2>Stored Cash</h2>
      <span class="muted" style="font-size:var(--fs-xs);">${sc.ok
        ? 'From ' + esc(dispDate(sc.asOf)) + ', forward through today'
        : 'Not set up yet'}</span></div></div>`);
  if(!sc.ok){
    cashPanel.appendChild(el(`<div class="empty"><span class="big">No starting balance yet</span>
      Set what you actually had, and when, in Settings — every cash figure builds from it.</div>`));
  } else {
    cashPanel.appendChild(elAll(`
      <div style="display:flex;gap:24px;flex-wrap:wrap;align-items:baseline;">
        <div>
          <div class="eyebrow">Across your cash accounts</div>
          <div class="value mono income" style="font-family:'Fraunces',serif;font-size:30px;">${fmt(sc.position)}</div>
        </div>
        ${credit.total ? `<div>
          <div class="eyebrow">Card balance owed</div>
          <div class="mono" style="font-size:20px;color:var(--credit);">${fmt(credit.total)}</div>
          <div class="hint-sm">Not subtracted from cash — it leaves when you pay the card.</div>
        </div>` : ''}
      </div>
      <div class="hint-sm" style="margin-top:10px;">
        ${fmt(sc.baseline.amount)} on ${esc(dispDate(sc.asOf))}
        · <span style="color:var(--green);">+${fmt(sc.since.income)}</span> in
        · <span style="color:#EE6E63;">−${fmt(sc.since.cashOut)}</span> out${
          sc.since.ccPayments ? ` · <span style="color:var(--credit);">−${fmt(sc.since.ccPayments)}</span> card payments` : ''}
      </div>`));
    if(sc.baseline.inferred){
      cashPanel.appendChild(el(`<div class="auth-err" style="margin-top:12px;">
        This starting balance was carried over from your old savings figure and dated automatically.
        Confirm it in Settings so everything below is measured from a real number.</div>`));
    }
    const accts = state.accounts.filter(a=>!a.archived);
    if(accts.length > 1){
      const row = el(`<div class="chips" style="margin-top:12px;"></div>`);
      accts.forEach(a=>{
        const v = a.kind === 'cash' ? (sc.byAccount[a.id] || 0) : -(credit.byAccount[a.id] || 0);
        row.appendChild(el(`<span class="acct-pill">
          <span class="${a.kind==='credit'?'credit-dot':''}" style="${a.kind==='cash'?'width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;':''}"></span>
          ${esc(a.name)} <span class="mono" style="color:${a.kind==='credit'?'var(--credit)':'var(--text)'};">${fmt(v)}</span></span>`));
      });
      cashPanel.appendChild(row);
    }
  }
  wrap.appendChild(cashPanel);

  // The forecast, drawn. The dip warning used to be a sentence that refused to
  // say when the dip happened or how deep it went.
  const runway = runwayPoints(60);
  const lowest = runway.reduce((a,b)=> b.balance < a.balance ? b : a, runway[0]);
  const runwayPanel = el(`<div class="panel"><div class="panel-head"><h2>Next 60 Days</h2>
      <span class="muted" style="font-size:var(--fs-xs);">Balance today, then every scheduled bill and paycheck</span></div></div>`);
  runwayPanel.appendChild(chartCard(
    'Projected running balance',
    lowest.balance < 0
      ? `Dips to ${fmt(lowest.balance)} on ${dispDate(lowest.date)} — a bill lands before enough income does.`
      : `Low point ${fmt(lowest.balance)} on ${dispDate(lowest.date)}. Stays above zero.`,
    chartRunway(runway), [[CHART_COLORS.job,'Running balance']],
    'Add pay periods or expense due dates to project a balance.'));
  wrap.appendChild(runwayPanel);

  const goalsPanel = el(`<div class="panel"><div class="panel-head"><h2>Goals</h2></div></div>`);
  const goalsBody = document.createElement('div');
  if(state.goals.length===0){
    goalsBody.appendChild(el(`<div class="empty"><span class="big">No goals yet</span>Add one from the Goals tab to start tracking a target.</div>`));
  } else {
    state.goals.forEach(g=>{
      const s = goalStats(g);
      const plan = goalForwardWeeklyPlan(g);
      const nextWeek = plan.weeks[0];
      let weekLine = '';
      if(nextWeek){
        const earnedThisWeek = outsideIncomeInRange(nextWeek.weekStart, nextWeek.weekEnd);
        const remaining = Math.max(nextWeek.amount - earnedThisWeek, 0);
        weekLine = `
          <div class="muted" style="font-size:11.5px;margin-top:10px;">
            This week's target: <span class="mono" style="color:var(--text);font-weight:700;">${fmt0(nextWeek.amount)}</span> (${dispDate(nextWeek.weekStart)} – ${dispDate(nextWeek.weekEnd)})
            · Made so far: <span class="mono" style="color:var(--green);font-weight:700;">${fmt0(earnedThisWeek)}</span>
            · Left to hit it: <span class="mono" style="color:${remaining>0?'#E2932E':'var(--green)'};font-weight:700;">${fmt0(remaining)}</span>
          </div>`;
      }
      // One sentence that answers what the four "Savings + …" lines were
      // gesturing at. Those lines were arithmetic with no referent — and
      // because TN already nets out A, "Savings + total needed" printed the
      // identical figure whether you had $1,000 or $4,000 saved.
      const verdict = !s.valid ? 'Set a start and target date to project this goal.'
        : s.overdue ? (s.A >= s.minTarget
            ? `The deadline has passed and you made it — ${fmt0(s.A)} against a ${fmt0(s.minTarget)} target.`
            : `The deadline passed on ${esc(dispDate(g.targetDate))} with ${fmt0(s.A)} saved, ${fmt0(round2(s.minTarget - s.A))} short. Move the target date to keep going.`)
        : s.shortfall <= 0
          ? `At your recent pace you'll reach about <strong class="mono" style="color:var(--green);">${fmt0(s.projectedBalance)}</strong> by ${esc(dispDate(g.targetDate))} — clearing the ${fmt0(s.minTarget)} target.`
          : `At your recent pace you'll reach about <strong class="mono" style="color:var(--amber);">${fmt0(s.projectedBalance)}</strong> by ${esc(dispDate(g.targetDate))} — <strong class="mono">${fmt0(s.shortfall)}</strong> short of the ${fmt0(s.minTarget)} target.`;
      goalsBody.appendChild(el(`
        <div class="goal-card">
          <div class="goal-top">
            <div><div class="goal-name">${esc(g.name)}</div><div class="goal-date">By ${esc(dispDate(g.targetDate))} · ${s.planWeeks} week${s.planWeeks===1?'':'s'} left</div></div>
            <span class="flag ${esc(GOAL_FLAG[s.status].cls)}">${esc(GOAL_FLAG[s.status].label)}</span>
          </div>
          <div class="goal-metrics">
            <div class="metric"><div class="label">In the account</div><div class="val">${fmt(s.A)}</div></div>
            <div class="metric"><div class="label">Target (min)</div><div class="val">${fmt0(s.minTarget)}</div></div>
            <div class="metric"><div class="label">Needed outside the job</div><div class="val">${fmt0(s.outsideNeededMin)}</div></div>
            <div class="metric"><div class="label">${s.overdue?'Still short by':'Weekly pace needed'}</div><div class="val">${s.overdue?fmt0(s.outsideNeededMin):`${fmt0(s.paceMin)}<span class="muted" style="font-size:var(--fs-xs);font-weight:400;"> – ${fmt0(s.paceMax)}</span>`}</div></div>
          </div>
          <div class="hint-sm" style="margin-top:12px;font-size:var(--fs-sm);">${verdict}</div>
          ${s.creditOutstanding ? `<div class="hint-sm" style="color:var(--credit);">
            ${fmt(s.creditOutstanding)} is owed on cards. It isn't subtracted from the figure above —
            it leaves your account when you pay the card.</div>` : ''}
          ${weekLine}
        </div>
      `));
    });
  }
  goalsPanel.appendChild(goalsBody);
  wrap.appendChild(goalsPanel);

  const closes = recentMonthReports(12);
  const trackPanel = el(`<div class="panel"><div class="panel-head"><h2>Monthly Close-Out</h2><span class="muted" style="font-size:var(--fs-xs);">Cash and credit kept separate, every figure dated</span></div></div>`);
  if(closes.length===0 || closes.every(c=>c.income===0 && c.thisMonthAllIn===0 && c.creditSpend===0)){
    trackPanel.appendChild(el(`<div class="empty">No months with data yet — this fills in as income and expenses are recorded.</div>`));
    wrap.appendChild(trackPanel);
    return wrap;
  }
  trackPanel.appendChild(chartCard('Income vs. cash spending by month',
    'Cash spending and credit spending are different things, so they are drawn as different series rather than summed.',
    chartMonthlyFlow(closes),
    [[CHART_COLORS.job,'Income'],[CHART_COLORS.exp,'Cash out'],['#E8913F','Credit'],[CHART_COLORS.net,'Net']]));

  const scroll = el(`<div class="table-scroll" tabindex="0" role="region" aria-label="Monthly close-out table"></div>`);
  const tbl = document.createElement('table');
  tbl.className = 'month-table';
  tbl.innerHTML = `<caption class="sr-only">Income, cash spending and credit spending for each month</caption>
    <thead><tr><th scope="col">Month</th><th scope="col">Income</th><th scope="col">Other</th>
    <th scope="col">Recurring</th><th scope="col">All In</th><th scope="col">Credit</th><th scope="col">Net</th></tr></thead>`;
  const tbody = document.createElement('tbody');
  closes.forEach(c=>{
    const isCurrent = c.mk === monthKey(todayISO());
    tbody.appendChild(elAll(`
      <tr>
        <td>${esc(monthLabel(c.mk))}${isCurrent?' <span class="muted-2">(in progress)</span>':''}${
          c.discrepancyTotal ? ` <span class="pill est" title="Recorded stored-cash discrepancy">adj ${esc(fmtSigned(c.discrepancyTotal))}</span>` : ''}</td>
        <td class="mono">${fmt(c.income)}</td>
        <td class="mono">${fmt(c.otherCash)}</td>
        <td class="mono">${fmt(c.recurringCash)}</td>
        <td class="mono" style="font-weight:600;">${fmt(c.thisMonthAllIn)}</td>
        <td class="mono" style="color:var(--credit);">${c.creditSpend ? fmt(c.creditSpend) : '—'}</td>
        <td class="mono ${c.net>=0?'pos':'neg'}">${fmt(c.net)}</td>
      </tr>
    `));
  });
  tbl.appendChild(tbody);
  scroll.appendChild(tbl);
  trackPanel.appendChild(scroll);
  wrap.appendChild(trackPanel);
  return wrap;
}
/* Months that have any activity at all, most recent last. */
function monthsWithActivity(){
  const set = new Set();
  state.txns.forEach(t=>{ const mk = monthKey(t.date); if(mk) set.add(mk); });
  state.discrepancies.forEach(d=>{ const mk = monthKey(d.date); if(mk) set.add(mk); });
  if(state.cashBaseline) set.add(monthKey(state.cashBaseline.asOf));
  set.add(monthKey(todayISO()));
  return Array.from(set).sort();
}
function recentMonthReports(n){
  return monthsWithActivity().slice(-(n||12)).map(monthReport);
}
/* Three states, not a binary. "$1/week under" flipping a bold stamp from
   ON TRACK to BEHIND was a harsher verdict than the data supports. */
const GOAL_FLAG = {
  ontrack: {cls:'ontrack', label:'On Track'},
  close:   {cls:'close',   label:'Just Behind'},
  behind:  {cls:'behind',  label:'Behind'},
  new:     {cls:'newgoal', label:'Just Started'},
  unknown: {cls:'newgoal', label:'Needs Dates'}
};
/* Months that actually have real user-entered data — not just scheduled future
   placeholders. Covers every income stream: weekly-variable pay and Other
   Income were both missing, so a user paid weekly with no pay periods saw
   "No months with data yet" despite months of logged income. Orphaned
   monthlyLog keys (whose expense item was deleted) are ignored, so a deleted
   bill can't conjure a phantom month. */
function monthsWithData(){
  const set = new Set();
  const add = iso => { const mk = monthKey(iso); if(mk && isValidISO(iso)) set.add(mk); };
  state.job.periods.forEach(p=>{ if(p.hours!=null || p.actualNet!=null) add(p.payDate); });
  (state.job.weeklyVariable.entries||[]).forEach(e=> add(e.weekEnd));
  state.sideGig.entries.forEach(e=> add(e.date));
  state.otherIncome.entries.forEach(e=> add(e.date));
  state.expenses.items.forEach(i=>{ if(i.frequency==='onetime') add(i.date); });
  const liveIds = new Set(state.expenses.items.map(i=>i.id));
  Object.keys(state.expenses.monthlyLog).forEach(key=>{
    const [itemId, occ] = key.split('|');
    if(occ && liveIds.has(itemId)) add(occ);
  });
  return Array.from(set).sort();
}
/* Deletes log entries whose expense item no longer exists. Called after any
   expense deletion so history, duplicate detection and the month list can't be
   driven by rows the user can no longer see or edit. */
function pruneOrphanLogs(){
  const liveIds = new Set(state.expenses.items.map(i=>i.id));
  let removed = 0;
  Object.keys(state.expenses.monthlyLog).forEach(key=>{
    if(!liveIds.has(key.split('|')[0])){ delete state.expenses.monthlyLog[key]; removed++; }
  });
  // dismissedPending grows forever otherwise; drop anything stale or orphaned.
  const cutoff = addDays(todayISO(), -120);
  state.dismissedPending = state.dismissedPending.filter(k=>{
    const [itemId, occ] = String(k).split('|');
    return liveIds.has(itemId) && occ >= cutoff;
  });
  return removed;
}
/* Snaps a payment date onto the item's real due date, so a bill due on the
   15th that posts on the 14th logs against the 15th occurrence instead of
   creating a key nothing ever reads. Falls back to the raw date if the item
   has no occurrence anywhere near it. */
function nearestOccurrence(item, dateISO){
  if(!isValidISO(dateISO)) return dateISO;
  const near = itemOccurrences(item, addDays(dateISO,-20), addDays(dateISO,20));
  if(!near.length) return dateISO;
  return near.reduce((best,occ)=>
    Math.abs(daysBetween(occ,dateISO)) < Math.abs(daysBetween(best,dateISO)) ? occ : best);
}

/* Keeps a pay period and its income transaction in lockstep. A period with a
   stub has exactly one income txn; a period without one has none. */
function syncJobPeriodTxn(p){
  const existing = state.txns.find(t=>t.jobPeriodId === p.id);
  const hasStub = p.actualNet != null && p.actualNet !== '';
  if(!hasStub){
    if(existing) state.txns = state.txns.filter(t=>t.jobPeriodId !== p.id);
    return;
  }
  const rec = {
    date: p.payDate, name: 'Paycheque', merchantKey: 'paycheque',
    amount: Math.abs(round2(p.actualNet)), kind: 'income', payment: 'cash',
    accountId: (state.accounts.find(a=>a.kind==='cash')||{}).id,
    category: 'Income', incomeType: 'job', memberId: p.memberId || null, jobPeriodId: p.id
  };
  if(existing) Object.assign(existing, rec);
  else state.txns.push({ id: uid(), ...rec });
  clearMemo();
}

            <input type="number" min="1" max="31" id="is-dueday" value="${src&&src.dueDay?src.dueDay:1}"></div>`;
        } else if(f === 'yearly'){
          const md = src && src.annualMonth ? src.annualMonth : (parseISO(todayISO()).getMonth()+1);
          const dd = src && src.annualDay ? src.annualDay : parseISO(todayISO()).getDate();
          when.innerHTML = `<div class="field"><label for="is-annual">Arrives each year on</label>
            <input type="date" id="is-annual" value="${esc(isoOf(new Date(parseISO(todayISO()).getFullYear(), md-1, Math.min(dd,28), 12)))}"></div>`;
        } else {
          when.innerHTML = `<div class="field"><label for="is-anchor">Next payment date</label>
            <input type="date" id="is-anchor" value="${esc(src&&src.anchorDate?src.anchorDate:todayISO())}"></div>`;
        }
      }
      renderWhen(); freqSel.addEventListener('change', renderWhen);
      body.querySelector('#is-cancel').addEventListener('click', close);
      body.querySelector('#is-save').addEventListener('click', ()=>{
        const f = freqSel.value;
        const annual = body.querySelector('#is-annual');
        const ad = annual ? parseISO(annual.value) : null;
        const rec = {
          id: src ? src.id : uid(),
          name: String(body.querySelector('#is-name').value || 'Income').slice(0,200),
          amount: Math.abs(round2(body.querySelector('#is-amount').value)),
          frequency: f, isBudget:false,
          incomeType: body.querySelector('#is-type').value,
          category: 'Income', payment: 'cash', accountId: cashAcct.id,
          dueDay: f==='monthly' ? Math.min(Math.max(Math.trunc(num(body.querySelector('#is-dueday').value))||1,1),31) : null,
          anchorDate: (f==='biweekly'||f==='weekly') ? body.querySelector('#is-anchor').value : null,
          annualMonth: f==='yearly' && ad ? ad.getMonth()+1 : null,
          annualDay:   f==='yearly' && ad ? ad.getDate() : null,
          startDate: body.querySelector('#is-start').value || null,
          endDate: body.querySelector('#is-end').value || null,
          status: src ? src.status : 'active'
        };
        rec.merchantKey = merchantKey(rec.name);
        if(src){ Object.assign(src, rec); } else { state.incomeSources.push(rec); }
        scheduleSave(); close(); render();
        toast(src ? 'Saved' : 'Added "'+rec.name+'"', {kind:'ok'});
      });
    }
  });
}

/* ---- shared table helpers ---------------------------------------------
   A wide table scrolls inside its own container so the page itself never
   scrolls sideways, and each one is focusable so a keyboard can reach it. */
function scrollTable(tbody, label, headCols){
  const box = el(`<div class="table-scroll" tabindex="0" role="region" aria-label="${esc(label)}"></div>`);
  const tbl = document.createElement('table');
  tbl.innerHTML = `<caption class="sr-only">${esc(label)}</caption><thead><tr>` +
    headCols.map(c=>`<th scope="col"${c.tight?' class="col-tight"':''}>${esc(c.label)}</th>`).join('') +
    `</tr></thead>`;
  tbl.appendChild(tbody);
  box.appendChild(tbl);
  return box;
}
/* Same, for a table that has already been built. */
function wrapScroll(parent, tbl, label){
  const box = el(`<div class="table-scroll" tabindex="0" role="region" aria-label="${esc(label)}"></div>`);
  box.appendChild(tbl);
  parent.appendChild(box);
  return box;
}
/* Spending by category for a month, straight off monthReport so the graph and
   the totals beside it can never diverge (§10). Cash and credit stay separate
   fields — the chart draws them as separate segments rather than summing two
   different financial concepts into one bar. */
function categoryRowsForMonth(mk){
  const r = monthReport(mk);
  const prior = completedMonthKeys(3).filter(k=>k < mk).map(monthReport);
  return ALL_CATS.map(cat=>{
    const c = r.byCategory[cat] || {cash:0, credit:0, recurringCash:0, recurringCredit:0};
    const cash = round2(c.cash + c.recurringCash);
    const credit = round2(c.credit + c.recurringCredit);
    const avg = prior.length ? round2(prior.reduce((sum,p)=>{
      const pc = p.byCategory[cat] || {cash:0, recurringCash:0};
      return sum + pc.cash + pc.recurringCash;
    },0)/prior.length) : 0;
    return { category:cat, cash, credit, amount:cash, avg,
             color: RECURRING_CATS.includes(cat) ? CHART_COLORS.exp : CHART_COLORS.side };
  }).filter(x=>x.cash || x.credit || x.avg).sort((a,b)=>(b.cash+b.credit)-(a.cash+a.credit));
}

                : st==='passed' ? 'PASSED' : st==='coming' ? 'COMING UP'
                : st==='ended' ? 'ENDED' : 'SCHEDULED';

              : ob.status==='paused' ? 'paused' : 'scheduled';
    const md = date ? esc(dispDateNumeric(date)) : (ob.isBudget ? 'ongoing' : '—');

    box.appendChild(el(`
      <div class="ob-row ${credit?'is-credit':''}" data-ob="${esc(ob.id)}"
           data-searchable="${esc(ob.name + ' ' + ob.category + ' ' + freqLabel)}">
        <span class="ob-state ${cls}">${label}</span>
        <span class="ob-date">${md}</span>
        <span class="ob-name">${esc(ob.name)}${credit?'<span class="credit-badge">CREDIT</span>':''}
          <span class="muted" style="font-size:var(--fs-xs);"> · ${esc(ob.category)} · ${esc(freqLabel)}</span></span>

        <button class="icon-btn ob-del" aria-label="Delete ${esc(ob.name)}">×</button>
      </div>`));
  });
  panel.appendChild(box);
  box.querySelectorAll('.ob-edit').forEach(b=>b.addEventListener('click', e=>{
    const ob = state.obligations.find(o=>o.id === e.target.closest('[data-ob]').dataset.ob);
    if(ob) openObligationModal(ob);
  }));
  box.querySelectorAll('.ob-toggle').forEach(b=>b.addEventListener('click', e=>{
    const ob = state.obligations.find(o=>o.id === e.target.closest('[data-ob]').dataset.ob);
    if(!ob) return;
    /* Turning an obligation off before its date means it must not be added to
       the month's total (§5) — which happens for free, because a paused
       obligation generates no due dates. */
    ob.status = ob.status === 'paused' ? 'active' : 'paused';
    scheduleSave(); render();
    toast(ob.name + (ob.status==='paused' ? ' paused' : ' resumed'), {kind:'ok'});
  }));
  box.querySelectorAll('.ob-del').forEach(b=>b.addEventListener('click', e=>{
    const id = e.target.closest('[data-ob]').dataset.ob;
    const idx = state.obligations.findIndex(o=>o.id === id);
    if(idx === -1) return;
    const ob = state.obligations[idx];

    scheduleSave(); render();
    toast('Deleted "'+ob.name+'"', {kind:'ok', actionLabel:'Undo', onAction:()=>{
      state.obligations.splice(Math.min(idx,state.obligations.length),0,ob);
      scheduleSave(); render();

  }));
  return panel;
}

function dispDateNumeric(iso){
  const d = parseISO(iso);
  if(!d) return '—';
  return String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0');
}

/* =========================================================
   MONTHLY ARCHIVING (§14)

   When a month closes, its complete record is frozen: the totals, the category
   breakdown, the transactions, and — importantly — the obligations as they
   stood AT THAT TIME. Recurring definitions keep living into the new month, but
   editing one later must never rewrite what August actually looked like, which
   is exactly what happens if history is recomputed from today's definitions.

   The archive is a snapshot, not a cache: nothing reads it to answer questions
   about the present, and its presence never changes a current calculation.
========================================================= */
function archiveMonth(mk){
  if(!state.archives) state.archives = {};
  if(state.archives[mk]) return state.archives[mk];
  const r = monthReport(mk);
  const {from, to} = monthRange(mk);
  state.archives[mk] = {
    mk, archivedAt: new Date().toISOString(),
    income: r.income,
    otherCash: r.otherCash, otherCredit: r.otherCredit,
    recurringCash: r.recurringCash, recurringCredit: r.recurringCredit,
    thisMonthAllIn: r.thisMonthAllIn, creditSpend: r.creditSpend,
    ccPayments: r.ccPayments, net: r.net,
    byCategory: JSON.parse(JSON.stringify(r.byCategory)),
    discrepancies: r.discrepancies.map(d=>({...d})),
    discrepancyTotal: r.discrepancyTotal,
    // Frozen copies. A later edit to the live obligation cannot reach these.
    obligations: r.obligationRows.map(row=>({
      id: row.obligation.id, name: row.obligation.name, category: row.obligation.category,
      amount: row.amount, payment: row.payment, frequency: row.obligation.frequency,
      due: row.due, passed: row.passed, paid: !!row.txn
    })),
    txns: state.txns.filter(t=>inRange(t.date, from, to)).map(t=>({...t})),
    closingCash: expectedCashOn(to)
  };
  return state.archives[mk];
}
/* Archives every completed month that hasn't been archived yet. Runs on load,
   so a user who doesn't open the app for three months still gets each of those
   months captured rather than one merged blob. */
function archiveClosedMonths(){
  if(!state.archives) state.archives = {};
  const cur = monthKey(todayISO());
  const months = new Set();
  state.txns.forEach(t=>{ const k = monthKey(t.date); if(k && k < cur) months.add(k); });
  state.discrepancies.forEach(d=>{ const k = monthKey(d.date); if(k && k < cur) months.add(k); });
  let n = 0;
  Array.from(months).sort().forEach(mk=>{ if(!state.archives[mk]){ archiveMonth(mk); n++; } });
  if(n) scheduleSave();
  return n;
}

    }catch(err){
      enrichBtn.disabled = false; enrichBtn.textContent = restore;
      enrichNote.textContent = 'Could not reach the enrichment service — everything still works without it.';
    }
  });
  list.querySelectorAll('.acct-name').forEach(inp=>inp.addEventListener('change', e=>{
    const a = state.accounts.find(x=>x.id === e.target.closest('[data-acct]').dataset.acct);
    if(a){ a.name = String(e.target.value||'Account').slice(0,80); scheduleSave(); }
  }));
  list.querySelectorAll('.acct-del').forEach(b=>b.addEventListener('click', e=>{
    const id = e.target.closest('[data-acct]').dataset.acct;
    const a = state.accounts.find(x=>x.id === id);
    if(!a) return;
    const used = state.txns.filter(t=>t.accountId === id).length;
    if(!confirm(`Remove "${a.name}"?` + (used ? `\n\n${used} transaction(s) reference it; they'll move to your first remaining account.` : ''))) return;
    a.archived = true;
    const fallback = state.accounts.find(x=>!x.archived && x.kind === a.kind) || state.accounts.find(x=>!x.archived);
    if(fallback) state.txns.forEach(t=>{ if(t.accountId === id) t.accountId = fallback.id; });
    scheduleSave(); render();
  }));

  if(state.discrepancies.length){
    box.appendChild(el(`<div class="eyebrow" style="margin-top:20px;">Recorded discrepancies</div>`));
    box.appendChild(el(`<div class="hint-sm" style="margin-bottom:8px;">
      Permanent historical records of where a stored-cash update disagreed with the ledger.
      They are kept so past months stay explainable, and cannot be removed.</div>`));
    const t = document.createElement('tbody');
    state.discrepancies.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(d=>{
      t.appendChild(elAll(`<tr>
        <td class="mono">${esc(dispDate(d.date))}</td>
        <td class="mono ${d.amount>=0?'pos':'neg'}">${esc(fmtSigned(d.amount))}</td>
        <td class="muted" style="font-size:var(--fs-xs);">expected ${fmt(d.expected)}, entered ${fmt(d.entered)}</td>
      </tr>`));
    });
    box.appendChild(scrollTable(t, 'Recorded discrepancies',
      [{label:'Date'},{label:'Difference'},{label:'Detail'}]));
  }
  return box;
}

/* Updating stored cash must name the date, and must warn before recording a
   permanent discrepancy (§2). */
function openStoredCashModal(){
  openModal({
    title:'Update stored cash',
    desc:'What you actually have across your cash accounts, and the day that was true.',
    bodyBuilder(body, close){
      const sc = storedCash();
      const cashAccounts = state.accounts.filter(a=>a.kind==='cash' && !a.archived);
      body.appendChild(elAll(`
        <div class="field-row">
          <div class="field"><label for="sc-amount">Total across cash accounts</label>
            <input type="number" step="0.01" id="sc-amount" value="${sc.ok?round2(sc.position):''}"></div>
          <div class="field"><label for="sc-date">As of</label>
            <input type="date" id="sc-date" value="${esc(todayISO())}" max="${esc(todayISO())}"></div>
        </div>
        ${cashAccounts.length>1 ? `<div class="hint-sm">Split across accounts:</div>
          <div class="field-row" id="sc-split">${cashAccounts.map(a=>`
            <div class="field"><label for="sc-a-${esc(a.id)}">${esc(a.name)}</label>
              <input type="number" step="0.01" id="sc-a-${esc(a.id)}" data-acct="${esc(a.id)}"
                     class="sc-acct" value="${round2((sc.byAccount||{})[a.id]||0)}"></div>`).join('')}</div>` : ''}
        <div id="sc-warn"></div>
        <div class="modal-actions">
          <button class="btn" id="sc-cancel">Cancel</button>
          <button class="btn btn-gold" id="sc-save">Check and save</button>
        </div>`));
      const amountEl = body.querySelector('#sc-amount');
      const dateEl = body.querySelector('#sc-date');
      const warn = body.querySelector('#sc-warn');
      function preview(){
        warn.innerHTML = '';
        if(!isValidISO(dateEl.value) || !sc.ok) return null;
        const p = previewBaselineUpdate(amountEl.value, dateEl.value);
        if(p.hasDiscrepancy){
          warn.innerHTML = `<div class="auth-err" style="margin-top:4px;">
            <strong>This doesn't match the app's records.</strong><br>
            From your ledger it should be <span class="mono">${fmt(p.expected)}</span> on
            ${esc(dispDate(dateEl.value))}; you entered <span class="mono">${fmt(p.entered)}</span>.<br><br>
            The <span class="mono">${esc(fmtSigned(p.discrepancy))}</span> difference will be recorded as a
            <strong>permanent discrepancy</strong> against ${esc(monthLabel(monthKey(dateEl.value)))}.
            It will affect that month's accounting and <strong>cannot be removed</strong>.</div>`;
        }
        return p;
      }
      amountEl.addEventListener('input', preview);
      dateEl.addEventListener('change', preview);
      preview();
      body.querySelector('#sc-cancel').addEventListener('click', close);
      body.querySelector('#sc-save').addEventListener('click', ()=>{
        const date = dateEl.value;
        if(!isValidISO(date)){ toast('A stored cash total needs a date', {kind:'err'}); return; }
        const p = preview();
        if(p && p.hasDiscrepancy &&
           !confirm(`Record a permanent discrepancy of ${fmtSigned(p.discrepancy)}?\n\n` +
                    `Expected ${fmt(p.expected)}, you entered ${fmt(p.entered)}.\n` +
                    `This is kept as a historical record and cannot be removed.`)) return;
        const byAccount = {};
        body.querySelectorAll('.sc-acct').forEach(i=>{ byAccount[i.dataset.acct] = round2(i.value); });
        const res = applyBaselineUpdate(amountEl.value, date,
                      Object.keys(byAccount).length ? byAccount : null);
        scheduleSave(); close(); render();
        toast(res.discrepancy ? `Saved — ${fmtSigned(res.discrepancy)} discrepancy recorded` : 'Stored cash updated',
              {kind:'ok'});
      });
    }
  });
}

/* Removes an expense along with the payment history keyed to it, and offers
   the whole thing back for a few seconds. Deleting used to be instant and
   permanent, and left orphaned monthlyLog rows that kept showing up in the
   history table forever. */
function deleteExpenseWithUndo(id){
  const idx = state.expenses.items.findIndex(x=>x.id===id);
  if(idx === -1) return;
  const item = state.expenses.items[idx];
  const logs = {};
  Object.keys(state.expenses.monthlyLog).forEach(k=>{
    if(k.split('|')[0]===id){ logs[k] = state.expenses.monthlyLog[k]; delete state.expenses.monthlyLog[k]; }
  });
  state.expenses.items.splice(idx, 1);
  selectedExpenseIds.delete(id);
  pruneOrphanLogs();
  scheduleSave(); render();
  toast('Deleted "' + item.name + '"', { kind:'ok', actionLabel:'Undo', onAction:()=>{
    state.expenses.items.splice(Math.min(idx, state.expenses.items.length), 0, item);
    Object.assign(state.expenses.monthlyLog, logs);
    scheduleSave(); render();
    toast('Restored "' + item.name + '"', {kind:'ok'});
  }});
}
function setExpenseStatus(item, status){
  const prev = item.status;
  item.status = status;
  scheduleSave(); render();
  if(prev !== status){
    toast(item.name + ' → ' + status, { actionLabel:'Undo', onAction:()=>{
      item.status = prev; scheduleSave(); render();
    }});
  }
}
function showCtxMenu(x, y, item, opener){
  closeCtxMenu();
  const menu = el(`<div class="ctx-menu" role="menu"></div>`);
  const addBtn = (label, fn, danger)=>{
    const b = el(`<button role="menuitem" ${danger?'class="danger"':''}>${esc(label)}</button>`);
    b.addEventListener('click', ()=>{ closeCtxMenu(); fn(); });
    menu.appendChild(b);
    return b;
  };
  if(item.status==='active')      addBtn('Flag for cancellation', ()=> setExpenseStatus(item,'flagged'));
  else if(item.status==='flagged'){
    addBtn('Keep active', ()=> setExpenseStatus(item,'active'));
    addBtn('Cancel now', ()=> setExpenseStatus(item,'cancelled'), true);
  } else addBtn('Restore', ()=> setExpenseStatus(item,'active'));
  if(item.frequency !== 'variable') addBtn(item.endDate ? 'Change end date…' : 'Set end date…', ()=> openEndDateModal(item));
  addBtn('Delete permanently', ()=> deleteExpenseWithUndo(item.id), true);

  document.body.appendChild(menu);
  // Clamp into the viewport — a fixed-position menu opened near the right or
  // bottom edge used to render partly off-screen with no way to reach it.
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.max(8, Math.min(x, window.innerWidth  - r.width  - 8)) + 'px';
  menu.style.top  = Math.max(8, Math.min(y, window.innerHeight - r.height - 8)) + 'px';
  ctxMenuState = { menu, opener: opener || null };

  const items = Array.from(menu.querySelectorAll('button'));
  if(items.length) items[0].focus();
  menu.addEventListener('keydown', e=>{
    const i = items.indexOf(document.activeElement);
    if(e.key==='ArrowDown'){ e.preventDefault(); items[(i+1)%items.length].focus(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); items[(i-1+items.length)%items.length].focus(); }
    else if(e.key==='Escape'){ e.preventDefault(); closeCtxMenu(); }
  });
  setTimeout(()=>{
    document.addEventListener('click', closeCtxMenu, {once:true});
    window.addEventListener('scroll', closeCtxMenu, {once:true, passive:true});
    window.addEventListener('resize', closeCtxMenu, {once:true});
  }, 0);
}

function closeCtxMenu(){
  if(!ctxMenuState) return;
  const {menu, opener} = ctxMenuState;
  ctxMenuState = null;
  menu.remove();
  if(opener && document.contains(opener)) opener.focus();
}

/* ---- Monthly history panel ---- */
/* Monthly history. The bodies are built only when a month is actually opened —
   they were 81% of every Expenses-tab render (measured ~30,000 elements and
   ~5,000 listeners for two years of data), all of it inside <details> that are
   closed by default. Which months are open now survives a re-render too. */
/* Monthly history, read from the frozen archives (§14). A past month shows
   what it actually was, including the obligations as they stood then — editing
   a recurring definition today cannot rewrite it. */
function renderHistoryPanel(){
  const panel = el(`<div class="panel"><div class="panel-head"><h2>Monthly History</h2>
      <span class="muted" style="font-size:var(--fs-xs);">Closed months, exactly as they stood</span></div></div>`);
  const cur = monthKey(todayISO());
  const months = Object.keys(state.archives || {}).filter(mk=>mk < cur).sort().reverse();
  if(!months.length){
    panel.appendChild(el(`<div class="empty">No closed months yet — each one is archived automatically when it ends.</div>`));
    return panel;
  }
  months.forEach(mk=>{
    const a = state.archives[mk];
    const det = el(`
      <details class="history-month" ${expandedHistoryMonths.has(mk)?'open':''}>
        <summary><span>${esc(monthLabel(mk))}</span>
          <span class="net-preview" style="color:${a.net>=0?'var(--green)':'#EE6E63'}">${fmt(a.net)} net</span></summary>
        <div class="history-body"></div>
      </details>`);
    const body = det.querySelector('.history-body');
    const build = ()=>{
      if(body.dataset.built) return;
      body.dataset.built = '1';
      body.appendChild(el(`
        <table class="month-table">
          <caption class="sr-only">Totals for ${esc(monthLabel(mk))}</caption>
          <thead><tr><th scope="col">Income</th><th scope="col">Other</th><th scope="col">Recurring</th>
                     <th scope="col">All In</th><th scope="col">Credit</th><th scope="col">Net</th></tr></thead>
          <tbody><tr>
            <td class="mono">${fmt(a.income)}</td>
            <td class="mono">${fmt(a.otherCash)}</td>
            <td class="mono">${fmt(a.recurringCash)}</td>
            <td class="mono" style="font-weight:600;">${fmt(a.thisMonthAllIn)}</td>
            <td class="mono" style="color:var(--credit);">${a.creditSpend?fmt(a.creditSpend):'—'}</td>
            <td class="mono ${a.net>=0?'pos':'neg'}">${fmt(a.net)}</td>
          </tr></tbody>
        </table>`));
      if(a.discrepancyTotal){
        body.appendChild(el(`<div class="hint-sm" style="color:var(--amber);margin-top:8px;">
          Includes a recorded stored-cash discrepancy of ${esc(fmtSigned(a.discrepancyTotal))}.</div>`));
      }
      if(a.obligations && a.obligations.length){
        body.appendChild(el(`<div class="eyebrow" style="margin-top:14px;">Recurring obligations active that month</div>`));
        const t = document.createElement('tbody');
        a.obligations.slice().sort((x,y)=>(x.due||'').localeCompare(y.due||'')).forEach(o=>{
          t.appendChild(elAll(`<tr class="${o.payment==='credit'?'is-credit':''}">
            <td>${esc(o.name)}${o.payment==='credit'?'<span class="credit-badge">CREDIT</span>':''}</td>
            <td class="mono">${esc(dispDateNumeric(o.due))}</td>
            <td class="money mono" style="${o.payment==='credit'?'color:var(--credit);':''}">${fmt(o.amount)}</td>
            <td class="muted" style="font-size:var(--fs-xs);">${o.paid?'paid':(o.passed?'due, unlogged':'not due')}</td>
          </tr>`));
        });
        body.appendChild(scrollTable(t, 'Obligations in ' + monthLabel(mk),
          [{label:'Item'},{label:'Due'},{label:'Amount'},{label:'Status'}]));
      }
      const other = (a.txns||[]).filter(t=>t.kind==='expense' && !t.obligationId);
      if(other.length){
        body.appendChild(el(`<div class="eyebrow" style="margin-top:14px;">Other transactions</div>`));
        const t2 = document.createElement('tbody');
        other.sort((x,y)=>x.date.localeCompare(y.date)).forEach(t=>{
          t2.appendChild(elAll(`<tr class="${t.payment==='credit'?'is-credit':''}">
            <td class="mono">${esc(dispDateNumeric(t.date))}</td>
            <td>${esc(t.name)}${t.payment==='credit'?'<span class="credit-badge">CREDIT</span>':''}</td>
            <td class="muted" style="font-size:var(--fs-xs);">${esc(t.category||'')}</td>
            <td class="money mono" style="${t.payment==='credit'?'color:var(--credit);':''}">${fmt(t.amount)}</td>
          </tr>`));
        });
        body.appendChild(scrollTable(t2, 'Transactions in ' + monthLabel(mk),
          [{label:'Date'},{label:'Description'},{label:'Category'},{label:'Amount'}]));
      }
    };
    det.addEventListener('toggle', ()=>{
      if(det.open){ expandedHistoryMonths.add(mk); build(); } else expandedHistoryMonths.delete(mk);
    });
    if(det.open) build();
    panel.appendChild(det);
  });
  return panel;
}

/* ===== pending payment check-in =====
   This used to open itself, unbidden, over whatever tab loaded first, with no
   backdrop dismissal and no Escape — and its softest-sounding button,
   "Skip for now", wrote every occurrence into dismissedPending permanently,
   with no UI anywhere to undo it. Those bills were then never asked about
   again and quietly skewed every future close-out.

   Now it is a banner the user chooses to open, and deferral is genuinely
   temporary; permanent dismissal is a separate, explicitly-labelled action. */
function pendingBanner(){
  const pend = pendingPayments();
  if(pend.length === 0) return null;
  const box = el(`
    <div class="panel" style="border-color:#6B4A1E;background:#221A10;display:flex;
         align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;">
      <div>
        <div style="font-weight:600;font-size:var(--fs-md);">${pend.length} bill${pend.length===1?'':'s'} came due recently</div>
        <div class="hint-sm" style="margin-top:2px;">Confirm what you actually paid so this month's close-out is accurate.</div>
      </div>
      <button class="btn btn-gold" id="pending-open">Review ${pend.length}</button>
    </div>`);
  box.querySelector('#pending-open').addEventListener('click', ()=> showPendingModal());
  return box;
}
function showPendingModal(){
  const pend = pendingPayments();
  openModal({
    title: 'Payment check-in',
    desc: pend.length === 0
      ? 'No unlogged payments due right now. Nice.'
      : 'Confirm what you actually paid — leave a row as-is if it matched the expected amount.',
    bodyBuilder(body, close){
      if(pend.length === 0){
        body.appendChild(el(`<div class="modal-actions"><button class="btn btn-gold" id="pm-close">Close</button></div>`));
        body.querySelector('#pm-close').addEventListener('click', close);
        return;
      }
      const list = document.createElement('div');
      pend.forEach(p=>{
        list.appendChild(el(`
          <div class="pending-item" data-key="${esc(p.key)}">
            <div>
              <div class="pi-name">${esc(p.item.name)}</div>
              <div class="pi-date">Due ${esc(dispDate(p.occ))} · expected ${fmt(p.item.amount)}</div>
            </div>
            <label class="sr-only" for="pm-${esc(p.key)}">Amount paid for ${esc(p.item.name)} due ${esc(dispDate(p.occ))}</label>
            <input type="number" step="0.01" id="pm-${esc(p.key)}" value="${round2(p.item.amount)}">
          </div>`));
      });
      body.appendChild(list);
      body.appendChild(el(`
        <div class="modal-actions" style="justify-content:space-between;">
          <button class="btn btn-danger btn-sm" id="pm-never">Don't ask about these again</button>
          <span style="display:flex;gap:8px;">
            <button class="btn" id="pm-later">Remind me later</button>
            <button class="btn btn-gold" id="pm-save">Save All</button>
          </span>
        </div>`));
      body.querySelector('#pm-later').addEventListener('click', ()=>{
        close();  // genuinely temporary — nothing is written, it returns next session
        toast('Left for later — the banner will still be on your Dashboard');
      });
      body.querySelector('#pm-never').addEventListener('click', ()=>{
        if(!confirm(`Permanently stop asking about these ${pend.length} payment(s)? They'll be left out of your monthly close-out.`)) return;
        state.dismissedPending = Array.from(new Set(state.dismissedPending.concat(pend.map(p=>p.key))));
        scheduleSave(); close(); render();
        toast('Dismissed ' + pend.length + ' payment(s)', {kind:'ok'});
      });
      body.querySelector('#pm-save').addEventListener('click', ()=>{
        let n = 0;
        list.querySelectorAll('.pending-item').forEach(row=>{
          state.expenses.monthlyLog[row.dataset.key] = round2(row.querySelector('input').value);
          n++;
        });
        scheduleSave(); close(); render();
        toast('Logged ' + n + ' payment' + (n===1?'':'s'), {kind:'ok'});
      });
    }
  });
}

function renderGoalMonthly(g){
