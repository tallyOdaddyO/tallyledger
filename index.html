}

/* =========================================================
   TIMELINE TAB
========================================================= */
function colorForMemberOrDefault(memberId, fallback){
  const m = state.members.find(x=>x.id===memberId);
  return m ? m.color : fallback;
}
/* Every dated money movement in a window, signed: income positive, expenses
   negative. `amount` is always the signed effect on the balance, so callers
   can sum it directly and the display just formats it — a refund entered as a
   negative expense used to render as "-$50" in a red bill card while
   *increasing* the running balance. */
/* Every dated money movement in a window, from the v4 ledger.
   `amount` is the SIGNED effect on cash, so callers can sum it directly:
   income positive, cash expenses negative, card payments negative, and
   credit-card PURCHASES zero — they are spending, not cash movement, and
   including them here is what would double-charge the user (§7).
   `cashDelta` is what moves the balance; `spend` is what counts as spending. */
function timelineEvents(fromISO, toISO){
  const events = [];
  const today = todayISO();
  const nameOf = id => { const m = state.members.find(x=>x.id===id); return m ? ' — ' + m.name : ''; };
  const acctOf = id => { const a = state.accounts.find(x=>x.id===id); return a ? a.name : ''; };

  for(const t of state.txns){
    if(!inRange(t.date, fromISO, toISO)) continue;
    if(t.kind === 'transfer') continue;                 // never changes total cash
    if(t.kind === 'income'){
      events.push({date:t.date, type:'income', label:t.name+nameOf(t.memberId),
                   amount:t.amount, cashDelta:t.amount, spend:0,
                   payment:'cash', memberId:t.memberId, isProjected:t.date>today, txn:t});
    } else if(t.kind === 'cc_payment'){
      events.push({date:t.date, type:'expense', label:'Card payment'+(acctOf(t.creditAccountId)?' — '+acctOf(t.creditAccountId):''),
                   amount:-t.amount, cashDelta:-t.amount, spend:0,
                   payment:'cash', isCardPayment:true, memberId:t.memberId, isProjected:t.date>today, txn:t});
    } else if(t.kind === 'expense'){
      const credit = t.payment === 'credit';
      events.push({date:t.date, type:'expense', label:t.name+nameOf(t.memberId),
                   amount: credit ? 0 : -t.amount,      // credit does not move cash
                   cashDelta: credit ? 0 : -t.amount,
                   spend: t.amount, payment: t.payment,
                   memberId:t.memberId, isProjected:t.date>today, txn:t});
    }
  }

  /* Obligations that are due in the window but have no transaction yet — the
     bills that haven't landed. They are the whole point of a forward view. */
  const idx = txnIndex();
  for(const ob of state.obligations){
    if(!obligationIsActive(ob)) continue;
    if(ob.isBudget){
      // A budget has no due date; drip it across the window so the runway
      // reflects that groceries do actually happen.
      const perDay = num(ob.amount)/30.44;
      const start = (ob.startDate && ob.startDate > fromISO) ? ob.startDate : fromISO;
      const end = (ob.endDate && ob.endDate < toISO) ? ob.endDate : toISO;
      const days = daysBetween(start, end) + 1;
      if(days > 0 && perDay > 0 && ob.payment !== 'credit'){
        events.push({date:end, type:'expense', label:ob.name+' (budget)'+nameOf(ob.memberId),
                     amount:-round2(perDay*days), cashDelta:-round2(perDay*days), spend:round2(perDay*days),
                     payment:'cash', isBudget:true, memberId:ob.memberId, isProjected:true});
      }
      continue;
    }
    for(const due of obligationDueDates(ob, fromISO, toISO)){
      if(obligationTxnFor(ob, due, idx)) continue;      // already a real txn above
      const credit = ob.payment === 'credit';
      events.push({date:due, type:'expense', label:ob.name+nameOf(ob.memberId),
                   amount: credit ? 0 : -num(ob.amount),
                   cashDelta: credit ? 0 : -num(ob.amount),
                   spend: num(ob.amount), payment: ob.payment,
                   memberId:ob.memberId, isProjected: due > today,
                   obligation: ob, isObligation:true});
    }
  }
  events.sort((a,b)=> a.date===b.date ? (a.type==='income'?-1:1) : a.date.localeCompare(b.date));
  return events;
}

function renderTimeline(){
  const wrap = document.createElement('div');
  const panel = el(`<div class="panel" style="padding:24px;"></div>`);
  panel.appendChild(el(`
    <div class="panel-head">
      <h2 style="font-size:20px;">Timeline</h2>
      <div class="sub-tabs" style="margin-bottom:0;">
        <button id="tl-mode-projection" class="${state.settings.dashboardMode!=='needed'?'active':''}">Averaged Projection</button>
        <button id="tl-mode-needed" class="${state.settings.dashboardMode==='needed'?'active':''}">Needed to break even</button>
      </div>
    </div>
  `));

  if(state.settings.dashboardMode==='needed'){
    const needed = neededIncomeThisMonth();
    panel.appendChild(el(`<div class="auth-ok" style="margin-bottom:14px;">You need ${fmt0(needed)} more this month to cover expenses already scheduled, on top of what's already come in.</div>`));
  }

  const windowDays = 60;
  const today = todayISO();
  const from = addDays(today, -7);
  const to = addDays(today, windowDays);
  const events = timelineEvents(from, to);
  const startBalance = currentBalance();

  // The projected balance, drawn and dated.
  const runway = runwayPoints(windowDays);
  const lowest = runway.reduce((a,b)=> b.balance < a.balance ? b : a, runway[0]);
  panel.appendChild(chartCard('Projected balance',
    lowest.balance < 0
      ? `Dips to ${fmt(lowest.balance)} on ${dispDate(lowest.date)}.`
      : `Low point ${fmt(lowest.balance)} on ${dispDate(lowest.date)}.`,
    chartRunway(runway), [[CHART_COLORS.job,'Running balance']],
    'Nothing scheduled to project yet.'));

  panel.appendChild(el(`
    <div class="assump-row">
      <div class="assump-item" style="min-width:280px;">
        <div class="field-label">Balance today</div>
        <div class="mono" style="font-size:var(--fs-lg);padding:6px 0;">${fmt(startBalance)}</div>
        <div class="desc">${state.goals[0] ? `From your "${esc(state.goals[0].name)}" goal's current savings.` : 'No goal set yet — showing $0 as a baseline. Add a goal for a real starting point.'}</div>
      </div>
    </div>
  `));

  const legend = el(`<div style="display:flex;gap:16px;flex-wrap:wrap;margin:4px 0 18px;font-size:var(--fs-xs);color:var(--muted);"></div>`);
  legend.appendChild(el(`<span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:14px;height:14px;border-radius:4px;background:#1E5B3E;display:inline-block;"></span>Income (confirmed)</span>`));
  legend.appendChild(el(`<span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:14px;height:14px;border-radius:4px;background:#1E5B3E;display:inline-block;border:1px dashed #ECBA79;"></span>Income (expected)</span>`));
  legend.appendChild(el(`<span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:14px;height:14px;border-radius:4px;background:#5C231F;display:inline-block;"></span>Bill</span>`));
  state.members.forEach(m=> legend.appendChild(el(`<span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:8px;height:8px;border-radius:50%;background:${esc(m.color)};display:inline-block;"></span>${esc(m.name)}'s items</span>`)));
  panel.appendChild(legend);

  if(events.length===0){
    panel.appendChild(el(`<div class="empty">Nothing scheduled in the next ${windowDays} days yet — add pay periods or expense due dates to see them here.</div>`));
    panel.querySelector('#tl-mode-projection').addEventListener('click', ()=>{ state.settings.dashboardMode='projection'; scheduleSave(); render(); });
    panel.querySelector('#tl-mode-needed').addEventListener('click', ()=>{ state.settings.dashboardMode='needed'; scheduleSave(); render(); });
    wrap.appendChild(panel);
    return wrap;
  }

  // group events by date, chronological
  const byDate = {};
  const dateOrder = [];
  events.forEach(ev=>{
    if(!byDate[ev.date]){ byDate[ev.date] = []; dateOrder.push(ev.date); }
    byDate[ev.date].push(ev);
  });
  // Today always gets a column, even on a quiet day. Without it the strip loses
  // its only anchor — the past/future boundary simply isn't drawn anywhere.
  if(!byDate[today]){ byDate[today] = []; dateOrder.push(today); }
  dateOrder.sort();

  const strip = el(`<div tabindex="0" role="region" aria-label="Timeline of income and bills, day by day"
    style="display:flex;gap:16px;overflow-x:auto;padding:10px 4px 28px;align-items:flex-start;"></div>`);
  let todayCol = null;

  const shownDates = dateOrder.slice(0, TIMELINE_MAX_DAYS);
  shownDates.forEach(dateISO=>{
    const dayEvents = byDate[dateISO];
    const isToday = dateISO===today;
    const col = document.createElement('div');
    col.style.cssText = 'flex:0 0 220px;min-width:200px;';
    if(isToday) todayCol = col;
    col.appendChild(el(`
      <div style="text-align:center;padding-bottom:8px;margin-bottom:10px;border-bottom:2px solid ${isToday?'var(--gold)':'var(--border)'};">
        <div class="mono" style="font-size:var(--fs-sm);font-weight:700;color:${isToday?'var(--gold)':'var(--text)'};">${esc(dispDateShort(dateISO))}</div>
        ${isToday?'<div style="font-size:9px;color:var(--gold);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;">Today</div>':''}
      </div>
    `));

    /* Capping the number of DAYS wasn't enough: a single day can carry
       hundreds of bills, and each card is five nodes. Cap the cards per day
       too, and say what was left out. */
    const incomes = dayEvents.filter(e=>e.type==='income');
    const expensesToday = dayEvents.filter(e=>e.type==='expense');
    const hiddenCount = Math.max(incomes.length - TIMELINE_MAX_PER_DAY, 0) +
                        Math.max(expensesToday.length - TIMELINE_MAX_PER_DAY, 0);
    incomes.slice(0, TIMELINE_MAX_PER_DAY).forEach(ev=>{
      const dotColor = colorForMemberOrDefault(ev.memberId, 'var(--muted-2)');
      // #E2932E on this green measured 3.2:1; #ECBA79 clears 4.5:1.
      const textColor = ev.isProjected ? '#ECBA79' : '#FFFFFF';
      const border = ev.isProjected ? 'border:2px dashed #ECBA79;' : 'border:2px solid transparent;';
      col.appendChild(el(`
        <div style="background:#1E5B3E;${border}border-radius:10px;padding:14px 16px;margin-bottom:10px;color:${textColor};">
          <div style="display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);line-height:1.35;">
            <span style="width:8px;height:8px;border-radius:50%;background:${esc(dotColor)};display:inline-block;flex-shrink:0;"></span>
            <span>${esc(ev.label)}</span>
            ${ev.isProjected?'<span class="pill est" style="margin-left:auto;">est.</span>':''}
          </div>
          <div class="mono" style="font-size:19px;font-weight:700;margin-top:6px;">${esc(fmtSigned(ev.amount))}</div>
        </div>
      `));
    });
    expensesToday.slice(0, TIMELINE_MAX_PER_DAY).forEach(ev=>{
      const dotColor = colorForMemberOrDefault(ev.memberId, 'var(--muted-2)');
      col.appendChild(el(`
        <div style="background:#5C231F;border:2px ${ev.isBudget?'dashed #B4BAC4':'solid transparent'};border-radius:10px;padding:14px 16px;margin-bottom:10px;color:#C6CBD3;">
          <div style="display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);line-height:1.35;">
            <span style="width:8px;height:8px;border-radius:50%;background:${esc(dotColor)};display:inline-block;flex-shrink:0;"></span>
            <span>${esc(ev.label)}</span>
          </div>
          <div class="mono" style="font-size:19px;font-weight:700;margin-top:6px;">${esc(fmtSigned(ev.amount))}</div>
        </div>
      `));
    });
    if(hiddenCount > 0){
      col.appendChild(el(`<div class="hint-sm" style="text-align:center;padding:8px;border:1px dashed var(--border);border-radius:8px;">
        +${hiddenCount} more on this day · included in the balance below</div>`));
    }
    if(dayEvents.length === 0){
      col.appendChild(el(`<div class="hint-sm" style="text-align:center;padding:14px 8px;">Nothing due today</div>`));
    }
    strip.appendChild(col);
  });

  if(dateOrder.length > shownDates.length){
    strip.appendChild(el(`<div style="flex:0 0 200px;align-self:center;text-align:center;color:var(--muted);font-size:var(--fs-sm);">
      +${dateOrder.length - shownDates.length} more day${dateOrder.length - shownDates.length===1?'':'s'} in this window.<br>
      The balance figures below still include them.</div>`));
  }
  panel.appendChild(strip);
  // The Today column could start hundreds of pixels off-screen with nothing
  // scrolling it into view.
  if(todayCol) requestAnimationFrame(()=>{ strip.scrollLeft = Math.max(todayCol.offsetLeft - 16, 0); });

  /* The running balance starts from the balance as it stands TODAY, so only
     future events move it. The old loop replayed the previous seven days on
     top of a today-dated balance, double counting that week's whole swing. */
  const ending = runway[runway.length-1].balance;
  panel.appendChild(el(`<div style="text-align:right;font-size:var(--fs-md);margin-top:10px;">Balance at the end of this window: <span class="mono" style="font-weight:700;color:${ending>=0?'var(--green)':'#EE6E63'}">${fmt(ending)}</span></div>`));
  if(lowest.balance < 0){
    panel.appendChild(el(`<div class="auth-err" style="margin-top:14px;">Heads up — the balance goes negative around <strong>${esc(dispDate(lowest.date))}</strong>, reaching <strong class="mono">${fmt(lowest.balance)}</strong>. A bill lands before enough income does.</div>`));
  }

  panel.querySelector('#tl-mode-projection').addEventListener('click', ()=>{ state.settings.dashboardMode='projection'; scheduleSave(); render(); });
  panel.querySelector('#tl-mode-needed').addEventListener('click', ()=>{ state.settings.dashboardMode='needed'; scheduleSave(); render(); });

  wrap.appendChild(panel);
  return wrap;
}

      session = null; profile = null; state = null;
      renderAuthGate();
    }catch(err){
      alert('Could not delete account: ' + ((err && err.message) || 'unknown error'));
    }
  });
  return wrap;
}

function renderAdmin(){
  const wrap = document.createElement('div');

  wrap.appendChild(renderAdminCalculations());

  const panel = el(`<div class="panel"></div>`);
  panel.appendChild(el(`<div class="panel-head"><h2>Invite Codes</h2><button class="btn btn-gold" id="gen-code">+ Generate Code</button></div>`));
  const codesBody = document.createElement('div');
  codesBody.innerHTML = '<div class="muted" style="font-size:12px;">Loading…</div>';
  panel.appendChild(codesBody);

  const usersPanel = el(`<div class="panel"><div class="panel-head"><h2>Users</h2></div></div>`);
  const usersBody = document.createElement('div');
  usersBody.innerHTML = '<div class="muted" style="font-size:12px;">Loading…</div>';
  usersPanel.appendChild(usersBody);

  wrap.appendChild(panel);
  wrap.appendChild(usersPanel);

  async function loadCodes(){
    const { data, error } = await sb.from('invite_codes').select('*').order('created_at', {ascending:false});
    if(error){ codesBody.innerHTML = '<div class="muted" style="font-size:12px;">Could not load codes.</div>'; return; }
    if(!data || data.length===0){ codesBody.innerHTML = '<div class="empty">No codes generated yet.</div>'; return; }

    tbl.innerHTML = '<thead><tr><th>Code</th><th>Created</th><th>Expires</th><th>Status</th><th>Redeemed by</th></tr></thead>';
    const tbody = document.createElement('tbody');
    const now = new Date();
    data.forEach(c=>{
      let status = 'active', label = 'Active';
      if(c.redeemed_by){ status='redeemed'; label='Redeemed'; }
      else if(c.expires_at && new Date(c.expires_at) < now){ status='expired'; label='Expired'; }
      tbody.appendChild(el(`
        <tr>
          <td><span class="code-pill">${esc(c.code)}</span></td>
          <td class="muted" style="font-size:var(--fs-xs);">${esc(dispDate(String(c.created_at||'').slice(0,10)))}</td>
          <td class="muted" style="font-size:var(--fs-xs);">${esc(dispDate(String(c.expires_at||'').slice(0,10)))}</td>
          <td><span class="status-badge ${status}">${label}</span></td>
          <td class="muted" style="font-size:var(--fs-xs);">${c.redeemed_by ? esc(String(c.redeemed_by).slice(0,8)) : '—'}</td>
        </tr>
      `));
    });
    tbl.appendChild(tbody);
    codesBody.innerHTML = '';
    wrapScroll(codesBody, tbl, 'Invite codes');
  }
  async function loadUsers(){
    const { data, error } = await sb.from('profiles').select('*').order('created_at', {ascending:false});
    if(error){ usersBody.innerHTML = '<div class="muted" style="font-size:12px;">Could not load users.</div>'; return; }
    if(!data || data.length===0){ usersBody.innerHTML = '<div class="empty">No users yet.</div>'; return; }
    const tbl = document.createElement('table');
    tbl.innerHTML = '<thead><tr><th scope="col">Email</th><th scope="col">Joined</th><th scope="col">Admin</th></tr></thead>';
    const tbody = document.createElement('tbody');
    data.forEach(u=>{
      tbody.appendChild(el(`
        <tr>
          <td>${esc(u.email)}</td>
          <td class="muted" style="font-size:var(--fs-xs);">${esc(dispDate(String(u.created_at||'').slice(0,10)))}</td>
          <td>${u.is_admin ? '<span class="status-badge active">Admin</span>' : '—'}</td>
        </tr>
      `));
    });
    tbl.appendChild(tbody);
    usersBody.innerHTML = '';
    wrapScroll(usersBody, tbl, 'Users');
  }

  panel.querySelector('#gen-code').addEventListener('click', async ()=>{
    const code = Array.from({length:8}, ()=> "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*32)]).join('');
    const { error } = await sb.from('invite_codes').insert({ code });
    if(error){ alert('Could not generate code: ' + error.message); return; }
    loadCodes();
  });

  loadCodes();
  loadUsers();
  return wrap;
}

/* Read-only dump of every live variable behind the Dashboard and Goals math,
   pulled straight from the same functions the app itself uses — never a
   re-implementation — so it can't drift from what's actually shown to users. */
function debugRow(label, formula, value, fmtFn){
  const f = fmtFn || fmt0;
  return `
    <tr>
      <td style="font-size:12.5px;font-weight:600;">${label}</td>
      <td class="muted" style="font-size:11px;font-family:'IBM Plex Mono',monospace;">${formula}</td>
      <td class="mono" style="font-weight:700;text-align:right;">${f(value)}</td>
    </tr>`;
}
function renderAdminCalculations(){
  const panel = el(`<div class="panel"></div>`);
  panel.appendChild(el(`<div class="panel-head"><h2>Calculations (Debug)</h2><span class="muted" style="font-size:11px;">Live values from your own household's data — read-only</span></div>`));

  const today = todayISO();
  const {from: mStart, to: mEnd} = currentMonthRange();
  const {D, R} = currentMonthDayCounts();
  const IM = currentMonthActualIncome();
  const EE = totalMonthlyExpenses();
  const N1 = IM - EE;
  const JR = jobMonthlyEstimate();
  const SR = sideGigMonthlyEstimate();
  const FR = JR + SR;
  const PMI = projectedMonthlyIncome();
  const PN = projectedMonthlyNet();
  const NeedTM = neededIncomeThisMonth();

  panel.appendChild(el(`<div class="eyebrow">Dashboard — this month (${mStart} to ${mEnd})</div>`));
  const tbl1 = document.createElement('table');
  tbl1.innerHTML = `<thead><tr><th>Var</th><th>Formula</th><th style="text-align:right;">Value</th></tr></thead>
    <tbody>
      ${debugRow('today','—', today, ()=>today)}
      ${debugRow('D (days in month)','monthEnd − monthStart + 1', D, v=>String(v))}
      ${debugRow('R (days remaining)','monthEnd − today + 1', R, v=>String(v))}
      ${debugRow('IM (Income This Month)','Σ confirmed income, monthStart→today', IM)}
      ${debugRow('EE (Est. Monthly Expenses)','totalMonthlyExpenses()', EE)}
      ${debugRow('N1 (Est. Monthly Net)','IM − EE', N1)}
      ${debugRow('JR (Job Rate/mo)','jobMonthlyEstimate()', JR)}
      ${debugRow('SR (Side Gig Rate/mo)','sideGigMonthlyEstimate() — mode: '+esc(state.settings.projectionMode), SR)}
      ${debugRow('FR (Full Rate/mo)','JR + SR', FR)}
      ${debugRow('PMI (Projected Monthly Income)', IM>0 ? 'IM + FR × (R/D)' : 'FR (no actual income yet this month)', PMI)}
      ${debugRow('PN (Projected Monthly Net)','PMI − EE', PN)}
      ${debugRow('NeedTM (Needed to break even)','max(EE − IM, 0)', NeedTM)}
    </tbody>`;
  wrapScroll(panel, tbl1, 'Dashboard calculation variables');

  if(state.goals.length===0){
    panel.appendChild(el(`<div class="empty" style="margin-top:14px;">No goals to show calculations for.</div>`));
    return panel;
  }

  state.goals.forEach(g=>{
    const s = goalStats(g);
    const plan = goalForwardWeeklyPlan(g);
    const retro = goalWeeklyRetrospective(g);
    panel.appendChild(el(`<div class="eyebrow" style="margin-top:22px;">Goal: ${esc(g.name)}</div>`));
    const tbl2 = document.createElement('table');
    tbl2.innerHTML = `<thead><tr><th>Var</th><th>Formula</th><th style="text-align:right;">Value</th></tr></thead>
      <tbody>
        ${debugRow('A (currently in account)','g.currentSavings', s.A)}
        ${debugRow('S_min / S_max (target)','g.minTarget / g.maxTarget', g.minTarget, ()=>fmt0(g.minTarget)+' / '+fmt0(g.maxTarget))}
        ${debugRow('W (weeks remaining)','weeksBetween(today, targetDate)', s.weeksRemaining, v=>v.toFixed(2))}
        ${debugRow('M (months remaining)','monthsBetween(today, targetDate)', s.monthsRemaining, v=>v.toFixed(2))}
        ${debugRow('TN_min','max(S_min−A,0) + EE×M', s.neededMin)}
        ${debugRow('TN_max','max(S_max−A,0) + EE×M', s.neededMax)}
        ${debugRow('JR×M (job contribution)','JR × M', s.jobWindow)}
        ${debugRow('OutsideNeeded_min','max(TN_min − JR×M, 0)', s.outsideNeededMin)}
        ${debugRow('OutsideNeeded_max','max(TN_max − JR×M, 0)', s.outsideNeededMax)}
        ${debugRow('WeeklyPace_min','OutsideNeeded_min / W', s.paceMin)}
        ${debugRow('WeeklyPace_max','OutsideNeeded_max / W', s.paceMax)}
        ${debugRow('Earned since start','outsideIncomeInRange(startDate, today)', s.earnedSinceStart)}
        ${debugRow('Avg weekly pace so far','earnedSinceStart / weeksPassedExact', s.avgWeeklyPaceSoFar)}
        ${debugRow('onTrack','outsideNeededMin≤0 OR avgPaceSoFar≥paceMin', s.onTrack, v=>String(v))}
        ${debugRow('Forward plan weeks','ceil(weeksBetween(startOfWeek(today), targetDate))', plan.count, v=>String(v))}
        ${debugRow('Retrospective: weeks passed / total','floor(daysPassed/7) / round(weeksBetween(...))', retro.weeksPassed, ()=>retro.weeksPassed+' / '+retro.totalWeeks)}
      </tbody>`;
    wrapScroll(panel, tbl2, 'Goal calculation variables');
  });

  return panel;
}

/* =========================================================
   BOOT
========================================================= */
function renderFatalError(title, message){
  const app = document.getElementById('app');
  app.innerHTML = '';
  const wrap = el(`
    <div class="auth-wrap">
      <div class="brand" style="justify-content:center;margin-bottom:22px;"><span class="stamp">T</span><h1>TALLY</h1></div>
      <div class="auth-card">
        <h3>${title}</h3>
        <div class="auth-err" style="margin-top:12px;" role="alert">${message}</div>
        <div class="modal-actions" style="justify-content:space-between;">
          <button class="btn" id="fatal-logout">Log out</button>
          <button class="btn btn-gold" id="fatal-retry">Try again</button>
        </div>
      </div>
    </div>
  `);
  app.appendChild(wrap);
  wrap.querySelector('#fatal-retry').addEventListener('click', ()=> boot());
  wrap.querySelector('#fatal-logout').addEventListener('click', ()=> logOutFlow());
}

/* Nothing observed auth state, so a sign-out in another tab left this one
   rendering a ledger it could no longer write to — with every failed save
   reported as "Offline — will sync". */
sb.auth.onAuthStateChange((event, s)=>{
  session = s;
  if(event === 'SIGNED_OUT' && state){
    state = null; profile = null;
    resetUiState();
    renderAuthGate();
  }
});
/* Any uncaught error still leaves the user a screen with a way out, rather
   than a blank page. */
window.addEventListener('error', e=>{
  console.error('uncaught', e.error || e.message);
});
window.addEventListener('unhandledrejection', e=>{
  console.error('unhandled promise rejection', e.reason);
});

async function boot(){
  document.getElementById('app').innerHTML =
    '<div role="status" aria-live="polite" style="padding:60px;text-align:center;color:var(--muted);">Loading your ledger…</div>';
  const sessionResult = await checkSession();
  if(!session){
    renderAuthGate('login');
    return;
  }
  if(!sessionResult.ok){
    renderFatalError('Could not load your account', 'There was a problem loading your profile: ' + sessionResult.error + '. Screenshot this and send it over.');
    return;
  }
  if(!profile){
    renderFatalError('Could not load your account', 'Your profile could not be found. Try logging out and back in.');
    return;
  }
  if(!profile.household_id){
    renderFatalError('Account not fully set up', "Your account isn't linked to a household yet — this can happen if signup was interrupted partway through. Screenshot this and send it over so it can be fixed.");
    return;
  }
  await loadState();
  archiveClosedMonths();   // freeze any months that closed while away (§14)
  recordAllGoalProgress(); // one savings snapshot per week (§12)
  render();
}
boot();
</script>
