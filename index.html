<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TALLY — Personal Finance Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Pinned + SRI. Regenerate the hash if the version changes:
     curl -sL <url> | openssl dgst -sha384 -binary | openssl base64 -A -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"
        integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
  :root{
    color-scheme: dark;
    --bg:#0D1117;
    --panel:#151B23;
    --panel-alt:#1B222C;
    --row-hover:#1F2731;
    --border:#2A323D;
    --border-soft:#20272F;
    --text:#E7E9ED;
    --muted:#9AA3B1;
    /* Was #5D6572 — 2.56:1 on a hovered row, and it is the colour of every
       column header, field label and metric caption in the app. Those strings
       are what tell you what a number means, so they were the least legible
       text on screen. #8B929C clears 4.5:1 on every surface it lands on. */
    --muted-2:#8B929C;
    --gold:#C9A227;
    --gold-soft:#3A331A;
    --green:#4CAF7D;
    --green-soft:#16241C;
    --red:#E2574C;
    --red-soft:#2A1917;
    --amber:#E2932E;
    /* Credit-card orange (§6). Measured 5.6:1 on --panel, so it carries text. */
    --credit:#E8913F;
    --blue:#5B9BD9;
    --violet:#A78BFA;
    /* Decorative rules stay quiet; anything that outlines an interactive
       control uses --border-input, which meets the 3:1 non-text minimum. */
    --border:#39424E;
    --border-soft:#2A313A;
    --border-input:#646B75;
    --radius:10px;
    /* One type scale instead of eighteen ad-hoc sizes. */
    --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-lg:16px; --fs-xl:20px;
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  /* Keyboard operability across the whole app. The only :focus rule that used
     to exist removed the outline. */
  :focus-visible{outline:2px solid var(--gold); outline-offset:2px; border-radius:4px;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{
    font-family:'Fraunces',serif;
    font-weight:600;
    margin:0;
    letter-spacing:-0.01em;
  }
  .mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
  .muted{color:var(--muted);}
  .muted-2{color:var(--muted-2);}
  button{font-family:'Inter',sans-serif; cursor:pointer;}
  input,select{font-family:'IBM Plex Mono',monospace; color:var(--text);}

  #app{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}
  .brand{display:flex;align-items:baseline;gap:14px;margin-bottom:4px;}
  .brand .stamp{
    display:inline-flex;align-items:center;justify-content:center;
    width:38px;height:38px;border:2px solid var(--gold);border-radius:50%;
    color:var(--gold);font-family:'Fraunces',serif;font-weight:700;font-size:16px;
    transform:rotate(-8deg);
  }
  .brand h1{font-size:28px;color:var(--text);}
  .brand .tag{color:var(--muted); font-size:12.5px; margin-left:4px;}
  .subhead{color:var(--muted); font-size:13px; margin:2px 0 22px 52px;}

  nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:24px;
           overflow-x:auto;scrollbar-width:none;max-width:100%;}
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{flex:0 0 auto;}
  nav.tabs button{
    background:none;border:none;color:var(--muted);
    padding:11px 18px;border-bottom:2px solid transparent;letter-spacing:.02em;
    text-transform:uppercase;font-size:12px;font-weight:600;
  }
  nav.tabs button:hover{color:var(--text);}
  nav.tabs button.active{color:var(--gold);border-bottom-color:var(--gold);}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
  .panel + .panel{margin-top:16px;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
  .panel-head h2{font-size:16px;color:var(--text);}
  .panel-head-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:10.5px;color:var(--muted-2);font-weight:600;margin-bottom:6px;}

  .btn{background:var(--panel-alt); color:var(--text); border:1px solid var(--border); border-radius:7px; padding:7px 13px; font-size:12.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px;}
  .btn:hover{background:var(--row-hover); border-color:var(--muted-2);}
  .btn-gold{background:var(--gold); color:#1a1502; border-color:var(--gold);}
  .btn-gold:hover{filter:brightness(1.08);}
  .btn-ghost{background:none;border:1px solid var(--border);}
  /* .btn:hover used to out-specify .btn-danger, turning a delete button
     neutral grey at the exact moment of commitment. */
  .btn-danger, .btn.btn-danger{background:var(--red-soft); color:#EE6E63; border-color:#6E3630;}
  .btn-danger:hover, .btn.btn-danger:hover{background:#3A201D; color:#F4867C; border-color:var(--red);}
  .btn-sm{padding:4px 9px;font-size:11.5px;border-radius:6px;}
  .icon-btn{background:none;border:1px solid var(--border);color:var(--muted);width:26px;height:26px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;line-height:1;}
  .icon-btn:hover{color:var(--red);border-color:var(--red);}
  .btn:disabled{opacity:.5;cursor:default;}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  /* Grid and flex children default to min-width:auto, so a wide child (a
     table, a long unbroken name) refuses to shrink and pushes the whole page
     sideways instead of scrolling inside its own container. */
  .grid-2 > *, .grid-3 > *, .stat-grid > *{min-width:0;}
  .panel, .panel-head, .cat-group, .stat-card{min-width:0;}
  .panel-head h2, .panel-head h3, .exp-name, .goal-name, .cat-title span{
    min-width:0; overflow-wrap:anywhere;}
  @media(max-width:760px){.grid-2,.grid-3{grid-template-columns:1fr;}}
  /* Two members side by side means two 8-column tables of inputs; they need
     roughly 1350px before they stop overflowing, which the 1180px cap makes
     unreachable. Stack them until there is genuinely room. */
  .grid-2.split-tables{grid-template-columns:1fr;}
  @media(min-width:1360px){.grid-2.split-tables{grid-template-columns:1fr 1fr;}}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;align-items:start;}

  .stat-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;}
  .stat-card .eyebrow{margin-bottom:8px;}
  .stat-card .value{font-family:'Fraunces',serif;font-size:30px;font-weight:600;}
  .stat-card .value.income{color:var(--green);}
  .stat-card .value.expense{color:var(--red);}
  .stat-card .note{font-size:12px;color:var(--muted);margin-top:6px;}

  .goal-card{background:var(--panel-alt);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;}
  .goal-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .goal-name{font-family:'Fraunces',serif;font-size:17px;font-weight:600;}
  .goal-date{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .flag{font-family:'Fraunces',serif;font-weight:700;font-size:11.5px;letter-spacing:.06em;padding:5px 12px;border-radius:20px;border:1.5px solid; text-transform:uppercase;transform:rotate(-3deg); white-space:nowrap;}
  .flag.ontrack{color:var(--green);border-color:var(--green);background:var(--green-soft);}
  .flag.behind{color:#EE6E63;border-color:var(--red);background:var(--red-soft);}
  .flag.close{color:var(--amber);border-color:var(--amber);background:#2C2113;}
  .flag.newgoal{color:var(--muted);border-color:var(--border-input);background:var(--panel-alt);}
  /* auto-fit balances itself at any width and any item count — the fixed
     4-column grid orphaned a lone 5th metric and left a gap beside 3. */
  .goal-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:14px;margin-top:14px;}
  .metric .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-2);margin-bottom:3px;}
  .metric .val{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;}
  .metric .val.pos{color:var(--green);} .metric .val.neg{color:var(--red);}
  .bar{height:6px;border-radius:4px;background:var(--border-soft);margin-top:14px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--gold);}

  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-2);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border);}
  td{padding:7px 10px;border-bottom:1px solid var(--border-soft);font-size:13px;vertical-align:middle;}
  tr:hover td{background:var(--row-hover);}
  .col-tight{width:1%;white-space:nowrap;}
  td input, td select{
    background-color:var(--panel);border:1px solid var(--border-input);color:var(--text);
    padding:5px 7px;border-radius:5px;font-size:var(--fs-sm);width:100%;min-width:0;
    -webkit-appearance:none; -moz-appearance:none; appearance:none;
  }
  /* appearance:none strips the native arrow, which left selects visually
     identical to text inputs. Draw one back. */
  td select, .field select{
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 14px) 50%, calc(100% - 9px) 50%;
    background-size:5px 5px, 5px 5px; background-repeat:no-repeat; padding-right:26px;
  }
  td input:hover, td select:hover{border-color:var(--muted-2);}
  td input:focus, td select:focus{border-color:var(--gold);background-color:var(--panel-alt);}
  td input::-webkit-calendar-picker-indicator{filter:invert(0.75);cursor:pointer;}
  td.money input{text-align:right;font-weight:600;}
  tbody tr:nth-child(even) td{background:rgba(255,255,255,.018);}
  tbody tr:hover td{background:var(--row-hover);}
  /* Every wide table gets a scroll container of its own so the page itself
     never scrolls sideways. Focusable, so it is reachable by keyboard. */
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;}
  .table-scroll:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .table-scroll table{min-width:560px;}
  .hint-sm{font-size:var(--fs-xs);color:var(--muted);margin-top:4px;line-height:1.35;}

  .sub-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .sub-tabs button{background:var(--panel-alt);border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;}
  .sub-tabs button.active{background:var(--gold-soft);color:var(--gold);border-color:var(--gold);}

  .assump-row{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:18px;}
  .assump-item{background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;padding:10px 14px;min-width:210px;}
  .assump-item label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-2);margin-bottom:5px;}
  .assump-item input{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:14px;width:100px;}
  .assump-item .desc{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.4;}

  .pill{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10.5px;font-weight:600;letter-spacing:.02em;}
  .pill.est{background:var(--panel-alt);color:var(--muted);border:1px solid var(--border);}
  .pill.actual{background:var(--green-soft);color:var(--green);border:1px solid #234436;}

  .cat-group{margin-bottom:14px;}
  .cat-title{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;background:var(--panel-alt);border-radius:7px;margin-bottom:4px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
  .cat-title .amt{color:var(--text);font-family:'IBM Plex Mono',monospace;}

  .exp-row.flagged td{background:var(--red-soft);}
  .exp-row.flagged .exp-name{color:#d99b95;text-decoration:line-through;}
  .exp-row.cancelled td{opacity:.45;}

  .flagged-sub{margin-top:8px;margin-left:6px;border-left:2px solid var(--red);padding-left:10px;}
  .flagged-sub-title{display:flex;justify-content:space-between;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--red);font-weight:700;margin-bottom:4px;}
  .flagged-sub-title .amt{font-family:'IBM Plex Mono',monospace;}

  .ctx-menu{position:fixed;background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.5);padding:4px;z-index:200;min-width:170px;}
  .ctx-menu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:8px 10px;font-size:12.5px;border-radius:5px;}
  .ctx-menu button:hover{background:var(--row-hover);}
  .ctx-menu button.danger{color:var(--red);}

  .modal-overlay{position:fixed;inset:0;background:rgba(6,8,11,.72);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:22px;max-width:480px;width:100%;max-height:85vh;overflow-y:auto;}
  .modal h3{font-size:17px;margin-bottom:4px;}
  .modal .desc{font-size:12.5px;color:var(--muted);margin-bottom:16px;}
  .field{margin-bottom:12px;}
  .field label, .field-label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-2);margin-bottom:5px;}
  .field input, .field select{width:100%;background:var(--panel-alt);border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-size:13.5px;}
  /* Without wrapping, two date inputs (each with a ~120px native floor) were
     clipped inside a 236px modal at 320px — not scrolled, clipped. */
  .field-row{display:flex;gap:10px;flex-wrap:wrap;}
  .field-row .field{flex:1 1 160px;min-width:0;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .scan-drop{border:1.5px dashed var(--border);border-radius:9px;padding:16px;text-align:center;font-size:12px;color:var(--muted);margin-bottom:16px;}
  .scan-drop.busy{color:var(--gold);border-color:var(--gold);}

  .pending-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-soft);}
  .pending-item:last-child{border-bottom:none;}
  .pending-item .pi-name{font-size:13px;font-weight:600;}
  .pending-item .pi-date{font-size:11px;color:var(--muted);}
  .pending-item input{width:100px;background:var(--panel-alt);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:13px;}

  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel-alt);border:1px solid var(--border);border-radius:16px;padding:4px 6px 4px 12px;font-size:12px;}
  .chip button{background:none;border:none;color:var(--muted-2);width:16px;height:16px;border-radius:50%;font-size:12px;}
  .chip button:hover{color:var(--red);background:var(--red-soft);}

  .empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:13px;}
  .empty .big{font-family:'Fraunces',serif;font-size:16px;color:var(--muted);display:block;margin-bottom:4px;}

  .goal-detail{margin-top:14px;border-top:1px dashed var(--border);padding-top:14px;}
  .month-table td.neg{color:var(--red);} .month-table td.pos{color:var(--green);}

  details.history-month{background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden;}
  details.history-month summary{padding:10px 14px;cursor:pointer;font-size:13px;font-weight:600;display:flex;justify-content:space-between;list-style:none;}
  details.history-month summary::-webkit-details-marker{display:none;}
  details.history-month summary .net-preview{font-family:'IBM Plex Mono',monospace;font-weight:700;}
  details.history-month .history-body{padding:0 14px 14px;}

  footer.hint{margin-top:30px;text-align:center;color:var(--muted-2);font-size:11.5px;}

  .auth-wrap{max-width:400px;margin:80px auto;padding:0 20px;}
  .auth-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:28px;}
  .auth-tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--panel-alt);border-radius:8px;padding:4px;}
  .auth-tabs button{flex:1;background:none;border:none;color:var(--muted);padding:8px;border-radius:6px;font-size:12.5px;font-weight:600;}
  .auth-tabs button.active{background:var(--gold);color:#1a1502;}
  .auth-err{background:var(--red-soft);color:var(--red);border-radius:7px;padding:10px 12px;font-size:12.5px;margin-bottom:14px;}
  .auth-ok{background:var(--green-soft);color:var(--green);border-radius:7px;padding:10px 12px;font-size:12.5px;margin-bottom:14px;}
  .sync-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;}
  .sync-dot.ok{background:var(--green);}
  .sync-dot.pending{background:var(--gold);}
  .sync-dot.off{background:var(--red);}
  .code-pill{font-family:'IBM Plex Mono',monospace;background:var(--panel-alt);padding:2px 8px;border-radius:5px;letter-spacing:.03em;}
  .status-badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.03em;}
  .status-badge.active{background:var(--green-soft);color:var(--green);}
  .status-badge.expired{background:var(--red-soft);color:#EE6E63;}
  .status-badge.redeemed{background:var(--gold-soft);color:var(--gold);}

  /* ---- charts (hand-rolled SVG; no library, no network) ---- */
  .chart{width:100%;display:block;overflow:visible;}
  .chart text{font-family:'IBM Plex Mono',monospace;fill:var(--muted-2);font-size:10px;}
  .chart .axis{stroke:var(--border);stroke-width:1;}
  .chart .zero{stroke:var(--muted-2);stroke-width:1;stroke-dasharray:3 3;}
  .chart .grid{stroke:var(--border-soft);stroke-width:1;}
  .chart-wrap{background:var(--panel-alt);border:1px solid var(--border);border-radius:9px;padding:16px 18px 10px;margin-bottom:14px;}
  .chart-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--fs-xs);color:var(--muted);margin-top:10px;}
  .chart-legend span{display:inline-flex;align-items:center;gap:6px;}
  .swatch{width:10px;height:10px;border-radius:3px;display:inline-block;flex:0 0 auto;}
  .chart-empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:var(--fs-sm);}

  /* ---- confidence + estimate signalling ---- */
  .conf{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;
        text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:10px;border:1px solid;}
  .conf.high{color:var(--green);border-color:#2C5741;background:var(--green-soft);}
  .conf.medium{color:var(--gold);border-color:#5A4E22;background:var(--gold-soft);}
  .conf.low{color:var(--amber);border-color:#6B4A1E;background:#2C2113;}
  .conf.none{color:var(--muted);border-color:var(--border);background:var(--panel-alt);}
  .range-note{font-size:var(--fs-xs);color:var(--muted);margin-top:6px;font-family:'IBM Plex Mono',monospace;}
  .stat-card.estimated{border-style:dashed;}

  /* ---- toast ---- */
  #toast-host{position:fixed;right:16px;bottom:16px;z-index:400;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px));}
  .toast{background:var(--panel-alt);border:1px solid var(--border-input);border-left:3px solid var(--gold);
         border-radius:9px;padding:11px 13px;box-shadow:0 10px 30px rgba(0,0,0,.55);
         display:flex;align-items:center;gap:12px;font-size:var(--fs-md);}
  .toast.ok{border-left-color:var(--green);} .toast.err{border-left-color:var(--red);}
  .toast .t-msg{flex:1;}
  .toast button{background:none;border:1px solid var(--border-input);color:var(--text);
                border-radius:6px;padding:4px 10px;font-size:var(--fs-sm);font-weight:600;}
  .toast button:hover{border-color:var(--gold);color:var(--gold);}

  /* ---- credit-card treatment (§6) ----
     Credit spending is a different financial concept from cash leaving an

<script>
/* =========================================================
   TALLY — state, storage, helpers
========================================================= */
const GAS_CAT = "Gas & Transit";
const ONETIME_CAT = "One-Time Purchases";
const ALL_CATS = ["Housing","Debt","Subscription","Insurance","Living",GAS_CAT,"Personal","Misc",ONETIME_CAT];
const RECURRING_CATS = ["Housing","Debt","Subscription","Insurance"];
const OTHER_EXPENSE_CATS = ALL_CATS.filter(c=>!RECURRING_CATS.includes(c));

/* ---------------------------------------------------------
   CIVIL DATES
   A date in this app is a calendar day the user lived through
   ("2026-08-12"), not an instant. It has no timezone. Anything
   that round-trips one through Date.toISOString() re-reads it in
   UTC and lands on the wrong day for every user east of UTC — and
   todayISO() done that way rolls over to tomorrow at 8pm in Miami.
   So: format from the LOCAL parts, and parse at LOCAL NOON, which
   is far enough from both midnights that no DST shift can move the
   day. Nothing below may call toISOString().
--------------------------------------------------------- */
function isoOf(d){
  return String(d.getFullYear()).padStart(4,'0') + '-' +
         String(d.getMonth()+1).padStart(2,'0') + '-' +
         String(d.getDate()).padStart(2,'0');
}
/* Parses "YYYY-MM-DD" to local noon. Returns null for anything that
   isn't a real calendar day, so bad input fails loudly here instead of
   turning into NaN three functions downstream. */
function parseISO(iso){
  if(typeof iso !== 'string') return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso.trim());
  if(!m) return null;
  const y = +m[1], mo = +m[2], d = +m[3];
  if(mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  const dt = new Date(y, mo-1, d, 12, 0, 0, 0);
  if(dt.getFullYear()!==y || dt.getMonth()!==mo-1 || dt.getDate()!==d) return null; // e.g. Feb 30
  return dt;
}
function isValidISO(iso){ return parseISO(iso) !== null; }
/* "Today" goes through one function so it can be pinned in tests. Without a
   seam here, none of the time-dependent behaviour — a COMING UP obligation
   becoming PASSED, a month rolling over and archiving, a goal deadline passing
   — can be verified at all, because it only happens on the wall clock's
   schedule. Production never sets this. */
let _todayOverride = null;
function setToday(iso){ _todayOverride = isValidISO(iso) ? iso : null; clearMemo(); }
const todayISO = () => _todayOverride || isoOf(new Date());
/* First/last civil day of a month, built without ever leaving local time. */
function monthStartISO(y, m){ return isoOf(new Date(y, m-1, 1, 12)); }   // m is 1-12
function monthEndISO(y, m){ return isoOf(new Date(y, m, 0, 12)); }       // day 0 of next month

/* Render-scoped memo. The derived figures were each recomputed 2-5 times per
   render from ~60 scattered call sites; worse, two calls in the same render
   could straddle midnight and disagree. Cleared at the start of every render
   and on every save, so it can never serve a stale number. */
let _memo = new Map();
function memo(key, fn){
  if(!_memo.has(key)) _memo.set(key, fn());
  return _memo.get(key);
}
function clearMemo(){ _memo.clear(); }

function uid(){
  // Random enough that two rows created in the same millisecond, on two
  // devices, won't collide the way an 8-char Math.random id eventually does.
  if(window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID().slice(0,18);
  if(window.crypto && window.crypto.getRandomValues){
    const b = new Uint8Array(9);
    window.crypto.getRandomValues(b);
    return Array.from(b, x=>x.toString(16).padStart(2,'0')).join('');
  }
  return Math.random().toString(36).slice(2,10) + Date.now().toString(36);
}

/* ---------------------------------------------------------
   MONEY + TEXT SAFETY
--------------------------------------------------------- */
/* Every amount that comes out of an input, a backup file, or an LLM
   extraction goes through here. Number("") is 0, Number(undefined) is NaN,
   and one NaN silently poisons every total it touches — so anything that
   isn't a finite number becomes 0 at the boundary, not halfway down a sum. */
function num(v){
  const n = typeof v === 'number' ? v : parseFloat(v);
  return Number.isFinite(n) ? n : 0;
}
/* Snap to whole cents. Applied where money is stored and where a total is
   finished, so 0.1+0.2 never surfaces as 0.30000000000000004 and a
   surplus/shortfall test can't flip on a 1e-13 residue. */
const MAX_MONEY = 1e12;   // a trillion dollars is past any honest ledger
/* Dollars to whole cents.
   Rounds AWAY FROM ZERO at the half cent, so a credit and a matching debit
   cancel — Math.round is half-UP, which turns 5,000 entries of +$0.005 and
   5,000 of -$0.005 into $50.00 instead of $0.00.
   The epsilon is applied after scaling and proportionally: 1.005 is really
   1.00499999999999989 in binary, so a fixed Number.EPSILON (which is relative
   to 1.0) is far too small to correct it at the scale of cents. */
function toCents(n){
  const v = num(n);
  if(v >= MAX_MONEY) return MAX_MONEY * 100;
  if(v <= -MAX_MONEY) return -MAX_MONEY * 100;
  return Math.sign(v) * Math.round(Math.abs(v) * 100 * (1 + Number.EPSILON));
}
function round2(n){ return toCents(n) / 100; }
/* Sum a list of amounts and settle to cents once, at the end. */
function sumMoney(list, pick){
  if(!Array.isArray(list)) return 0;
  let cents = 0;
  for(const x of list) cents += toCents(pick ? pick(x) : x);
  return cents / 100;
}
/* Text going into innerHTML. The app renders from template literals, and
   some of that text is a merchant name an LLM read off a stranger's PDF,
   so it is treated as hostile everywhere — element text and attributes
   alike (hence the quote and backtick escapes). */
function esc(s){
  if(s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/`/g,'&#96;');
}

/* =========================================================
   THE FINANCIAL MODEL

   Three record types, and the distinction between them is the whole point:

   ACCOUNTS      where money sits. kind 'cash' counts toward Stored Cash;
                 kind 'credit' does not — a credit balance is debt, not cash.

   OBLIGATIONS   recurring commitments. A DEFINITION, not an event: "Netflix,
                 $15.99, monthly, the 22nd". It persists whether or not this
                 month's instance has happened, survives being paused, and is
                 what the Recurring section lists.

   TXNS          things that actually happened, on a date, for an amount. A
                 fact. Immutable in spirit: an obligation changing its price
                 must never rewrite what you actually paid in March.

   The old model had only one type, and frequency was a field on it — so
   flipping an expense from 'monthly' to 'onetime' changed what the record
   fundamentally WAS, which is why entries vanished from Other Expenses. An
   obligation and its instances are now separate rows linked by obligationId.

   Every txn amount is stored POSITIVE. Direction lives in `kind`, so no
   screen has to remember which way a sign points:
     expense     money out (payment: 'cash' reduces Stored Cash, 'credit' doesn't)
     income      money in
     cc_payment  cash account -> credit card. Reduces Stored Cash. The purchases
                 it settles are NOT subtracted again; that is the double-count
                 the spec calls out.
     transfer    between two tracked accounts. Never changes Stored Cash.
========================================================= */
const ACCOUNT_KINDS = ['cash','credit'];
const TXN_KINDS = ['expense','income','cc_payment','transfer'];
const PAYMENT_MODES = ['cash','credit'];
const FREQUENCIES = ['onetime','weekly','biweekly','monthly','yearly','variable'];
/* A recurring item is PASSED or COMING UP inside this window, per spec §5. */
const RECURRING_WINDOW_DAYS = 13;

function defaultState(){
  return {
    schemaVersion: 4,
    accounts: [],
    /* The dated starting point for every cash calculation (§1). Never valid
       without a date — an undated balance can't be reasoned forward from. */
    cashBaseline: null,        // {id, asOf, amount, byAccount:{}, recordedAt}
    baselineHistory: [],       // every baseline ever set, with its discrepancy
    discrepancies: [],         // {id, date, amount, expected, entered, note}
    obligations: [],           // recurring expense DEFINITIONS
    /* Recurring INCOME definitions. Exactly the same shape as an obligation,
       because they are the same idea pointing the other way: a commitment that
       recurs on a schedule. Sharing the shape means they share the scheduling
       engine, so income and expenses can never disagree about what "monthly on
       the 15th" or "yearly in October" means. */
    incomeSources: [],
    enrichment: {},            // merchantKey -> cached enrichment result
    archives: {},              // frozen per-month records, keyed YYYY-MM (§14)
    txns: [],                  // things that actually happened
    settings: {
      onboarded: false,
      jobHasBonuses: false,
      sideGigsEnabled: true,
      otherIncomeEnabled: false,
      dashboardMode: 'current', // 'current' | 'projection' | 'needed'
      projectionMode: 'fixed', // 'fixed' | 'averaged' — how side gig income projections are calculated
    },
    members: [

    job: {

      avgRate: 0,
      defaultHours: 0,
      payFrequency: 'biweekly', // 'weekly' | 'biweekly' — used by hourly (and fixed period length)
      netFactor: null,          // take-home ÷ gross; learned from pay stubs, 1 until known
      fixedAmount: 0,
      fixedFrequency: 'biweekly', // 'weekly' | 'biweekly' | 'monthly' | 'yearly' — used by fixed
      periods: [],
      weeklyVariable: {
        closeDay: 5, // 0=Sun..6=Sat, default Friday
        entries: [] // {id, weekEnd, amount, isFinal, memberId}
      }
    },
    sideGig: {

      projectedMonthly: 0,
      entries: []
    },
    otherIncome: {
      entries: [] // {id, date, label, amount, memberId, notes}
    },
    expenses: {
      items: [],
      monthlyLog: {}
    },
    goals: [],
    dismissedPending: [],
    pendingDocReview: null // {docType, rows} — an in-progress document upload review, saved so it survives an accidental close
  };
}

let state = null;
let saveTimer = null;
let dirty = false;   // is there an unsaved change worth flushing on tab hide?

/* ---------- Supabase client ---------- */
const SUPABASE_URL = 'https://licgomsgdennxmoknxpy.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxpY2dvbXNnZGVubnhtb2tueHB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MzMwOTQsImV4cCI6MjEwMjAwOTA5NH0.YQCV5j0A-HtbrzlWxjUP9t7tRGXg5Oa0FWrJwnIuSGA';

let session = null;
let profile = null; // {id, email, is_admin, household_id}
let syncStatus = 'ok'; // 'ok' | 'pending' | 'off'
const LOCAL_CACHE_KEY = 'tally-cache-v1';

function cacheKeyFor(){
  return (profile && profile.household_id) ? (LOCAL_CACHE_KEY + ':' + profile.household_id) : null;
}
function cacheStateLocally(){
  const key = cacheKeyFor();
  if(!key) return;
  try{ localStorage.setItem(key, JSON.stringify({state, cachedAt:new Date().toISOString()})); }
  catch(e){
    // A swallowed QuotaExceededError meant the offline cache silently stopped
    // working and the user was never told their last-resort copy was gone.
    console.error('local cache write failed', e);
    syncStatus = 'pending';
    updateSyncIndicator();
  }
}
function readLocalCache(){
  const key = cacheKeyFor();
  if(!key) return null;
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

function scheduleSave(){
  // Any save means the data changed, so every derived figure is now suspect.
  clearMemo();
  dirty = true;
  clearTimeout(saveTimer);
  // Caching moved inside the debounce: it was running synchronously on all ~64
  // scheduleSave() call sites, serialising the whole ledger (measured ~1MB on a
  // large one) into localStorage on every keystroke.
  saveTimer = setTimeout(()=>{ cacheStateLocally(); syncToCloud(); }, 500);
}
/* For moments that must not be lost if the tab closes right after
   (e.g. finishing onboarding) — saves immediately instead of waiting.
   Returns {ok, error} so callers can surface a real failure to the user. */
async function flushSave(){
  cacheStateLocally();
  clearTimeout(saveTimer);
  return await syncToCloud();
}

async function syncToCloud(){
  if(!profile || !profile.household_id){
    return { ok:false, error: 'no_household' };
  }
  // Never write over data we failed to read. See loadState().
  if(!loadOK){
    syncStatus = 'pending';
    updateSyncIndicator();
    return { ok:false, error: 'your ledger could not be loaded, so nothing is being saved — reload the page' };
  }
  try{
    /* Optimistic concurrency. The old write was a whole-document upsert with
       last-write-wins and no version at all, which meant the household feature
       actively destroyed data: two people on two devices, and whoever typed
       last silently erased the other's edits. `rev` is carried inside the JSON
       document, so this needs no schema change — we re-read it, refuse to write
       if it moved under us, and tell the user rather than clobbering. */
    const { data: cur, error: readErr } = await sb.from('household_data')
      .select('data').eq('household_id', profile.household_id).maybeSingle();
    if(readErr) throw readErr;
    const remoteRev = (cur && cur.data && num(cur.data.rev)) || 0;
    const localRev = num(state.rev) || 0;
    if(cur && remoteRev > localRev){
      syncStatus = 'conflict';
      updateSyncIndicator();
      showConflictBanner();
      return { ok:false, error: 'changed_elsewhere' };
    }
    state.rev = localRev + 1;
    const { error } = await sb.from('household_data').upsert({
      household_id: profile.household_id,
      data: state,
      updated_at: new Date().toISOString()
    });
    if(error){ state.rev = localRev; throw error; }
    syncStatus = 'ok';
    dirty = false;
    retryDelay = 2000;
    updateSyncIndicator();
    return { ok:true, error:null };
  }catch(e){
    syncStatus = navigator.onLine === false ? 'off' : 'pending';
    console.error('cloud sync failed', e);
    updateSyncIndicator();
    // A failure that isn't an offline event (a 500, a dropped connection) had
    // no retry at all — it waited for an `online` event that would never fire.
    scheduleRetry();
    return { ok:false, error: (e && (e.message || e.details || e.hint)) || String(e) };
  }
}
/* Someone else in the household saved while this tab was holding older data.
   Rather than pick a winner silently, stop writing and let the user decide. */
function showConflictBanner(){
  if(document.getElementById('conflict-banner')) return;
  const bar = el(`
    <div id="conflict-banner" role="alert" style="position:fixed;left:0;right:0;top:0;z-index:500;
         background:#3A201D;border-bottom:1px solid var(--red);padding:10px 16px;
         display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:var(--fs-md);">
      <span>This ledger was changed on another device. Your recent edits here have <strong>not</strong> been saved.</span>
      <button class="btn btn-sm" id="conflict-reload">Reload the newer version</button>
      <button class="btn btn-sm btn-danger" id="conflict-force">Keep mine instead</button>
    </div>`);
  bar.querySelector('#conflict-reload').addEventListener('click', ()=> window.location.reload());
  bar.querySelector('#conflict-force').addEventListener('click', async ()=>{
    // Explicit user choice to overwrite — jump the revision past the remote one.
    const { data: cur } = await sb.from('household_data').select('data').eq('household_id', profile.household_id).maybeSingle();
    state.rev = ((cur && cur.data && num(cur.data.rev)) || 0) + 1;
    bar.remove();
    syncStatus = 'ok';
    await syncToCloud();
    toast('Your version was saved over the other device\'s', {kind:'ok'});
  });
  document.body.appendChild(bar);
}

let retryDelay = 2000, retryTimer = null;
function scheduleRetry(){
  if(retryTimer) return;
  retryTimer = setTimeout(()=>{
    retryTimer = null;
    if(dirty && state && profile && profile.household_id) syncToCloud();
  }, retryDelay);
  retryDelay = Math.min(retryDelay * 2, 60000);   // back off, cap at a minute
}
window.addEventListener('online', ()=>{ retryDelay = 2000; if(dirty) syncToCloud(); });
window.addEventListener('offline', ()=>{ syncStatus = 'off'; updateSyncIndicator(); });
// Flush a pending save the moment the tab is hidden, but only if something
// actually changed — this used to fire a full upsert on every tab switch.
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'hidden' && dirty && state && profile && profile.household_id){
    clearTimeout(saveTimer);
    cacheStateLocally();
    syncToCloud();
  }
});
function updateSyncIndicator(){
  const dot = document.getElementById('sync-dot');
  const label = document.getElementById('sync-label');
  if(!dot || !label) return;
  // 'pending' and 'off' used to share the same words, so the only thing
  // separating "your save is being rejected" from "you're offline, this is
  // fine" was gold vs red — and the wording claimed offline either way.
  const map = {
    ok:       ['ok',      'Saved'],
    pending:  ['pending', 'Save failed — retrying'],
    off:      ['off',     'Offline — will sync'],
    conflict: ['off',     'Changed on another device']
  };
  const [cls, text] = map[syncStatus] || map.ok;
  dot.className = 'sync-dot ' + cls;
  label.textContent = text;
}

/* Did we successfully read the cloud copy this session? If not, nothing may be
   written back. Without this latch a failed read fell through to an empty
   defaultState(), which has onboarded:false — so the user was shown the setup
   wizard, completed it, and the resulting blank ledger was upserted straight
   over their real data. A read failure must never become a write. */
let loadOK = false;
async function loadState(){
  // Cloud is the source of truth whenever we can reach it — even an
  // intentionally EMPTY new account — so a stale local cache from a
  // different account on this same browser never leaks through.
  loadOK = false;
  let loadError = null;
  if(profile && profile.household_id){
    try{
      const { data, error } = await sb.from('household_data').select('data').eq('household_id', profile.household_id).maybeSingle();
      if(error) throw error;
      state = (data && data.data && Object.keys(data.data).length) ? data.data : defaultState();
      migrateState();
      cacheStateLocally();
      syncStatus = 'ok';
      loadOK = true;
    }catch(e){
      // A RETURNED error (a transient RLS denial, a 500) used to look identical
      // to "no row yet" and fall through to the same silent-overwrite path.
      loadError = (e && (e.message || e.details)) || String(e);
      syncStatus = 'pending';
      console.error('could not read the cloud ledger', e);
    }
  }
  if(!loadOK){
    const cached = readLocalCache();
    state = cached ? cached.state : defaultState();
    migrateState();
  }
  return { ok: loadOK, error: loadError };
}
/* Ensures older saved data always has every field the current code expects,
   so future updates to this file never wipe or crash on someone's existing data. */
function isPlainObject(v){ return Object.prototype.toString.call(v) === '[object Object]'; }
function migrateState(){
  clearMemo();
  const d = defaultState();
  if(!isPlainObject(state.settings)){
    const hasExistingData = (state.job && Array.isArray(state.job.periods) && state.job.periods.length>0)
      || (state.expenses && Array.isArray(state.expenses.items) && state.expenses.items.length>0);
    state.settings = Object.assign({}, d.settings, { onboarded: !!hasExistingData });
  }
  else{
    for(const k in d.settings){ if(state.settings[k]===undefined) state.settings[k] = d.settings[k]; }
  }
  // Carry forward the old two-field toggle state into the new tri-state field, if present
  if(state.settings._migratedDashboardMode !== true){
    if(state.settings.showNeededMode === true) state.settings.dashboardMode = 'needed';
    else if(state.settings.projectedIncomeEnabled === true) state.settings.dashboardMode = 'projection';
    else if(state.settings.projectedIncomeEnabled === false) state.settings.dashboardMode = 'current';
    delete state.settings.showNeededMode;
    delete state.settings.projectedIncomeEnabled;
    state.settings._migratedDashboardMode = true;
  }
  if(!Array.isArray(state.members) || state.members.length===0) state.members = d.members;
  if(!isPlainObject(state.otherIncome)) state.otherIncome = d.otherIncome;
  if(!Array.isArray(state.otherIncome.entries)) state.otherIncome.entries = [];
  if(!isPlainObject(state.job)) state.job = d.job;
  if(state.job.avgRate==null) state.job.avgRate = 0;
  if(state.job.defaultHours==null) state.job.defaultHours = 0;
  if(!state.job.payType) state.job.payType = 'hourly';
  if(!state.job.payFrequency) state.job.payFrequency = 'biweekly';
  if(state.job.fixedAmount==null) state.job.fixedAmount = 0;
  if(!state.job.fixedFrequency) state.job.fixedFrequency = 'biweekly';
  if(!isPlainObject(state.job.weeklyVariable)) state.job.weeklyVariable = { closeDay: 5, entries: [] };
  if(state.job.weeklyVariable.closeDay==null) state.job.weeklyVariable.closeDay = 5;
  if(!Array.isArray(state.job.weeklyVariable.entries)) state.job.weeklyVariable.entries = [];
  if(!Array.isArray(state.job.periods)) state.job.periods = [];
  if(!isPlainObject(state.sideGig)) state.sideGig = d.sideGig;
  if(!Array.isArray(state.sideGig.sources) || state.sideGig.sources.length===0) state.sideGig.sources = d.sideGig.sources;
  if(state.sideGig.projectedMonthly==null) state.sideGig.projectedMonthly = 0;
  if(!Array.isArray(state.sideGig.entries)) state.sideGig.entries = [];
  if(!isPlainObject(state.expenses)) state.expenses = d.expenses;
  if(!Array.isArray(state.expenses.items)) state.expenses.items = [];
  if(!isPlainObject(state.expenses.monthlyLog)) state.expenses.monthlyLog = {};
  if(!Array.isArray(state.goals)) state.goals = [];
  if(!Array.isArray(state.dismissedPending)) state.dismissedPending = [];
  if(state.pendingDocReview===undefined) state.pendingDocReview = null;

  /* --- schema 3: drop rows that can't be reasoned about, and give every
     recurring expense a start date ---------------------------------------
     Anything arriving here may be a hand-edited backup or a file from an
     older build, so each collection is filtered down to rows that at minimum
     have an id and a usable date. A single null in one of these arrays used
     to blank the whole screen. */
  state.members = state.members.filter(m=>m && m.id).map(m=>({
    id:m.id, name:String(m.name||'Unnamed'), color:/^#[0-9a-f]{6}$/i.test(m.color||'') ? m.color : '#C9A227'
  }));
  if(state.members.length===0) state.members = d.members;

  state.job.periods = state.job.periods.filter(p=>p && p.id && isValidISO(p.payDate));
  state.job.weeklyVariable.entries = state.job.weeklyVariable.entries.filter(e=>e && e.id && isValidISO(e.weekEnd));
  state.sideGig.entries = state.sideGig.entries.filter(e=>e && e.id && isValidISO(e.date));
  state.otherIncome.entries = state.otherIncome.entries.filter(e=>e && e.id && isValidISO(e.date));
  state.goals = state.goals.filter(g=>g && g.id);
  state.sideGig.sources = state.sideGig.sources.filter(s=>typeof s==='string' && s.trim()).slice(0,50);

  state.expenses.items = state.expenses.items.filter(i=>i && i.id).map(item=>{
    if(!['monthly','biweekly','variable','onetime'].includes(item.frequency)) item.frequency = 'onetime';
    if(!ALL_CATS.includes(item.category)) item.category = ONETIME_CAT;
    if(!['active','flagged','cancelled'].includes(item.status)) item.status = 'active';
    // The one name the old migration never coerced — and the most-rendered
    // LLM-controlled string in the app. An object here printed as
    // "[object Object]"; an unbounded one blew the localStorage quota.
    item.name = String(item.name == null ? 'Untitled expense' : item.name).slice(0, 200);
    item.amount = round2(item.amount);
    if(item.frequency==='onetime' && !isValidISO(item.date)) item.date = todayISO();
    if(item.endDate && !isValidISO(item.endDate)) item.endDate = null;
    if(item.frequency === 'biweekly' && !isValidISO(item.anchorDate)){
      item.anchorDate = isValidISO(item.startDate) ? item.startDate : todayISO();
    }
    if(item.frequency !== 'onetime' && !isValidISO(item.startDate)){
      // Backfill from the earliest evidence the item existed: its anchor date,
      // or the oldest payment logged against it. Falls back to "always been
      // there", which is what the old unbounded behaviour effectively assumed.
      const logged = Object.keys(state.expenses.monthlyLog)
        .filter(k=>k.split('|')[0]===item.id).map(k=>k.split('|')[1]).filter(isValidISO).sort();
      item.startDate = logged[0] || (isValidISO(item.anchorDate) ? item.anchorDate : null);
    }
    return item;
  });

  // Goals: lock in the pace they were created with so progress is graded
  // against a fixed bar instead of one that moves every time savings change.
  state.goals.forEach(g=>{
    if(!isValidISO(g.startDate)) g.startDate = todayISO();
    if(!isValidISO(g.targetDate)) g.targetDate = addDays(g.startDate, 90);
    if(g.targetDate < g.startDate) g.targetDate = addDays(g.startDate, 1);
    if(g.startingSavings === undefined && g.currentSavings !== undefined) g.startingSavings = round2(g.currentSavings);
    if(!Array.isArray(g.progress)) g.progress = [];
    g.minTarget = round2(g.minTarget);
    g.maxTarget = Math.max(round2(g.maxTarget), g.minTarget);
    g.name = String(g.name || 'Goal');
  });

  /* Money on the entry collections. The computation layer coerces via num(),
     but the display totals and timelineEvents did not, so one string amount
     from a backup surfaced as "$NaN" and propagated into the running balance. */
  state.sideGig.entries.forEach(e=>{ e.amount = round2(e.amount); e.source = String(e.source||'Other').slice(0,60); e.notes = String(e.notes||'').slice(0,500); });
  state.otherIncome.entries.forEach(e=>{ e.amount = round2(e.amount); e.label = String(e.label||'Other income').slice(0,200); e.notes = String(e.notes||'').slice(0,500); });
  state.job.weeklyVariable.entries.forEach(e=>{ e.amount = round2(e.amount); });

  /* An entry pointing at a member who no longer exists is truthy but matches
     no column, so it vanished from the per-person view while still counting
     toward the household total — a total that couldn't be reconciled against
     the rows on screen, with no way to find the culprit. */
  const memberIds = new Set(state.members.map(m=>m.id));
  const fixOwner = r => { if(r.memberId && !memberIds.has(r.memberId)) r.memberId = null; };
  state.expenses.items.forEach(fixOwner);
  state.sideGig.entries.forEach(fixOwner);
  state.otherIncome.entries.forEach(fixOwner);
  state.job.weeklyVariable.entries.forEach(fixOwner);
  state.job.periods.forEach(p=>{ if(p.memberId && !memberIds.has(p.memberId)) p.memberId = state.members[0] ? state.members[0].id : null; });

  // Duplicate ids make edits touch one row while a delete removes several.
  const seen = new Set();
  const dedupe = list => list.filter(r=>{
    const k = String(r.id);
    if(seen.has(k)){ r.id = uid(); }
    seen.add(String(r.id));
    return true;
  });
  dedupe(state.expenses.items); dedupe(state.sideGig.entries);
  dedupe(state.otherIncome.entries); dedupe(state.job.periods);
  dedupe(state.job.weeklyVariable.entries); dedupe(state.goals);

  state.rev = num(state.rev) || 0;
  if(state.lastBalanceDate !== undefined && !isValidISO(state.lastBalanceDate)) state.lastBalanceDate = null;
  if(state.lastBalanceDate === undefined) state.lastBalanceDate = null;
  if(state.job.netFactor !== undefined){
    const f = num(state.job.netFactor);
    state.job.netFactor = (f > 0 && f <= 1) ? f : null;
  } else state.job.netFactor = null;

  pruneOrphanLogs();
  migrateToV4();
  state.schemaVersion = 4;
}

/* ---------------------------------------------------------
   SCHEMA 4 — split obligations from transactions, add accounts,
   cash/credit, and a dated cash baseline.

   Lossless and idempotent. Every v3 record maps to exactly one v4 record:

     onetime expense item        -> txn (an event that happened)
     monthly/biweekly/yearly item-> obligation (a commitment) + a txn for each
                                    payment already logged against it
     variable item               -> obligation flagged isBudget (an estimate,
                                    never an event, so it never becomes a txn)
     monthlyLog[itemId|date]     -> txn linked to that obligation
     sideGig / otherIncome entry -> income txn
     job period with actualNet   -> income txn (without one it stays a
                                    scheduled period, which is projection input)
     goals[0].currentSavings     -> the cash baseline, dated from
                                    lastBalanceDate if we have it
--------------------------------------------------------- */
function migrateToV4(){
  if(num(state.schemaVersion) >= 4 && Array.isArray(state.txns) && state.txns.length >= 0 && state.__v4done) return;

  if(!Array.isArray(state.accounts)) state.accounts = [];
  if(!Array.isArray(state.obligations)) state.obligations = [];
  if(!Array.isArray(state.txns)) state.txns = [];
  if(!Array.isArray(state.baselineHistory)) state.baselineHistory = [];
  if(!Array.isArray(state.discrepancies)) state.discrepancies = [];
  if(!isPlainObject(state.archives)) state.archives = {};
  if(!Array.isArray(state.incomeSources)) state.incomeSources = [];
  if(!isPlainObject(state.enrichment)) state.enrichment = {};

  // Everyone gets one cash account so there is always somewhere for money to be.
  if(state.accounts.length === 0){
    state.accounts.push({ id:'acct-cash', name:'Main account', kind:'cash', archived:false });
  }
  const defaultCash = state.accounts.find(a=>a.kind==='cash') || state.accounts[0];

  const alreadyMigrated = state.txns.some(t=>t.source==='v3');
  if(!alreadyMigrated){
    const items = Array.isArray(state.expenses && state.expenses.items) ? state.expenses.items : [];
    const log = (state.expenses && isPlainObject(state.expenses.monthlyLog)) ? state.expenses.monthlyLog : {};

    items.forEach(item=>{
      if(item.frequency === 'onetime'){
        // An event, not a commitment.
        state.txns.push({
          id: uid(), date: item.date, name: item.name, merchantKey: merchantKey(item.name),
          amount: round2(item.amount), kind:'expense', payment:'cash',
          accountId: defaultCash.id, category: item.category, memberId: item.memberId || null,
          obligationId: null, source:'v3'
        });
        return;
      }
      // A commitment. Keep its identity, drop the per-instance fields.
      const ob = {
        id: item.id, name: item.name, merchantKey: merchantKey(item.name),
        category: item.category, amount: round2(item.amount),
        frequency: item.frequency === 'variable' ? 'variable' : item.frequency,
        isBudget: item.frequency === 'variable',
        variableAmount: item.frequency === 'variable',
        dueDay: item.dueDay || null,
        anchorDate: item.anchorDate || null,
        annualMonth: null, annualDay: null,
        payment: 'cash', accountId: defaultCash.id,
        startDate: item.startDate || null, endDate: item.endDate || null,
        status: item.status === 'cancelled' ? 'cancelled' : (item.status === 'flagged' ? 'flagged' : 'active'),
        memberId: item.memberId || null
      };
      state.obligations.push(ob);
    });

    // Logged payments become the transactions that satisfied each obligation.
    Object.keys(log).forEach(key=>{
      const [obId, occ] = key.split('|');
      const ob = state.obligations.find(o=>o.id === obId);
      if(!ob || !isValidISO(occ)) return;
      state.txns.push({
        id: uid(), date: occ, name: ob.name, merchantKey: ob.merchantKey,
        amount: round2(log[key]), kind:'expense', payment: ob.payment || 'cash',
        accountId: ob.accountId || defaultCash.id, category: ob.category,
        memberId: ob.memberId || null, obligationId: ob.id, source:'v3'
      });
    });

    const pushIncome = (date, name, amount, type, memberId, jobPeriodId)=>{
      if(!isValidISO(date)) return;
      state.txns.push({
        id: uid(), date, name, merchantKey: merchantKey(name), amount: round2(amount),
        kind:'income', payment:'cash', accountId: defaultCash.id,
        category:'Income', memberId: memberId || null, obligationId:null,
        incomeType: type, jobPeriodId: jobPeriodId || null, source:'v3'
      });
    };
    (state.sideGig.entries||[]).forEach(e=> pushIncome(e.date, e.source || 'Side gig', e.amount, 'sidegig', e.memberId));
    (state.otherIncome.entries||[]).forEach(e=> pushIncome(e.date, e.label || 'Other income', e.amount, 'other', e.memberId));
    (state.job.weeklyVariable.entries||[]).forEach(e=> pushIncome(e.weekEnd, 'Weekly pay', e.amount, 'job', e.memberId));
    (state.job.periods||[]).forEach(p=>{
      // Only a confirmed stub is money that actually arrived. A period without
      // one stays a schedule entry and feeds projections, not Stored Cash.
      if(p.actualNet != null && p.actualNet !== '') pushIncome(p.payDate, 'Paycheque', p.actualNet, 'job', p.memberId, p.id);
    });
  }

  /* The old "current savings" was a manually typed number on the first goal,
     with no date — so nothing could be calculated forward from it. Promote it
     to a real dated baseline; without a date we can only assume it was true
     when it was last touched, and failing that, today. */
  if(!state.cashBaseline){
    const g = state.goals[0];
    const amount = g && g.currentSavings != null ? round2(g.currentSavings) : 0;
    const asOf = isValidISO(state.lastBalanceDate) ? state.lastBalanceDate : todayISO();
    state.cashBaseline = {
      id: uid(), asOf, amount,
      byAccount: { [defaultCash.id]: amount },
      recordedAt: new Date().toISOString(),
      inferred: true   // flagged so Settings can prompt the user to confirm it
    };
    state.baselineHistory.push({ ...state.cashBaseline, expected:null, discrepancy:0 });
  }

  state.txns = state.txns.filter(t=>t && t.id && isValidISO(t.date) && TXN_KINDS.includes(t.kind));
  state.txns.forEach(t=>{
    t.amount = Math.abs(round2(t.amount));                 // sign lives in `kind`
    if(!PAYMENT_MODES.includes(t.payment)) t.payment = 'cash';
    if(t.kind === 'income' || t.kind === 'cc_payment') t.payment = 'cash';
    t.name = String(t.name || 'Transaction').slice(0,200);
    if(!t.merchantKey) t.merchantKey = merchantKey(t.name);
    if(!state.accounts.some(a=>a.id === t.accountId)) t.accountId = defaultCash.id;
  });
  state.obligations = state.obligations.filter(o=>o && o.id).map(o=>{
    if(!FREQUENCIES.includes(o.frequency)) o.frequency = 'monthly';
    if(!PAYMENT_MODES.includes(o.payment)) o.payment = 'cash';
    if(!['active','paused','cancelled','flagged'].includes(o.status)) o.status = 'active';
    o.name = String(o.name || 'Recurring expense').slice(0,200);
    o.amount = round2(o.amount);
    if(!o.merchantKey) o.merchantKey = merchantKey(o.name);
    if(!ALL_CATS.includes(o.category)) o.category = 'Misc';
    if(!state.accounts.some(a=>a.id === o.accountId)) o.accountId = defaultCash.id;
    // A yearly obligation needs an explicit month+day to be due on.
    if(o.frequency === 'yearly' && (!o.annualMonth || !o.annualDay)){
      const seed = parseISO(o.anchorDate) || parseISO(o.startDate) || parseISO(todayISO());
      o.annualMonth = seed.getMonth()+1;
      o.annualDay = seed.getDate();
    }
    return o;
  });
  /* The manual "current savings" box is gone: savings is derived from Stored
     Cash now. Removed only here, after the baseline above has read it. */
  state.goals.forEach(g=>{
    if(g.startingSavings === undefined) g.startingSavings = round2(g.currentSavings);
    delete g.currentSavings;
    if(!Array.isArray(g.progress)) g.progress = [];
  });
  state.__v4done = true;
}

/* Normalised merchant identity. "SQ *JOE'S COFFEE #1423  MIAMI FL" and
   "Joes Coffee" have to land on the same key for recurring detection to work
   at all — the old system compared raw names as substrings, which matched
   "Netflix" to "Netflix Premium Refund" and missed everything else. */
/* Card processors put their own tag at the FRONT ("SQ *JOE'S COFFEE"), and
   banks append the store number and location at the BACK ("#1423 MIAMI FL").
   Both have to go, and in that order — stripping from the first `*` to the end
   deletes the merchant name itself. */
const MERCHANT_PREFIX = /^(?:sq|tst|sp|py|pp|paypal|pos|dd|ec|ppd|ext|ach|chkcard|pur|purchase|debit|credit)\s*\*+\s*/;
const MERCHANT_NOISE = /\b(?:pos|pp|paypal|purchase|payment|recurring|autopay|auto|debit|credit|card|visa|mastercard|amex|ach|pmt|dda|trn|ref|id|conf|xx+|\d{3,})\b/g;
const MERCHANT_SUFFIX = /\b(?:inc|llc|ltd|corp|corporation|company|the)\b/g;
const US_STATES = new Set(('al ak az ar ca co ct de fl ga hi id il in ia ks ky la me md ma mi mn ms mo '+
  'mt ne nv nh nj nm ny nc nd oh ok or pa ri sc sd tn tx ut vt va wa wv wi wy dc').split(' '));
function merchantKey(raw){
  const original = String(raw || '');
  let s = original.toLowerCase().trim();
  s = s.replace(/['’`]/g, '');                    // joe's -> joes, so it matches "Joes"
  s = s.replace(MERCHANT_PREFIX, ' ');            // processor tag, front
  s = s.replace(/\s*[#].*$/, ' ');                // store number + location, back
  s = s.replace(/\s*\*[a-z0-9]+/g, ' ');          // stray order references
  s = s.replace(/\.(?:com|net|org|io|co|us)\b/g, ' ');
  s = s.replace(/\b\d{1,2}[\/-]\d{1,2}(?:[\/-]\d{2,4})?\b/g, ' ');   // embedded dates
  s = s.replace(/[^a-z0-9\s]/g, ' ');
  s = s.replace(MERCHANT_NOISE, ' ');
  s = s.replace(MERCHANT_SUFFIX, ' ');
  let parts = s.split(/\s+/).filter(Boolean);
  // Trailing location: "verizon miami fl" -> "verizon". Only when a state code
  // ends it, and never if it would leave nothing behind.
  if(parts.length >= 2 && US_STATES.has(parts[parts.length-1])){
    parts.pop();
    if(parts.length >= 2) parts.pop();            // the city that preceded it
  }
  const key = parts.join(' ').trim();
  if(key) return key;
  // Never return empty: an unmatched key would make every blank name "equal".
  const fallback = original.toLowerCase().replace(/[^a-z0-9]/g,'');
  return fallback || original.toLowerCase().trim() || 'unknown';
}

/* =========================================================
   AUTH
========================================================= */
async function checkSession(){
  const { data } = await sb.auth.getSession();
  session = data.session;
  if(session) return await loadProfile();
  return { ok:true, error:null };
}
async function loadProfile(){
  const { data, error } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  if(error){
    console.error('loadProfile failed:', error);
    profile = null;
    return { ok:false, error: (error.message || error.details || error.hint || JSON.stringify(error)) };
  }
  profile = data;
  return { ok:true, error:null };
}
async function signUpFlow(email, password, inviteCode){
  const { data, error } = await sb.auth.signUp({ email, password });
  if(error) throw error;
  session = data.session;
  if(!session){
    return { needsConfirmation: true };
  }
  const { data: rpcData, error: rpcError } = await sb.rpc('redeem_invite_and_setup', { invite_code: inviteCode.trim() });
  if(rpcError) throw rpcError;
  if(!rpcData || !rpcData.success){
    await sb.auth.signOut();
    session = null;
    throw new Error('That invite code is invalid, expired, or already used.');
  }
  // The RPC committed household_id server-side, but occasionally the very next
  // read can lag behind — retry a few times before giving up.
  for(let attempt=0; attempt<4; attempt++){
    await loadProfile();
    if(profile && profile.household_id) break;
    await new Promise(r=>setTimeout(r, 500));
  }
  if(!profile || !profile.household_id){
    throw new Error("Account created but the household link isn't showing up yet. Wait a few seconds and try logging in — if it still fails, screenshot this.");
  }
  return { needsConfirmation: false };
}
async function logInFlow(email, password){
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error) throw error;
  session = data.session;
  await loadProfile();
}
async function logOutFlow(){
  await sb.auth.signOut();
  session = null; profile = null; state = null;
  // Drop this account's cached ledger so the next person to use this browser
  // can't read it, and reset every UI global so nothing bleeds across.
  try{
    Object.keys(localStorage).forEach(k=>{ if(k.indexOf(LOCAL_CACHE_KEY)===0) localStorage.removeItem(k); });
  }catch(e){ /* private mode / disabled storage */ }
  resetUiState();
  renderAuthGate();
}

function renderAuthGate(mode){
  mode = mode || 'login';
  const app = document.getElementById('app');
  app.innerHTML = '';
  const wrap = el(`
    <div class="auth-wrap">
      <div class="brand" style="justify-content:center;margin-bottom:22px;"><span class="stamp">T</span><h1>TALLY</h1></div>
      <div class="auth-card">
        <div class="auth-tabs" role="tablist">
          <button data-m="login" role="tab">Log In</button>
          <button data-m="signup" role="tab">Sign Up</button>
        </div>
        <div id="auth-msg" role="alert" aria-live="assertive"></div>
        <!-- A real <form>, so Enter submits — the single most-performed
             keyboard action on a login screen previously did nothing — and so
             password managers can recognise and fill the fields. -->
        <form id="auth-form" novalidate>
          <div class="field"><label for="auth-email">Email</label>
            <input type="email" id="auth-email" name="email" autocomplete="username" required></div>
          <div class="field"><label for="auth-password">Password</label>
            <input type="password" id="auth-password" name="password" autocomplete="current-password" required></div>
          <div class="field" id="auth-invite-field"></div>
          <button class="btn btn-gold" id="auth-submit" type="submit" style="width:100%;justify-content:center;margin-top:8px;">Log In</button>
        </form>
        <button class="btn btn-ghost btn-sm" id="auth-forgot" type="button"
                style="width:100%;justify-content:center;margin-top:10px;">Forgot your password?</button>
      </div>
    </div>
  `);
  app.appendChild(wrap);

  function setMode(m){
    mode = m;
    wrap.querySelectorAll('.auth-tabs button').forEach(b=> b.classList.toggle('active', b.dataset.m===m));
    wrap.querySelector('#auth-invite-field').innerHTML = m==='signup'
      ? '<label for="auth-invite">Invite code</label><input type="text" id="auth-invite" autocomplete="off" aria-describedby="auth-invite-hint"><div class="hint-sm" id="auth-invite-hint">The code you were sent when you were invited to this household.</div>' : '';
    wrap.querySelector('#auth-submit').textContent = m==='signup' ? 'Create Account' : 'Log In';
    wrap.querySelector('#auth-password').setAttribute('autocomplete', m==='signup' ? 'new-password' : 'current-password');
    wrap.querySelector('#auth-forgot').hidden = (m === 'signup');
    wrap.querySelector('#auth-msg').innerHTML = '';
  }
  wrap.querySelectorAll('.auth-tabs button').forEach(b=> b.addEventListener('click', ()=> setMode(b.dataset.m)));
  setMode(mode);

  wrap.querySelector('#auth-forgot').addEventListener('click', async ()=>{
    const email = wrap.querySelector('#auth-email').value.trim();
    const msgEl = wrap.querySelector('#auth-msg');
    if(!email){ msgEl.innerHTML = '<div class="auth-err">Enter your email above first.</div>'; return; }
    const { error } = await sb.auth.resetPasswordForEmail(email);
    msgEl.innerHTML = error
      ? `<div class="auth-err">${esc(error.message)}</div>`
      : '<div class="auth-ok">If that email has an account, a reset link is on its way.</div>';
  });
  wrap.querySelector('#auth-form').addEventListener('submit', async (ev)=>{
    ev.preventDefault();
    const email = wrap.querySelector('#auth-email').value.trim();
    const password = wrap.querySelector('#auth-password').value;
    const msgEl = wrap.querySelector('#auth-msg');
    msgEl.innerHTML = '';
    const btn = wrap.querySelector('#auth-submit');
    const restore = btn.textContent;
    btn.disabled = true;
    btn.textContent = mode==='signup' ? 'Creating account…' : 'Signing in…';
    try{
      if(mode==='signup'){
        const invite = wrap.querySelector('#auth-invite').value;
        const result = await signUpFlow(email, password, invite);
        if(result && result.needsConfirmation){
          msgEl.innerHTML = `<div class="auth-ok">Account created — check your email to confirm it, then log in.</div>`;
          btn.disabled = false; btn.textContent = restore;
          return;
        }
      } else {
        await logInFlow(email, password);
      }
      await loadState();
      activeTab = 'dashboard';
      render();
    }catch(err){
      msgEl.innerHTML = `<div class="auth-err">${esc((err && err.message) || 'Something went wrong.')}</div>`;
      btn.disabled = false; btn.textContent = restore;
    }
  });
}

      }

      alert('Could not read that backup file.');
      console.error(err);
    }
  });
