  const minTarget = round2(g.minTarget), maxTarget = round2(g.maxTarget);
  const validDates = isValidISO(g.targetDate) && isValidISO(g.startDate);
  const W = Math.max(weeksBetween(today, g.targetDate), 0);
  const M = Math.max(monthsBetween(today, g.targetDate), 0);
  const EE = totalMonthlyExpenses();
  const JR = jobMonthlyEstimate();

  // Living costs still to be covered before the deadline, on top of the gap
  // to the target balance.
  const upkeep = round2(EE * M);
  const jobWindow = round2(JR * M);
  const TN_min = round2(Math.max(minTarget - A, 0) + upkeep);
  const TN_max = round2(Math.max(maxTarget - A, 0) + upkeep);
  const outsideNeeded_min = Math.max(round2(TN_min - jobWindow), 0);
  const outsideNeeded_max = Math.max(round2(TN_max - jobWindow), 0);

  /* Divide by the real horizon so pace x weeks == need. When the deadline has
     passed there are no weeks to spread anything over, and the old fallback
     assigned the ENTIRE remaining balance to "weekly pace needed" — a past-due
     $4,900 goal displayed "Weekly pace needed: $4,900". A dead goal has no
     weekly pace; it has a shortfall, which is reported separately. */
  const weeks = goalRemainingWeeks(g);
  const nWeeks = goalWeekCount(g);
  const weeklyPace_min = nWeeks>0 ? round2(outsideNeeded_min/nWeeks) : 0;
  const weeklyPace_max = nWeeks>0 ? round2(outsideNeeded_max/nWeeks) : 0;
  const overdue = validDates && today > g.targetDate;

  // --- track record ---------------------------------------------------
  const elapsedEnd = (validDates && today > g.targetDate) ? g.targetDate : today;
  const weeksPassedExact = Math.max(weeksBetween(g.startDate, elapsedEnd), 0);
  const earnedSinceStart = validDates ? outsideIncomeInRange(g.startDate, elapsedEnd) : 0;
  const avgWeeklyPaceSoFar = weeksPassedExact>0.001 ? round2(earnedSinceStart/weeksPassedExact) : 0;

  // The pace locked in when the goal was set. Without it, "am I on track"
  // compares today's requirement against yesterday's effort and is unfalsifiable.
  const basePace = num(g.paceAtStart) > 0 ? num(g.paceAtStart) : weeklyPace_min;
  const expectedByNow = round2(basePace * weeksPassedExact);
  const surplus = round2(earnedSinceStart - expectedByNow);

  // A goal younger than a week has no track record to judge, so it starts
  // neutral rather than being stamped "Behind" the moment it's created.
  let status;
  if(!validDates) status = 'unknown';
  else if(overdue) status = (A >= minTarget) ? 'ontrack' : 'behind';
  else if(outsideNeeded_min <= 0) status = 'ontrack';
  else if(weeksPassedExact < 1) status = 'new';
  else if(surplus >= -0.005) status = 'ontrack';
  else if(earnedSinceStart >= expectedByNow * 0.85) status = 'close';
  else status = 'behind';
  const onTrack = status==='ontrack' || status==='new';

  // Progress toward the balance target, and toward the effort the plan asked for.
  const progress = maxTarget>0 ? Math.min(Math.max(A/maxTarget,0),1) : (A>0?1:0);
  const paceProgress = expectedByNow>0 ? Math.min(earnedSinceStart/expectedByNow, 2) : 1;

  // Where this lands if the recent pace simply continues.
  const projectedOutside = round2(avgWeeklyPaceSoFar * nWeeks);
  const projectedBalance = round2(A + jobWindow + projectedOutside - upkeep);
  const shortfall = round2(minTarget - projectedBalance);

  return {
    A, minTarget, maxTarget, valid: validDates,
    weeksRemaining:W, monthsRemaining:M, planWeeks:nWeeks, weeks, overdue,
    upkeep, neededMin:TN_min, neededMax:TN_max, jobWindow,
    outsideNeededMin:outsideNeeded_min, outsideNeededMax:outsideNeeded_max,
    paceMin:weeklyPace_min, paceMax:weeklyPace_max,
    basePace, expectedByNow, surplus,
    earnedSinceStart, avgWeeklyPaceSoFar, weeksPassedExact,
    projectedOutside, projectedBalance, shortfall,
    status, onTrack, progress, paceProgress
  };
}
/* Week-by-week retrospective: for each fully-completed week since the goal
   started, how much "outside" income actually came in, graded against the pace
   the goal was set with. Week 1 is clamped to the goal's start date so income
   earned before the goal existed isn't credited to it. */
function goalWeeklyRetrospective(g){
  const today = todayISO();
  if(!isValidISO(g.startDate) || !isValidISO(g.targetDate)) return { totalWeeks:0, weeksPassed:0, weeks:[] };
  const alignedStart = startOfWeek(g.startDate);
  const totalWeeks = Math.max(Math.ceil(weeksBetween(alignedStart, g.targetDate)), 1);
  const weeksPassed = Math.min(Math.max(Math.floor(daysBetween(alignedStart, today)/7), 0), totalWeeks);
  const target = goalStats(g).basePace;
  const weeks = [];
  for(let i=0; i<weeksPassed; i++){
    const weekStart = addDays(alignedStart, i*7);
    const weekEnd = addDays(weekStart, 6);
    const from = weekStart < g.startDate ? g.startDate : weekStart;   // don't credit pre-goal income
    const actual = outsideIncomeInRange(from, weekEnd);
    weeks.push({ n:i+1, weekStart, weekEnd, actual, target, diff: round2(actual-target) });
  }
  return { totalWeeks, weeksPassed, weeks };
}
/* The forward plan: every Sunday–Saturday week still remaining, each carrying
   an equal share of what's still needed. The rows sum to the requirement
   exactly — the last week absorbs the rounding remainder rather than letting
   `pace x weeks` drift a few dollars past the goal. */
function goalForwardWeeklyPlan(g){
  const s = goalStats(g);
  const weeks = s.weeks.map(w=>({ ...w, amount: s.paceMin }));
  // Only reconcile the rounding remainder into the last row when the rows
  // actually cover the whole horizon; otherwise the last drawn week would
  // absorb decades of remainder.
  const complete = weeks.length === s.planWeeks;
  if(weeks.length && complete){
    const drift = round2(s.outsideNeededMin - s.paceMin*weeks.length);
    weeks[weeks.length-1].amount = round2(weeks[weeks.length-1].amount + drift);
  }
  return { count: s.planWeeks, drawn: weeks.length, complete,
           pace: s.paceMin, total: s.outsideNeededMin, weeks };
}

/* =========================================================
   SERIES — the inputs the charts read. Each is derived from the same
   functions the tables use, so a chart can never tell a different story
   from the number printed beside it.
========================================================= */
function recentCloses(n){
  const all = monthsWithData();
  const cur = monthKey(todayISO());
  if(!all.includes(cur)) all.push(cur);
  return all.sort().slice(-n).map(monthClose);
}
/* This month's spend per category, against the average of the completed
   months before it — so "unusual" is visible, not just "large". */
function categorySpendRows(){
  const {from, to} = currentMonthRange();
  const prior = completedMonthKeys(3).map(monthRange);
  const rows = ALL_CATS.map(cat=>{
    const items = state.expenses.items.filter(i=>i.category===cat && i.status!=='cancelled');
    const spend = mk => sumMoney(items.flatMap(item=>{
      if(item.frequency==='variable') return [num(item.amount)];
      return itemOccurrences(item, mk.from, mk.to).map(occ=>{
        const logged = state.expenses.monthlyLog[logKey(item.id, occ)];
        return logged !== undefined ? num(logged) : num(item.amount);
      });
    }));
    const amount = spend({from, to});
    const avg = prior.length ? round2(prior.reduce((s,mk)=>s+spend(mk),0)/prior.length) : 0;
    return { category:cat, amount, avg, color: cat===ONETIME_CAT ? CHART_COLORS.other
             : RECURRING_CATS.includes(cat) ? CHART_COLORS.exp : CHART_COLORS.side };
  }).filter(r=>r.amount>0 || r.avg>0);
  return rows.sort((a,b)=>b.amount-a.amount);
}
/* Running balance forward from today. Starts at the balance as it stands NOW,
   so it only ever applies transactions that haven't happened yet — the old
   version replayed the previous seven days on top of a today-dated balance
   and drifted by that week's whole swing. */
function runwayPoints(days){
  const today = todayISO();
  const to = addDays(today, days || 60);
  const events = timelineEvents(today, to).filter(ev=>ev.date >= today);
  const start = currentBalance();
  const pts = [{ date: today, balance: start }];
  let bal = start;
  events.forEach(ev=>{
    bal = round2(bal + ev.amount);
    pts.push({ date: ev.date, balance: bal, label: ev.label });
  });
  if(pts[pts.length-1].date !== to) pts.push({ date: to, balance: bal });
  return pts;
}
/* The one place the app decides what "money on hand" means. */
function currentBalance(){
  const g = state.goals[0];
  return g && g.currentSavings != null ? round2(g.currentSavings) : 0;
}

/* =========================================================
   CHARTS

   Hand-rolled SVG. The app loads no charting library — a strict no-build,
   single-file app shouldn't pull a 200KB dependency over the network to draw
   twelve rectangles, and every series these need is already computed by the
   functions above. All of them degrade to an honest empty state rather than
   an empty axis, and all of them carry a text alternative.
========================================================= */
const CHART_COLORS = { job:'#4CAF7D', side:'#5B9BD9', other:'#A78BFA', exp:'#E2574C', net:'#C9A227' };

function svgEl(w, h, label){
  return el(`<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${esc(label)}"></svg>`);
}
function add(parent, tag, attrs, text){
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for(const k in attrs) n.setAttribute(k, attrs[k]);
  if(text != null) n.textContent = text;
  parent.appendChild(n);
  return n;
}
/* "Nice" axis maximum, so the top gridline is a number a human would pick. */
function niceMax(v){
  if(v <= 0) return 100;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v/mag;
  return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10) * mag;
}
function chartCard(title, subtitle, node, legend, emptyMsg){
  const wrap = el(`<div class="chart-wrap"></div>`);
  wrap.appendChild(el(`<div class="eyebrow" style="margin-bottom:2px;">${esc(title)}</div>`));
  if(subtitle) wrap.appendChild(el(`<div class="hint-sm" style="margin:0 0 12px;">${esc(subtitle)}</div>`));
  if(!node){ wrap.appendChild(el(`<div class="chart-empty">${esc(emptyMsg||'Not enough data yet.')}</div>`)); return wrap; }
  wrap.appendChild(node);
  if(legend && legend.length){
    const lg = el(`<div class="chart-legend"></div>`);
    legend.forEach(([color,label])=> lg.appendChild(
      el(`<span><span class="swatch" style="background:${esc(color)}"></span>${esc(label)}</span>`)));
    wrap.appendChild(lg);
  }
  return wrap;
}

/* Income vs expenses per month, with net as a line. Answers "am I improving?",
   which twelve rows of numbers never could. */
function chartMonthlyFlow(closes){
  if(!closes.length) return null;
  const W=760, H=230, padL=56, padR=12, padT=12, padB=30;
  const iw = W-padL-padR, ih = H-padT-padB;
  // The scale has to hold the net line too, and net is frequently negative —
  // clamping it to zero would draw a flat line across every month the user
  // overspent, which is exactly the month they need to see.
  const hi = niceMax(Math.max(1, ...closes.map(c=>Math.max(c.income, c.exp, c.net))));
  const lowest = Math.min(0, ...closes.map(c=>c.net));
  const lo = lowest < 0 ? -niceMax(-lowest) : 0;
  const span = hi - lo;
  const y = v => padT + ih - ((v-lo)/span)*ih;
  const zeroY = y(0);
  const bw = iw/closes.length;
  const svg = svgEl(W,H, 'Income, costs and net for the last ' + closes.length + ' months');

  [hi, hi/2, 0, lo/2, lo].filter((v,i,a)=>v!==undefined && a.indexOf(v)===i).forEach(v=>{
    add(svg,'line',{class: v===0 ? 'zero' : 'grid', x1:padL, x2:W-padR, y1:y(v), y2:y(v)});
    add(svg,'text',{x:padL-7, y:y(v)+3, 'text-anchor':'end'}, fmt0(v));
  });
  closes.forEach((c,i)=>{
    const cx = padL + i*bw;
    const gap = Math.min(6, bw*0.12), barW = Math.max((bw - gap*3)/2, 1);
    add(svg,'rect',{x:cx+gap, y:y(c.income), width:barW, height:Math.max(zeroY-y(c.income),0),
                    fill:CHART_COLORS.job, rx:2, opacity: c.estimated ? 0.5 : 1});
    add(svg,'rect',{x:cx+gap*2+barW, y:y(c.exp), width:barW, height:Math.max(zeroY-y(c.exp),0),
                    fill:CHART_COLORS.exp, rx:2, opacity: c.estimated ? 0.5 : 1});
    add(svg,'text',{x:cx+bw/2, y:H-10, 'text-anchor':'middle'}, monthLabelShort(c.mk));
    add(svg,'title',{}, monthLabel(c.mk)+' — in '+fmt(c.income)+', out '+fmt(c.exp)+', net '+fmt(c.net)+(c.estimated?' (contains estimates)':''));
  });
  add(svg,'polyline',{points: closes.map((c,i)=>(padL+i*bw+bw/2)+','+y(c.net)).join(' '),
                      fill:'none', stroke:CHART_COLORS.net, 'stroke-width':2, 'stroke-linejoin':'round'});
  closes.forEach((c,i)=> add(svg,'circle',{cx:padL+i*bw+bw/2, cy:y(c.net), r:2.5, fill:CHART_COLORS.net}));
  add(svg,'line',{class:'axis', x1:padL, x2:W-padR, y1:padT+ih, y2:padT+ih});
  return svg;
}

/* Ranked spending by category, with the recent average behind each bar as a
   ghost so "is this month unusual?" is answerable at a glance. */
function chartCategorySpend(rows){
  if(!rows.length) return null;
  const rowH=26, W=760, padL=132, padR=64;
  const H = rows.length*rowH + 8;
  const peak = niceMax(Math.max(1, ...rows.map(r=>Math.max(r.amount, r.avg))));
  const iw = W-padL-padR;
  const svg = svgEl(W,H, 'Spending by category this month');
  rows.forEach((r,i)=>{
    const cy = i*rowH + 4;
    add(svg,'text',{x:padL-10, y:cy+13, 'text-anchor':'end', fill:'#E7E9ED'}, r.category);
    if(r.avg>0) add(svg,'rect',{x:padL, y:cy+2, width:Math.max((r.avg/peak)*iw,1), height:14, fill:'#39424E', rx:3});
    add(svg,'rect',{x:padL, y:cy+4, width:Math.max((r.amount/peak)*iw,1), height:10, fill:r.color, rx:3});
    add(svg,'text',{x:W-padR+8, y:cy+13}, fmt0(r.amount));
    add(svg,'title',{}, r.category+' — '+fmt(r.amount)+' this month'+(r.avg>0?', '+fmt(r.avg)+' typical':''));
  });
  return svg;
}

/* The running balance across the forecast window. The app already knew the
   balance dipped below zero; it only said so in a sentence, and refused to say
   when or how far. This draws the dip and dates it. */
function chartRunway(points){
  if(points.length<2) return null;
  const W=760, H=200, padL=52, padR=12, padT=14, padB=28;
  const iw=W-padL-padR, ih=H-padT-padB;
  const lo = Math.min(0, ...points.map(p=>p.balance));
  const hi = Math.max(1, ...points.map(p=>p.balance));
  const span = (hi-lo) || 1;
  const x = i => padL + (i/(points.length-1))*iw;
  const y = v => padT + ih - ((v-lo)/span)*ih;
  const svg = svgEl(W,H, 'Projected running balance over the next 60 days');
  const zeroY = y(0);
  add(svg,'line',{class:'zero', x1:padL, x2:W-padR, y1:zeroY, y2:zeroY});
  add(svg,'text',{x:padL-7, y:zeroY+3, 'text-anchor':'end'}, '$0');
  add(svg,'text',{x:padL-7, y:y(hi)+3, 'text-anchor':'end'}, fmt0(hi));

  // Stepped path: a balance holds flat until a transaction moves it.
  let d = 'M' + x(0) + ' ' + y(points[0].balance);
  points.forEach((p,i)=>{ if(i) d += ' L' + x(i) + ' ' + y(points[i-1].balance) + ' L' + x(i) + ' ' + y(p.balance); });
  add(svg,'path',{d: d + ' L' + x(points.length-1) + ' ' + zeroY + ' L' + x(0) + ' ' + zeroY + ' Z',
                  fill: 'url(#runwayFill)', opacity:.22, stroke:'none'});
  const defs = add(svg,'defs',{});
  const grad = add(defs,'linearGradient',{id:'runwayFill', x1:'0', y1:'0', x2:'0', y2:'1'});
  add(grad,'stop',{offset:'0%','stop-color':'#4CAF7D'});
  add(grad,'stop',{offset:'100%','stop-color':'#4CAF7D','stop-opacity':'0.15'});
  add(svg,'path',{d, fill:'none', stroke:CHART_COLORS.job, 'stroke-width':2, 'stroke-linejoin':'round'});

  const dip = points.find(p=>p.balance < 0);
  if(dip){
    const di = points.indexOf(dip);
    add(svg,'line',{x1:x(di), x2:x(di), y1:padT, y2:padT+ih, stroke:'#E2574C', 'stroke-width':1.5, 'stroke-dasharray':'4 3'});
    add(svg,'circle',{cx:x(di), cy:y(dip.balance), r:4, fill:'#E2574C'});
    add(svg,'text',{x:Math.min(x(di)+6, W-150), y:padT+11, fill:'#E2574C'}, 'below zero ' + dispDateShort(dip.date));
  }
  [0, Math.floor(points.length/2), points.length-1].forEach(i=>
    add(svg,'text',{x:x(i), y:H-9, 'text-anchor': i===0?'start':(i===points.length-1?'end':'middle')},
        dispDateShort(points[i].date)));
  return svg;
}

/* Goal progress: what has actually been banked, then a cone from the slow case
   to the fast case. The cone is the point — a single projected line would
   claim a precision this data does not have. */
function chartGoalCone(g, s){
  if(!s.valid || s.planWeeks<1) return null;
  const W=760, H=210, padL=56, padR=14, padT=14, padB=28;
  const iw=W-padL-padR, ih=H-padT-padB;
  const retro = goalWeeklyRetrospective(g);
  const past = []; let cum = s.A;
  past.push({t:0, v:cum});
  retro.weeks.forEach((w,i)=>{ cum = round2(cum + w.actual); past.push({t:i+1, v:cum}); });
  const totalT = past.length-1 + s.planWeeks;
  const fastEnd = round2(cum + s.paceMax*s.planWeeks + s.jobWindow - s.upkeep);
  const slowEnd = round2(cum + s.avgWeeklyPaceSoFar*s.planWeeks + s.jobWindow - s.upkeep);
  const hi = niceMax(Math.max(s.maxTarget, fastEnd, cum, 1));
  const x = t => padL + (totalT? t/totalT : 0)*iw;
  const y = v => padT + ih - (Math.max(v,0)/hi)*ih;
  const svg = svgEl(W,H, 'Goal progress and projected range to ' + dispDate(g.targetDate));

  [[s.minTarget,'min '+fmt0(s.minTarget)], [s.maxTarget,'max '+fmt0(s.maxTarget)]].forEach(([v,lab])=>{
    if(v<=0) return;
    add(svg,'line',{class:'grid', x1:padL, x2:W-padR, y1:y(v), y2:y(v), stroke:'#C9A227', 'stroke-dasharray':'4 4', opacity:.55});
    add(svg,'text',{x:W-padR, y:y(v)-5, 'text-anchor':'end', fill:'#C9A227'}, lab);
  });
  const t0 = past.length-1;
  add(svg,'path',{
    d:`M${x(t0)} ${y(cum)} L${x(totalT)} ${y(fastEnd)} L${x(totalT)} ${y(slowEnd)} Z`,
    fill:'#5B9BD9', opacity:.20});
  add(svg,'path',{d:`M${x(t0)} ${y(cum)} L${x(totalT)} ${y(fastEnd)}`, stroke:'#5B9BD9', 'stroke-width':1.5, 'stroke-dasharray':'5 4', fill:'none'});
  add(svg,'path',{d:`M${x(t0)} ${y(cum)} L${x(totalT)} ${y(slowEnd)}`, stroke:'#5B9BD9', 'stroke-width':1.5, 'stroke-dasharray':'5 4', fill:'none'});
  add(svg,'polyline',{points: past.map(p=>x(p.t)+','+y(p.v)).join(' '), fill:'none', stroke:CHART_COLORS.job, 'stroke-width':2.5, 'stroke-linejoin':'round'});
  add(svg,'circle',{cx:x(t0), cy:y(cum), r:4, fill:CHART_COLORS.job});
  add(svg,'line',{class:'axis', x1:padL, x2:W-padR, y1:padT+ih, y2:padT+ih});
  add(svg,'text',{x:padL, y:H-9}, dispDateShort(g.startDate));
  add(svg,'text',{x:W-padR, y:H-9, 'text-anchor':'end'}, dispDateShort(g.targetDate));
  add(svg,'text',{x:padL-7, y:y(0)+3, 'text-anchor':'end'}, '$0');
  return svg;
}

/* Weekly effort against the bar the goal was set with. */
function chartWeeklyPace(weeks){
  if(!weeks.length) return null;
  const W=760, H=170, padL=52, padR=12, padT=12, padB=26;
  const iw=W-padL-padR, ih=H-padT-padB;
  const target = weeks[0].target;
  const peak = niceMax(Math.max(1, target, ...weeks.map(w=>w.actual)));
  const y = v => padT + ih - (v/peak)*ih;
  const bw = iw/weeks.length;
  const svg = svgEl(W,H, 'Weekly outside income versus target for ' + weeks.length + ' weeks');
  weeks.forEach((w,i)=>{
    const gap = Math.min(5, bw*0.18);
    add(svg,'rect',{x:padL+i*bw+gap/2, y:y(w.actual), width:Math.max(bw-gap,1),
                    height:Math.max(padT+ih-y(w.actual),0), rx:2,
                    fill: w.diff>=0 ? CHART_COLORS.job : CHART_COLORS.exp});
    add(svg,'title',{}, 'Week '+w.n+' ('+dispDateShort(w.weekStart)+') — '+fmt(w.actual)+' vs '+fmt(w.target));
  });
  if(target>0){
    add(svg,'line',{x1:padL, x2:W-padR, y1:y(target), y2:y(target), stroke:'#C9A227', 'stroke-width':1.5, 'stroke-dasharray':'5 4'});
    add(svg,'text',{x:W-padR, y:y(target)-5, 'text-anchor':'end', fill:'#C9A227'}, 'target ' + fmt0(target));
  }
  add(svg,'text',{x:padL-7, y:y(peak)+3, 'text-anchor':'end'}, fmt0(peak));
  add(svg,'line',{class:'axis', x1:padL, x2:W-padR, y1:padT+ih, y2:padT+ih});
  return svg;
}

/* render() clears #app before it builds anything, so a throw halfway through
   used to leave a header and an empty page — and because the handler had
   already called scheduleSave(), the state that caused it was persisted and
   the break survived a reload. Now a failure is caught, shown, and always
   leaves the user a way out. */
function render(){
  const app = document.getElementById('app');
  const scrollY = window.scrollY;
  clearMemo();
  closeCtxMenu();
  try{
    renderInner(app);
    // Restoring scroll makes edits in a long list survive the rebuild.
    window.scrollTo(0, scrollY);
  }catch(err){
    console.error('render failed', err);
    renderFatalError('Something went wrong drawing this screen',
      esc((err && err.message) || String(err)) +
      ' — your data is safe. Try another tab, or export a backup.');
  }
}
function renderInner(app){
  app.innerHTML = '';
  if(state && state.settings && !state.settings.onboarded){
    renderOnboarding();
    return;
  }
  app.appendChild(renderHeader());
  app.appendChild(renderTabs());

/* Validates a parsed backup WITHOUT touching the live ledger.
   The old path did `state = parsed` and then ran the migration — so a file of
   {"job":1,"expenses":1} passed the guard, the migration threw partway through
   writing to a Number primitive, the catch said "could not read that backup
   file", and the app was already sitting on the garbage object with the old
   data still on screen. The next click pushed it to the cloud.
   Now the candidate is migrated in isolation and only swapped in on success. */
function parseBackup(text){
  let parsed;
  try{ parsed = JSON.parse(text); }
  catch(e){ return { ok:false, error:'That file isn\'t valid JSON.' }; }
  if(!isPlainObject(parsed) || !isPlainObject(parsed.job) || !isPlainObject(parsed.expenses)){
    return { ok:false, error:"That file doesn't look like a Tally backup." };
  }
  if(num(parsed.schemaVersion) > 3){
    return { ok:false, error:'That backup was made by a newer version of Tally. Update this page first — importing it here would drop the newer fields.' };
  }
  const live = state;
  try{
    state = parsed;
    migrateState();
    const candidate = state;
    return { ok:true, state:candidate };
  }catch(e){
    return { ok:false, error:'That backup is damaged and could not be repaired: ' + ((e && e.message) || e) };
  }finally{
    state = live;   // the live ledger is never left holding a rejected import
  }
}
function exportBackup(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `tally-backup-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function renderTabs(){
  const nav = el(`<nav class="tabs" role="tablist" aria-label="Sections"></nav>`);
  const tabList = [['dashboard','Dashboard'],['income','Income'],['expenses','Expenses'],['goals','Goals'],['timeline','Timeline'],['settings','Settings']];
  if(profile && profile.is_admin) tabList.push(['admin','Admin']);
  tabList.forEach(([key,label])=>{
    const isActive = key===activeTab;
    const b = el(`<button id="tab-${key}" role="tab" aria-controls="tab-body"
                    aria-selected="${isActive}" tabindex="${isActive?0:-1}">${label}</button>`);
    if(isActive) b.classList.add('active');
    b.addEventListener('click', ()=>{ switchTab(key); });
    // Arrow-key navigation is the expected behaviour for a tablist.
    b.addEventListener('keydown', e=>{
      const i = tabList.findIndex(t=>t[0]===key);
      if(e.key==='ArrowRight' || e.key==='ArrowLeft'){
        e.preventDefault();
        const d = e.key==='ArrowRight' ? 1 : -1;
        switchTab(tabList[(i + d + tabList.length) % tabList.length][0]);
      } else if(e.key==='Home'){ e.preventDefault(); switchTab(tabList[0][0]); }
      else if(e.key==='End'){ e.preventDefault(); switchTab(tabList[tabList.length-1][0]); }
    });
    nav.appendChild(b);
  });
  return nav;
}
function switchTab(key){
  activeTab = key;

  announce(key.charAt(0).toUpperCase() + key.slice(1) + ' tab');

/* =========================================================
   MODAL SYSTEM (generic add/edit forms)
========================================================= */
const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
/* A modal that a keyboard and a screen reader can both actually use: it
   announces itself, takes focus, keeps Tab inside itself, closes on Escape,
   and hands focus back to whatever opened it. None of that was true before —
   focus stayed on the page behind the overlay and there was no way out
   without finding the Cancel button with the mouse. */
function openModal({title, desc, bodyBuilder, onMount, wide}){
  const opener = document.activeElement;
  const overlay = el(`<div class="modal-overlay"></div>`);
  const titleId = 'modal-title-' + uid();
  const modal = el(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="${titleId}" tabindex="-1"></div>`);
  if(wide) modal.style.maxWidth = '760px';
  modal.appendChild(el(`<h3 id="${titleId}">${esc(title)}</h3>`));
  if(desc) modal.appendChild(el(`<div class="desc">${esc(desc)}</div>`));

  let closed = false;
  function close(){
    if(closed) return;
    closed = true;
    document.removeEventListener('keydown', onKey, true);
    overlay.remove();
    const app = document.getElementById('app');
    if(app) app.removeAttribute('aria-hidden');
    if(opener && document.contains(opener)) opener.focus();
  }
  function onKey(e){
    if(e.key === 'Escape'){ e.stopPropagation(); close(); return; }
    if(e.key !== 'Tab') return;
    const items = Array.from(modal.querySelectorAll(FOCUSABLE)).filter(n=>n.offsetParent !== null || n === modal);
    if(!items.length) return;
    const first = items[0], last = items[items.length-1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }

  const body = document.createElement('div');
  bodyBuilder(body, close);
  modal.appendChild(body);
  overlay.appendChild(modal);
  // Only treat this as "dismiss" if it was a real tap/click, not a scroll or
  // drag gesture that happened to start or end over the background.
  let downX=null, downY=null;
  overlay.addEventListener('pointerdown', e=>{ downX=e.clientX; downY=e.clientY; });
  overlay.addEventListener('click', e=>{
    if(e.target!==overlay) return;
    const moved = downX==null || Math.abs(e.clientX-downX)>10 || Math.abs(e.clientY-downY)>10;
    if(!moved) close();
  });
  document.body.appendChild(overlay);
  const app = document.getElementById('app');
  if(app) app.setAttribute('aria-hidden','true');
  document.addEventListener('keydown', onKey, true);
  const firstField = modal.querySelector(FOCUSABLE);
  (firstField || modal).focus();
  if(onMount) onMount(modal, close);
  return { overlay, close };
}

/* ---- toasts + undo -------------------------------------------------------
   Deleting a row used to be instant and irreversible on five different
   tables, and the only proof that anything ever saved was a 7px dot. */
function toastHost(){
  let host = document.getElementById('toast-host');
  if(!host){
    host = el(`<div id="toast-host" aria-live="polite" aria-atomic="false"></div>`);
    document.body.appendChild(host);
  }
  return host;
}
function toast(message, opts){
  opts = opts || {};
  const box = el(`<div class="toast ${opts.kind||''}" role="status"><span class="t-msg">${esc(message)}</span></div>`);
  if(opts.actionLabel && opts.onAction){
    const b = el(`<button type="button">${esc(opts.actionLabel)}</button>`);
    b.addEventListener('click', ()=>{ box.remove(); opts.onAction(); });
    box.appendChild(b);
  }
  toastHost().appendChild(box);
  const ms = opts.ms || (opts.actionLabel ? 9000 : 3200);
  setTimeout(()=>{ box.remove(); }, ms);
  return box;
}
/* Removes rows from a collection but keeps them (and their original positions)
   so a single click can put them back exactly where they were. */
function deleteWithUndo(label, removeFn, restoreFn){
  removeFn();
  scheduleSave(); render();
  toast(label, { kind:'ok', actionLabel:'Undo', onAction:()=>{
    restoreFn(); scheduleSave(); render(); toast('Restored', {kind:'ok'});
  }});
}
/* A real confirmation for the handful of actions that genuinely cannot be
   undone. Native confirm() is unstyleable, can't name what it's about to
   destroy, and — after a browser offers to "prevent additional dialogs" —
   silently returns false, which on a delete path means the click just does
   nothing. Typing the word is the standard guard for this class of action.
   (The app's own code used to apologise for this: "type-to-confirm isn't
   available here".) */
function confirmDestructive({title, desc, confirmWord, onConfirm}){
  openModal({
    title, desc,
    bodyBuilder(body, close){
      body.appendChild(elAll(`
        <div class="field">
          <label for="cd-input">Type <strong style="color:var(--red);">${esc(confirmWord)}</strong> to confirm</label>
          <input type="text" id="cd-input" autocomplete="off" autocapitalize="characters" spellcheck="false">
        </div>
        <div class="modal-actions">
          <button class="btn" id="cd-export">Export a backup first</button>
          <button class="btn" id="cd-cancel">Cancel</button>
          <button class="btn btn-danger" id="cd-go" disabled>Delete</button>
        </div>`));
      const input = body.querySelector('#cd-input');
      const go = body.querySelector('#cd-go');
      input.addEventListener('input', ()=>{ go.disabled = input.value.trim().toUpperCase() !== confirmWord.toUpperCase(); });
      input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !go.disabled) go.click(); });
      body.querySelector('#cd-export').addEventListener('click', exportBackup);
      body.querySelector('#cd-cancel').addEventListener('click', close);
      go.addEventListener('click', ()=>{ close(); onConfirm(); });
    }
  });
}
/* One coercion rule for every editable row in the app. There were six
   hand-written copies with subtly different rules, and the differences were
   the actual bug: one stored null for a cleared date (crashing the tab, then
   losing the row on next load), another stored '' (which never throws, so the
   row stayed visible while silently dropping out of every total).
   Returns false if the edit was rejected, so the caller doesn't save. */
const DATE_FIELDS = new Set(['date','payDate','start','end','weekEnd','anchorDate','startDate','endDate','targetDate']);
const MONEY_FIELDS = new Set(['amount','actualNet','currentSavings','minTarget','maxTarget']);
function setEntryField(rec, field, raw, inputEl){
  if(DATE_FIELDS.has(field)){
    const optional = (field==='endDate' || field==='startDate');
    if(raw === '' && optional){ rec[field] = null; return true; }
    if(!isValidISO(raw)){
      if(inputEl) inputEl.value = rec[field] || '';
      toast('That date isn\'t valid, so it was left as it was', {kind:'err'});
      return false;
    }
    rec[field] = raw;
    return true;
  }
  if(MONEY_FIELDS.has(field)){ rec[field] = raw === '' ? null : round2(raw); return true; }
  if(field === 'hours' || field === 'dueDay'){ rec[field] = raw === '' ? null : num(raw); return true; }
  if(field === 'memberId'){ rec[field] = raw || null; return true; }
  rec[field] = String(raw).slice(0, 500);
  return true;
}
function announce(msg){
  let live = document.getElementById('live-region');
  if(!live){
    live = el(`<div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>`);
    document.body.appendChild(live);
  }
  live.textContent = '';
  setTimeout(()=>{ live.textContent = msg; }, 60);
}

            : ((startEl && startEl.value) ? startEl.value : monthKey(todayISO())+'-01'),
          endDate: (endDateEl && endDateEl.value) ? endDateEl.value : null,
          memberId: memberId,
          status: "active"
        };
        state.expenses.items.push(item);
        scheduleSave(); close(); render();
      });
    }
  });
}

/* =========================================================
   RECEIPT / SCREENSHOT SCANNING (Anthropic API)
========================================================= */
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result.split(',')[1]);
    r.onerror = ()=> reject(new Error('Read failed'));
    r.readAsDataURL(file);
  });
}
/* Offers a balance read off a statement, rather than applying it silently.
   Current savings drives the goal math, the progress bar and the Timeline's
   starting balance, so it is not something a scanned document gets to set on
   its own — and it applies to ONE chosen goal, not to every goal at once. */
function offerDetectedBalance(row){
  const bal = round2(row.balance_after);
  const scanDate = isValidISO(row.date) ? row.date : todayISO();
  // Reject a future-dated balance outright: it used to poison the staleness
  // guard permanently, silently rejecting every legitimate scan afterwards.
  if(scanDate > todayISO()) return;
  const last = state.lastBalanceDate;
  const stale = last && scanDate < last;
  openModal({
    title: 'Update your current savings?',
    desc: `This statement shows a balance of ${fmt(bal)} on ${dispDate(scanDate)}.`,
    bodyBuilder(body, close){
      const opts = state.goals.map(g=>`<option value="${esc(g.id)}">${esc(g.name)} — currently ${fmt(g.currentSavings)}</option>`).join('');
      body.appendChild(elAll(`
        ${stale ? `<div class="auth-err" style="margin-bottom:12px;">Heads up: this is older than your last balance update (${esc(dispDate(last))}).</div>` : ''}
        <div class="field"><label for="bal-goal">Apply it to</label><select id="bal-goal">${opts}</select></div>
        <div class="field"><label for="bal-amt">Balance</label><input type="number" step="0.01" id="bal-amt" value="${bal}"></div>
        <div class="modal-actions">
          <button class="btn" id="bal-skip">Leave it alone</button>
          <button class="btn btn-gold" id="bal-apply">Update savings</button>
        </div>`));
      body.querySelector('#bal-skip').addEventListener('click', close);
      body.querySelector('#bal-apply').addEventListener('click', ()=>{
        const g = state.goals.find(x=>x.id === body.querySelector('#bal-goal').value);
        if(g){
          const prev = g.currentSavings;
          g.currentSavings = round2(body.querySelector('#bal-amt').value);
          state.lastBalanceDate = scanDate;
          scheduleSave(); close(); render();
          toast('Savings updated', {kind:'ok', actionLabel:'Undo', onAction:()=>{
            g.currentSavings = prev; scheduleSave(); render();
          }});
        } else close();
      });
    }
  });
}

/* Low-level call to the scan Edge Function — takes any prompt, returns parsed JSON. */
const MAX_SCAN_BYTES = 8 * 1024 * 1024;
async function callScanAPI(base64, mediaType, promptKey){
  const functionUrl = SUPABASE_URL + '/functions/v1/hyper-processor';
  // Rejected here as well as on the server, so the user gets a useful message
  // instead of a timeout after uploading a 40MB scan.
  if(base64 && base64.length * 0.75 > MAX_SCAN_BYTES){
    throw new Error('That file is too large to scan (limit is 8MB). Try exporting fewer pages.');
  }
  /* The access token is read at call time. It used to come from a module-level
     `session` captured once at login, so after the token expired (~1 hour) this
     one endpoint started returning 401 while everything else kept working —
     about as hard to diagnose as a bug gets. The anon-key fallback is gone:
     it let anyone with the shipped HTML call this endpoint. */
  const { data: fresh } = await sb.auth.getSession();
  const token = fresh && fresh.session && fresh.session.access_token;
  if(!token) throw new Error('Your session expired — log in again to scan documents.');
  session = fresh.session;
  let response;
  try{
    response = await fetch(functionUrl, {
      method: "POST",
      headers: { "Content-Type":"application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ base64, mediaType, promptKey })
    });
  }catch(networkErr){
    throw new Error('Network request failed — ' + (networkErr.message || 'check your connection'));
  }
  let data;
  try{ data = await response.json(); }
  catch(parseErr){ throw new Error('Server returned an unreadable response (status ' + response.status + ')'); }
  if(!response.ok){
    const apiMsg = (data && data.error && (data.error.message||data.error)) || ('HTTP ' + response.status);
    throw new Error(String(apiMsg));
  }
  const textBlock = (data.content||[]).find(b=>b.type==='text');
  if(!textBlock) throw new Error('No text in the model\'s response');
  if(data.stop_reason === 'max_tokens'){
    throw new Error('Response was cut off — too many transactions in one image. Try a shorter screenshot or fewer transactions per upload.');
  }
  const clean = textBlock.text.replace(/```json|```/g,'').trim();
  try{
    return JSON.parse(clean);
  }catch(jsonErr){
    // Fallback: the model may have added stray text around the JSON — try
    // pulling out the largest {...} or [...] block and parsing just that.
    const braceMatch = clean.match(/\{[\s\S]*\}/);
    const bracketMatch = clean.match(/\[[\s\S]*\]/);
    const candidate = braceMatch ? braceMatch[0] : (bracketMatch ? bracketMatch[0] : null);
    if(candidate){
      try{ return JSON.parse(candidate); }
      catch(e2){ /* fall through to the error below */ }
    }
    throw new Error('Could not parse the extracted details as JSON');
  }
}

/* =========================================================
   CENTRALIZED DOCUMENT UPLOADER
========================================================= */
const DOC_TYPES = [
  {key:'receipt', label:'Receipt', hint:'A purchase receipt — groceries, food, gas, retail, restaurants.'},
  {key:'bill', label:'Bill', hint:'A recurring bill — utility, bank, loan/debt, subscription, insurance.'},
  {key:'statement', label:'Bank Statement', hint:'A bank/card statement showing multiple transactions, income and expenses mixed.'},
  {key:'screenshot', label:'Bank Account Screenshot', hint:'A banking app screenshot showing a transaction list.'},
  {key:'paystub', label:'Pay Stub', hint:'A paycheck / pay stub — always income.'}
];
/* The extraction prompts used to be built here and posted to the Edge
   Function, which forwarded whatever arrived straight to the model. That made
   the endpoint a general-purpose LLM proxy on the owner's account. The prompts
   now live server-side and are selected by key; the doc type IS the key. */
/* Normalizes any doc-type's extraction into a flat array of review-row
   candidates in one common shape, ready for the review table. */
function normalizeDocExtraction(docType, raw){
  if(docType==='paystub'){
    return [{
      destination:'job', direction:'income',
      date: raw.payDate || raw.periodEnd || todayISO(),
      noDate: !(raw.payDate || raw.periodEnd),
      amount: raw.netPay,
      description: 'Pay stub',
      periodStart: raw.periodStart, periodEnd: raw.periodEnd, payDate: raw.payDate, hours: raw.hours
    }];
  }
  const txs = (raw && Array.isArray(raw.transactions)) ? raw.transactions : [];
  return txs.map(t=>{
    if(t.direction === 'income'){
      const isSideGig = t.income_type_guess === 'side_gig';
      return {
        destination: isSideGig ? 'sidegig' : 'otherincome', direction:'income',
        date: t.date || todayISO(), noDate: !t.date, amount: t.amount,
        description: t.description || (isSideGig ? (t.source_guess||'Side gig') : 'Other income'),
        source: t.source_guess || t.description || 'Other',
        balance_after: t.balance_after, uncertain: !!t.uncertain
      };
    }
    return {
      destination:'expense', direction:'expense',
      date: t.date || todayISO(), noDate: !t.date, amount: t.amount,
      description: t.description || 'Expense',
      category: (t.category_guess && ALL_CATS.includes(t.category_guess)) ? t.category_guess : ONETIME_CAT,
      frequency: ['onetime','monthly','biweekly'].includes(t.frequency_guess) ? t.frequency_guess : 'onetime',
      balance_after: t.balance_after, uncertain: !!t.uncertain
    };
  });
}
/* A row is "missing a field" if it has no usable amount or no date was found. */
function amountInvalid(r){
  return (r.amount==null || r.amount==='' || isNaN(Number(r.amount)) || Number(r.amount)===0);
}
function rowMissingField(r){
  return amountInvalid(r) || !!r.noDate;
}
/* Duplicate check that works across all four destinations. */
const normName = s => String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
/* Loose enough to WARN about a possible duplicate. Never used to decide a
   write — substring matching says "Netflix" matches "Netflix Premium Refund",
   which is fine for a warning and dangerous for anything else. */
function namesLooselyMatch(a, b){
  const na = normName(a), nb = normName(b);
  if(!na || !nb) return false;
  return na.includes(nb) || nb.includes(na);
}
/* The bar for silently logging a payment against an existing bill. */
function namesExactlyMatch(a, b){
  const na = normName(a), nb = normName(b);
  return !!na && na === nb;
}
/* If this "recurring-looking" row is actually the same subscription/bill we
   already track (same name, same amount), return the existing item so we log
   this occurrence against it instead of creating a duplicate recurring item. */
function findExistingRecurringItem(row){
  return state.expenses.items.find(item =>
    item.status!=='cancelled' &&
    (item.frequency==='monthly' || item.frequency==='biweekly') &&
    namesExactlyMatch(item.name, row.description) &&
    amountsClose(item.amount, row.amount, 0.02)
  );
}
function findGenericDuplicate(row){
  if(row.destination==='job') return findScanDuplicate('jobstub', {netPay:row.amount, payDate:row.date});
  if(row.destination==='sidegig') return findScanDuplicate('sidegig', {amount:row.amount, date:row.date});
  if(row.destination==='expense'){
    if(row.frequency==='monthly' || row.frequency==='biweekly'){
      /* Two different bars on purpose. An EXACT match silently logs a payment
         against the existing bill, so it has to be certain. A LOOSE match only
         raises a flag for the user to look at — "NETFLIX PREMIUM REFUND $16.20"
         should never quietly rewrite a real "Netflix $15.49", but the user
         should still be told the two look related. */
      const existing = findExistingRecurringItem(row);
      if(existing) return {
        label: `Same as your existing "${esc(existing.name)}" (${fmt(existing.amount)}/${esc(existing.frequency)}) — this will log as a payment on that item, not a new expense`,
        isRecurringMatch: true };
      const similar = state.expenses.items.find(item =>
        item.status!=='cancelled' &&
        (item.frequency==='monthly' || item.frequency==='biweekly') &&
        namesLooselyMatch(item.name, row.description));
      if(similar) return {
        label: `Looks related to your existing "${esc(similar.name)}" (${fmt(similar.amount)}/${esc(similar.frequency)}) — check whether this is the same bill or a separate charge. It will be added as a NEW expense.` };
    }
    return findScanDuplicate('expense', {amount:row.amount, date:row.date});
  }
  if(row.destination==='otherincome'){
    const hit = state.otherIncome.entries.find(e=> amountsClose(e.amount,row.amount) && datesClose(e.date,row.date));
    if(hit) return { label: `${esc(hit.label||'Other income')} — ${fmt(hit.amount)} on ${esc(dispDate(hit.date))}` };
  }
  return null;
}

function openDocumentUploadModal(){
  openModal({
    title: "Upload Document",
    desc: "Choose what kind of document this is, then upload one or more images. Everything gets extracted into a review list before anything is added.",
    wide: true,
    bodyBuilder(body, close){
      const typeOpts = DOC_TYPES.map(t=>`<option value="${t.key}">${t.label}</option>`).join('');
      body.appendChild(elAll(`
        <div class="field"><label for="doc-type">Document type</label><select id="doc-type">${typeOpts}</select></div>
        <div class="muted" style="font-size:11.5px;margin:-6px 0 6px;" id="doc-type-hint"></div>
        <div class="muted" style="font-size:11px;color:#E2932E;margin-bottom:10px;">⚠ PDFs are recommended for transaction history — screenshot reading isn't guaranteed to catch everything, especially on long scrollable lists.</div>
        <div class="scan-drop" id="doc-drop">Click to choose one or more images or PDFs</div>
        <input type="file" id="doc-file" accept="image/*,application/pdf" multiple style="display:none;">
        <div id="doc-file-list" class="muted" style="font-size:11.5px;margin-top:6px;"></div>
        <div class="modal-actions">
          <button class="btn" id="doc-cancel">Cancel</button>
          <button class="btn btn-gold" id="doc-scan" disabled>Scan Documents</button>
        </div>
      `));
      const typeSel = body.querySelector('#doc-type');
      const hintEl = body.querySelector('#doc-type-hint');
      function updateHint(){ hintEl.textContent = DOC_TYPES.find(t=>t.key===typeSel.value).hint; }
      updateHint();
      typeSel.addEventListener('change', updateHint);

      const fileInput = body.querySelector('#doc-file');
      const dropEl = body.querySelector('#doc-drop');
      const fileListEl = body.querySelector('#doc-file-list');
      const scanBtn = body.querySelector('#doc-scan');
      dropEl.addEventListener('click', ()=> fileInput.click());
      fileInput.addEventListener('change', ()=>{
        const files = Array.from(fileInput.files||[]);
        fileListEl.textContent = files.length ? files.length+' file(s) selected: '+files.map(f=>f.name).join(', ') : '';
        scanBtn.disabled = files.length===0;
      });
      body.querySelector('#doc-cancel').addEventListener('click', close);

      scanBtn.addEventListener('click', async ()=>{
        const files = Array.from(fileInput.files||[]);
        if(files.length===0) return;
        const docType = typeSel.value;
        scanBtn.disabled = true;
        dropEl.classList.add('busy');
        let allRows = [];
        for(let i=0;i<files.length;i++){
          dropEl.textContent = `Scanning ${i+1} of ${files.length}…`;
          try{
            const base64 = await fileToBase64(files[i]);
            const raw = await callScanAPI(base64, files[i].type, docType);
            const rows = normalizeDocExtraction(docType, raw);
            allRows = allRows.concat(rows);
          }catch(err){
            console.error(err);
            allRows.push({ error: true, description: files[i].name+' — '+((err&&err.message)||'failed to read') });
          }
        }
        allRows.forEach(r=>{
          if(!r.error){
            r.id = uid();
            r.dup = findGenericDuplicate(r);
            r.needsReview = rowMissingField(r) || !!r.uncertain;
            r.include = !r.needsReview && !r.dup;
          }
        });
        const okOnly = allRows.filter(r=>!r.error);
        if(okOnly.length){
          state.pendingDocReview = { docType, rows: okOnly };
          scheduleSave();
        }
        renderDocReviewStep(body, close, allRows);
      });
    }
  });
}

/* Reopens a previously-saved, unfinished document review — e.g. after an
   accidental close — straight to the review table, no re-scanning needed. */
function openSavedDocReview(){
  if(!state.pendingDocReview || !state.pendingDocReview.rows || state.pendingDocReview.rows.length===0) return;
  openModal({
    title: "Unfinished Review",
    desc: "Picking up where you left off — nothing was lost.",
    wide: true,
    bodyBuilder(body, close){
      renderDocReviewStep(body, close, state.pendingDocReview.rows);
    }
  });
}
function renderDocReviewStep(body, close, rows){
  body.innerHTML = '';
  const okRows = rows.filter(r=>!r.error);
  const errRows = rows.filter(r=>r.error);
  body.appendChild(el(`<div class="desc" style="margin-bottom:12px;">Found ${okRows.length} transaction${okRows.length===1?'':'s'}. Review, fix anything wrong, uncheck what you don't want, then add.</div>`));
  if(errRows.length){
    const errBox = el(`<div class="auth-err" style="margin-bottom:12px;"></div>`);
    errBox.innerHTML = errRows.map(r=>esc(r.description)).join('<br>');
    body.appendChild(errBox);
  }
  if(okRows.length===0){
    body.appendChild(el(`<div class="modal-actions"><button class="btn btn-gold" id="doc-close">Close</button></div>`));
    body.querySelector('#doc-close').addEventListener('click', close);
    return;
  }

  const scroller = document.createElement('div');
  scroller.style.cssText = 'max-height:50vh;overflow-y:auto;';
  const destLabels = {expense:'Expense', sidegig:'Side Gig', otherincome:'Other Income', job:'Job Income'};

  function groupOf(row){ return row.dup ? 0 : (row.needsReview ? 1 : 2); }
  const displayRows = okRows.slice().sort((a,b)=>{
    const ga = groupOf(a), gb = groupOf(b);
    if(ga !== gb) return ga - gb;
    return (a.date||'').localeCompare(b.date||'');
  });
  const groupTitles = { 0: '⚠ Possible duplicates — review before including', 1: '⚠ Needs review — missing info or uncertain read', 2: 'Transactions' };
  let lastGroup = null;

  displayRows.forEach(row=>{
    const g = groupOf(row);
    if(g !== lastGroup){
      scroller.appendChild(el(`<div class="eyebrow" style="margin-top:${lastGroup===null?'0':'16px'};">${groupTitles[g]}</div>`));
      lastGroup = g;
    }
    const reviewStyle = row.needsReview ? 'border:2px solid #E2932E;' : (row.dup ? 'border:2px solid var(--red);' : '');
    const reasons = [];
    if(amountInvalid(row)) reasons.push('missing an amount');
    if(row.noDate) reasons.push('no date found');
    if(row.uncertain) reasons.push('the reading may be inaccurate — double-check the description/amount');
    const reviewNote = reasons.length ? `⚠ Needs review — ${reasons.join('; ')}. Fix it and check the box to include it.` : '';
    const rowBox = el(`
      <div class="panel" style="background:var(--panel-alt);padding:12px 14px;margin-bottom:10px;${reviewStyle}">
        <div style="display:flex;align-items:flex-start;gap:10px;">
          <input type="checkbox" class="doc-include" data-id="${esc(row.id)}" ${row.include?'checked':''} style="margin-top:4px;">
          <div style="flex:1;">
            ${reviewNote ? `<div class="muted" style="font-size:11px;color:#E2932E;font-weight:600;margin-bottom:6px;">${reviewNote}</div>` : ''}
            <div class="field-row">
              <div class="field"><label>Description</label><input type="text" aria-label="Transaction description" class="doc-field" data-id="${esc(row.id)}" data-field="description" value="${esc(row.description||'')}"></div>
              <div class="field"><label>Amount</label><input type="number" step="0.01" aria-label="Transaction amount" class="doc-field" data-id="${esc(row.id)}" data-field="amount" value="${esc(row.amount??'')}"></div>
            </div>
            <div class="field-row">
              <div class="field"><label>Date</label><input type="date" aria-label="Transaction date" class="doc-field" data-id="${esc(row.id)}" data-field="date" value="${esc(row.date||todayISO())}"></div>
              <div class="field"><label>Goes to</label>
                <select class="doc-field" aria-label="Where this transaction goes" data-id="${esc(row.id)}" data-field="destination">
                  <option value="expense" ${row.destination==='expense'?'selected':''}>Expense</option>
                  <option value="sidegig" ${row.destination==='sidegig'?'selected':''}>Side Gig Income</option>
                  <option value="otherincome" ${row.destination==='otherincome'?'selected':''}>Other Income</option>
                  ${row.destination==='job' ? '<option value="job" selected>Job Income</option>' : ''}
                </select>
              </div>
            </div>
            ${row.destination==='expense' ? `
            <div class="field-row">
              <div class="field"><label>Category</label>
                <select class="doc-field" aria-label="Expense category" data-id="${esc(row.id)}" data-field="category">${catOptions(row.category)}</select>
              </div>
              <div class="field"><label>Frequency</label>
                <select class="doc-field" aria-label="How often this recurs" data-id="${esc(row.id)}" data-field="frequency">
                  <option value="onetime" ${row.frequency==='onetime'?'selected':''}>One-time</option>
                  <option value="monthly" ${row.frequency==='monthly'?'selected':''}>Monthly</option>
                  <option value="biweekly" ${row.frequency==='biweekly'?'selected':''}>Biweekly</option>
                </select>
              </div>
            </div>` : ''}
            ${row.dup ? `<div class="auth-err" style="margin-top:6px;padding:6px 10px;font-size:11.5px;">⚠ Might already be added: ${esc(row.dup.label)}</div>` : ''}
          </div>
        </div>
      </div>
    `);
    scroller.appendChild(rowBox);
  });
  body.appendChild(scroller);

  const includedCountEl = el(`<div class="muted" style="font-size:11.5px;margin-top:10px;"></div>`);
  function updateCount(){
    const n = okRows.filter(r=>r.include).length;
    includedCountEl.textContent = n + ' of ' + okRows.length + ' selected';
  }
  updateCount();
  body.appendChild(includedCountEl);
  body.appendChild(el(`<div class="muted" style="font-size:11px;margin-top:2px;">Closing without adding keeps this saved — look for "Unfinished Review" in the header to come back to it.</div>`));
  body.appendChild(el(`
    <div class="modal-actions">
      <button class="btn btn-danger" id="doc-discard">Discard</button>
      <button class="btn" id="doc-cancel-review">Close (keep for later)</button>
      <button class="btn btn-gold" id="doc-add">Add Selected</button>
    </div>
  `));

  body.querySelectorAll('.doc-include').forEach(cb=>{
    cb.addEventListener('change', e=>{
      const row = okRows.find(r=>r.id===e.target.dataset.id);
      if(row){ row.include = e.target.checked; updateCount(); scheduleSave(); }
    });
  });
  body.querySelectorAll('.doc-field').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const row = okRows.find(r=>r.id===e.target.dataset.id);
      const field = e.target.dataset.field;
      if(!row) return;
      row[field] = (field==='amount') ? round2(e.target.value) : String(e.target.value).slice(0,200);
      if(field==='date') row.noDate = false;
      if(field==='amount' || field==='date'){
        row.needsReview = rowMissingField(row) || !!row.uncertain;
      }
      scheduleSave();
    });
  });
  body.querySelector('#doc-cancel-review').addEventListener('click', close);
  body.querySelector('#doc-discard').addEventListener('click', ()=>{
    if(!confirm('Discard this whole review? All extracted transactions will be lost.')) return;
    state.pendingDocReview = null;
    scheduleSave(); close(); render();
  });
  body.querySelector('#doc-add').addEventListener('click', ()=>{
    const checked = okRows.filter(r=>r.include);
    const stillBroken = checked.filter(amountInvalid);
    if(stillBroken.length){
      const proceed = confirm(stillBroken.length + ' selected item(s) still have no amount and will be skipped: ' + stillBroken.map(r=>r.description||'(untitled)').join(', ') + '. Add the rest anyway?');
      if(!proceed) return;
    }
    /* Everything below treats the extracted row as hostile input. It came from
       a model reading a document that the app did not write, so a receipt can
       contain text addressed to the extractor. Amounts, dates and names are
       re-coerced here rather than trusted, and nothing is written to a field
       the review table didn't show the user. */
    let added = 0;
    checked.filter(row => !amountInvalid(row)).forEach(row=>{
      const amount = round2(row.amount);
      const date = isValidISO(row.date) ? row.date : todayISO();
      const desc = String(row.description||'').trim().slice(0,200);
      if(row.destination==='expense'){
        const looksRecurring = row.frequency==='monthly' || row.frequency==='biweekly';
        const existing = looksRecurring ? findExistingRecurringItem(row) : null;
        if(existing){
          // Same subscription/bill we already have — log this payment against
          // it instead of creating a duplicate. The key must be the item's real
          // due date: keying on the posting date produced entries that no
          // reader ever looked up, so the payment was invisible in history and
          // the month silently kept using the estimate.
          state.expenses.monthlyLog[logKey(existing.id, nearestOccurrence(existing, date))] = amount;
        } else {
          const dueDay = parseISO(date) ? parseISO(date).getDate() : 1;
          const newItem = {
            id:uid(), name: desc || 'Untitled expense', category: ALL_CATS.includes(row.category) ? row.category : ONETIME_CAT,
            amount, frequency: ['monthly','biweekly','onetime'].includes(row.frequency) ? row.frequency : 'onetime',
            dueDay: row.frequency==='monthly' ? dueDay : null,
            anchorDate: row.frequency==='biweekly' ? date : null,
            date: row.frequency==='onetime' ? date : null,
            // An imported bill starts the month it was first seen, not at the
            // beginning of recorded history.
            startDate: row.frequency==='onetime' ? null : monthKey(date)+'-01',
            endDate:null, memberId:null, status:"active"
          };
          state.expenses.items.push(newItem);
          if(looksRecurring) state.expenses.monthlyLog[logKey(newItem.id, date)] = amount;
        }
      } else if(row.destination==='sidegig'){
        const src = String(row.source||'Other').trim().slice(0,60) || 'Other';
        state.sideGig.entries.push({ id:uid(), date, source:src, amount, notes:'', memberId:null });
        // Capped and coerced: this list is rendered in every source dropdown,
        // and the extractor could otherwise grow it without bound.
        if(!state.sideGig.sources.includes(src) && state.sideGig.sources.length < 50) state.sideGig.sources.push(src);
      } else if(row.destination==='otherincome'){
        state.otherIncome.entries.push({ id:uid(), date, label: desc || 'Other income', amount, memberId:null, notes:'' });
        state.settings.otherIncomeEnabled = true;
      } else if(row.destination==='job'){
        const payDate = isValidISO(row.payDate) ? row.payDate : date;
        state.job.periods.push({
          id:uid(),
          start: isValidISO(row.periodStart) ? row.periodStart : payDate,
          end:   isValidISO(row.periodEnd)   ? row.periodEnd   : payDate,
          payDate,
          hours: num(row.hours) > 0 ? num(row.hours) : null,
          actualNet: amount, notes:'', memberId: state.members[0]?state.members[0].id:null
        });
      }
      added++;
    });
    /* `balance_after` is deliberately NOT applied here. It is the one extracted
       field the review table never showed and never let the user edit, and it
       overwrote currentSavings on EVERY goal — so a number printed on a
       scanned document could silently rewrite the figure that drives the goal
       math, the progress bar and the whole Timeline. It is now offered
       explicitly, once, after the user can see it. */
    const balances = checked
      .filter(r => r.balance_after != null && Number.isFinite(Number(r.balance_after)) && isValidISO(r.date))
      .sort((a,b)=> a.date.localeCompare(b.date));
    state.pendingDocReview = null;
    scheduleSave(); close(); render();
    toast('Added ' + added + ' transaction' + (added===1?'':'s'), {kind:'ok'});
    if(balances.length && state.goals.length) offerDetectedBalance(balances[balances.length-1]);
  });
}

/* A card for a number the app MEASURED. Rendered to the cent, because the

/* A card for a number the app GUESSED. Dashed border, rounded to the dollar,
   carries its range and how much history it is built on. Precision is a claim
   about confidence, so an estimate must not look like a measurement. */
function statCardEstimate(label, value, note, range, confidence, tone){

/* Three states, not a binary. "$1/week under" flipping a bold stamp from
   ON TRACK to BEHIND was a harsher verdict than the data supports. */
const GOAL_FLAG = {
  ontrack: {cls:'ontrack', label:'On Track'},
  close:   {cls:'close',   label:'Just Behind'},
  behind:  {cls:'behind',  label:'Behind'},
  new:     {cls:'newgoal', label:'Just Started'},
  unknown: {cls:'newgoal', label:'Needs Dates'}
};
/* Months that actually have real user-entered data — not just scheduled future
   placeholders. Covers every income stream: weekly-variable pay and Other
   Income were both missing, so a user paid weekly with no pay periods saw
   "No months with data yet" despite months of logged income. Orphaned
   monthlyLog keys (whose expense item was deleted) are ignored, so a deleted
   bill can't conjure a phantom month. */
function monthsWithData(){
  const set = new Set();
  const add = iso => { const mk = monthKey(iso); if(mk && isValidISO(iso)) set.add(mk); };
  state.job.periods.forEach(p=>{ if(p.hours!=null || p.actualNet!=null) add(p.payDate); });
  (state.job.weeklyVariable.entries||[]).forEach(e=> add(e.weekEnd));
  state.sideGig.entries.forEach(e=> add(e.date));
  state.otherIncome.entries.forEach(e=> add(e.date));
  state.expenses.items.forEach(i=>{ if(i.frequency==='onetime') add(i.date); });
  const liveIds = new Set(state.expenses.items.map(i=>i.id));
  Object.keys(state.expenses.monthlyLog).forEach(key=>{
    const [itemId, occ] = key.split('|');
    if(occ && liveIds.has(itemId)) add(occ);
  });
  return Array.from(set).sort();
}
/* Deletes log entries whose expense item no longer exists. Called after any
   expense deletion so history, duplicate detection and the month list can't be
   driven by rows the user can no longer see or edit. */
function pruneOrphanLogs(){
  const liveIds = new Set(state.expenses.items.map(i=>i.id));
  let removed = 0;
  Object.keys(state.expenses.monthlyLog).forEach(key=>{
    if(!liveIds.has(key.split('|')[0])){ delete state.expenses.monthlyLog[key]; removed++; }
  });
  // dismissedPending grows forever otherwise; drop anything stale or orphaned.
  const cutoff = addDays(todayISO(), -120);
  state.dismissedPending = state.dismissedPending.filter(k=>{
    const [itemId, occ] = String(k).split('|');
    return liveIds.has(itemId) && occ >= cutoff;
  });
  return removed;
}
/* Snaps a payment date onto the item's real due date, so a bill due on the
   15th that posts on the 14th logs against the 15th occurrence instead of
   creating a key nothing ever reads. Falls back to the raw date if the item
   has no occurrence anywhere near it. */
function nearestOccurrence(item, dateISO){
  if(!isValidISO(dateISO)) return dateISO;
  const near = itemOccurrences(item, addDays(dateISO,-20), addDays(dateISO,20));
  if(!near.length) return dateISO;
  return near.reduce((best,occ)=>
    Math.abs(daysBetween(occ,dateISO)) < Math.abs(daysBetween(best,dateISO)) ? occ : best);
}

  const closeDayEl = panel.querySelector('#job-closeday');
  if(closeDayEl) closeDayEl.addEventListener('change', e=>{ state.job.weeklyVariable.closeDay = Math.min(Math.max(Math.trunc(num(e.target.value)),0),6); scheduleSave(); render(); });

  const addWeekBtn = panel.querySelector('#add-week');
  if(addWeekBtn) addWeekBtn.addEventListener('click', ()=>{
    const closeDay = state.job.weeklyVariable.closeDay;
    const t = new Date(todayISO()+"T00:00:00");
    const todayDow = t.getDay();
    let diff = closeDay - todayDow;
    if(diff < 0) diff += 7;
    const weekEnd = addDays(todayISO(), diff);
    if((state.job.weeklyVariable.entries||[]).some(e=>e.weekEnd===weekEnd)){
      alert('This week is already logged below — edit its amount there.');
      return;
    }
    state.job.weeklyVariable.entries.push({

      scheduleSave(); render();
    });
  });

    });
  });
  panel.querySelectorAll('.wv-field').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const id = e.target.closest('tr').dataset.id, field = e.target.dataset.field;

      state.job.weeklyVariable.entries = state.job.weeklyVariable.entries.filter(x=>x.id!==id);
      scheduleSave(); render();
    });
  });
  return panel;
}

/* =========================================================
   EXPENSES TAB
========================================================= */
/* One grouping pass. This used to run 65 filter passes over the full item list
   per column (195 for a two-person household), re-applying the same predicate
   up to three times per category. */
function scrollTable(tbody, label, headCols){
  const box = el(`<div class="table-scroll" tabindex="0" role="region" aria-label="${esc(label)}"></div>`);
  const tbl = document.createElement('table');
  tbl.innerHTML = `<caption class="sr-only">${esc(label)}</caption><thead><tr>` +
    headCols.map(c=>`<th scope="col"${c.tight?' class="col-tight"':''}>${esc(c.label)}</th>`).join('') +
    `</tr></thead>`;
  tbl.appendChild(tbody);
  box.appendChild(tbl);
  return box;
}
/* Wraps an already-built table in its own horizontal scroller, so a wide
   table scrolls inside itself instead of making the whole page scroll. */
function wrapScroll(parent, tbl, label){
  const box = el(`<div class="table-scroll" tabindex="0" role="region" aria-label="${esc(label)}"></div>`);
  box.appendChild(tbl);
  parent.appendChild(box);
  return box;
}
function expenseHeadCols(){
  const cols = [{label:'Select', tight:true},{label:'Name'},{label:'Category'}];
  if(state.members.length>1) cols.push({label:'Who'});
  cols.push({label:'Amount'},{label:'Frequency'},{label:'Due'},{label:'Actions', tight:true});
  return cols;
}
function buildExpenseColumn(items, opts){
  opts = opts || {};
  const cats = opts.cats || ALL_CATS;
  const catSet = new Set(cats);
  const col = document.createElement('div');
  const {from: curFrom, to: curTo} = currentMonthRange();
  // A one-off purchase belongs to the month it happened in; recurring items are
  // always live.
  const isLiveVisible = i => i.frequency!=='onetime' || inRange(i.date, curFrom, curTo);

  const cancelled = [];
  const byCat = new Map();
  let total = 0;
  for(const i of items){
    if(!catSet.has(i.category)) continue;
    if(i.status==='cancelled'){ cancelled.push(i); continue; }
    if(!isLiveVisible(i)) continue;
    total += i.frequency==='onetime' ? num(i.amount) : expenseMonthlyEquivalent(i);
    let b = byCat.get(i.category);
    if(!b){ b = {onetime:[], active:[], flagged:[], activeTotal:0, flaggedTotal:0, onetimeTotal:0}; byCat.set(i.category, b); }
    if(i.frequency==='onetime'){ b.onetime.push(i); b.onetimeTotal += num(i.amount); }
    else if(i.status==='flagged'){ b.flagged.push(i); b.flaggedTotal += expenseMonthlyEquivalent(i); }
    else { b.active.push(i); b.activeTotal += expenseMonthlyEquivalent(i); }
  }
  total = round2(total);

  if(opts.heading){
    col.appendChild(el(`
      <div class="panel-head" style="margin-bottom:10px;">
        <h3 style="display:flex;align-items:center;gap:8px;">${opts.dot?`<span style="width:10px;height:10px;border-radius:50%;background:${esc(opts.dot)};display:inline-block;"></span>`:''}${esc(opts.heading)}</h3>
        <button class="btn btn-sm btn-gold add-expense-col" data-member="${esc(opts.memberId||'')}">+ Add${opts.heading?' for '+esc(opts.heading):''}</button>
      </div>
      <div class="muted" style="font-size:var(--fs-xs);margin-bottom:10px;">${fmt(total)}/mo</div>
    `));
  }

  cats.forEach(cat=>{
    const b = byCat.get(cat);
    if(!b) return;
    const catTotal = round2(b.activeTotal + b.onetimeTotal);
    const onlyOneOff = b.active.length===0 && b.flagged.length===0 && b.onetime.length>0;
    const group = el(`<div class="cat-group"></div>`);
    group.appendChild(el(`<div class="cat-title"><span>${esc(cat)}</span><span class="amt">${fmt(catTotal)}${onlyOneOff?' this month':'/mo'}</span></div>`));
    const rows = onlyOneOff
      ? b.onetime.slice().sort((a,b2)=>(b2.date||'').localeCompare(a.date||''))
      : b.active.concat(b.onetime);
    if(rows.length){
      /* Each row is ~28 DOM nodes of live form controls. A few thousand
         expenses meant ~66,000 nodes and a visible freeze on every render —
         to draw a list nobody can read in one sitting. Render a page at a
         time; the totals above are computed from all of them regardless. */
      const shown = rows.slice(0, EXPENSE_PAGE);
      group.appendChild(scrollTable(expenseTableBody(shown), cat + ' expenses', expenseHeadCols()));
      if(rows.length > shown.length){
        const more = el(`<button class="btn btn-sm" style="margin-top:6px;">Show the other ${rows.length - shown.length} in ${esc(cat)}</button>`);
        more.addEventListener('click', ()=>{
          const rest = scrollTable(expenseTableBody(rows.slice(EXPENSE_PAGE)), cat + ' expenses, continued', expenseHeadCols());
          more.replaceWith(rest);
          attachExpenseEvents(rest);
        });
        group.appendChild(more);
      }
    }
    if(b.flagged.length){
      const sub = el(`<div class="flagged-sub"></div>`);
      sub.appendChild(el(`<div class="flagged-sub-title"><span>Flagged for cancellation</span><span class="amt">${fmt(b.flaggedTotal)}/mo</span></div>`));
      sub.appendChild(scrollTable(expenseTableBody(b.flagged), cat + ' expenses flagged for cancellation', expenseHeadCols()));
      group.appendChild(sub);
    }
    col.appendChild(group);
  });

  if(byCat.size === 0){
    col.appendChild(el(`<div class="empty">No expenses here yet.</div>`));
  }
  if(cancelled.length){
    const det = el(`<details style="margin-top:16px;"><summary class="muted" style="cursor:pointer;font-size:var(--fs-sm);">Cancelled (${cancelled.length})</summary></details>`);
    det.appendChild(scrollTable(expenseTableBody(cancelled), 'Cancelled expenses', expenseHeadCols()));
    col.appendChild(det);
  }
  return col;
}

  wrap.appendChild(toolbarPanel);

  // "Where is my money going" — the question this tab exists to answer, and

  const catRows = categorySpendRows();
  if(catRows.length){
    const catPanel = el(`<div class="panel"></div>`);
    catPanel.appendChild(chartCard('Spending by category — this month',
      'Solid bar is this month. The bar behind it is your average over the last three completed months.',
      chartCategorySpend(catRows), [[CHART_COLORS.exp,'This month'],['#39424E','3-month average']]));
    wrap.appendChild(catPanel);

  const allItems = state.expenses.items;
  function buildSection(title, subtitle, cats){

      panel.appendChild(buildExpenseColumn(sectionItems.filter(i=>!i.memberId), {memberId:null, cats}));
    } else {
      panel.appendChild(buildExpenseColumn(sectionItems, {cats}));
    }
    return panel;
  }

  wrap.appendChild(buildSection("Recurring Expenses", "Housing, debt, subscriptions, and insurance — your ongoing monthly obligations.", RECURRING_CATS));
  wrap.appendChild(buildSection("Other Expenses", "Groceries, gas, one-off purchases, and everything else — this month's activity. Past months live in history below.", OTHER_EXPENSE_CATS));

  wrap.querySelectorAll('.add-expense-col').forEach(btn=>{

      openExpenseModal(memberId ? {name:"", category:GAS_CAT, amount:'', frequency:"monthly", dueDay:1, anchorDate:todayISO(), memberId, lockMember:true} : undefined);
    });

  /* Filtering hides rows instead of rebuilding the app. The old handler called
     render() per keystroke — tens of thousands of nodes and listeners for each
