    const weekEnd = addDays(weekStart, 6);
    const from = weekStart < g.startDate ? g.startDate : weekStart;   // don't credit pre-goal income
    const actual = outsideIncomeInRange(from, weekEnd);
    weeks.push({ n:i+1, weekStart, weekEnd, actual, target, diff: round2(actual-target) });
  }
  return { totalWeeks, weeksPassed, weeks };
}
/* The forward plan: every Sunday–Saturday week still remaining, each carrying
   an equal share of what's still needed. The rows sum to the requirement
   exactly — the last week absorbs the rounding remainder rather than letting
   `pace x weeks` drift a few dollars past the goal. */
function goalForwardWeeklyPlan(g){
  const s = goalStats(g);
  const weeks = s.weeks.map(w=>({ ...w, amount: s.paceMin }));
  // Only reconcile the rounding remainder into the last row when the rows
  // actually cover the whole horizon; otherwise the last drawn week would
  // absorb decades of remainder.
  const complete = weeks.length === s.planWeeks;
  if(weeks.length && complete){
    const drift = round2(s.outsideNeededMin - s.paceMin*weeks.length);
    weeks[weeks.length-1].amount = round2(weeks[weeks.length-1].amount + drift);
  }
  return { count: s.planWeeks, drawn: weeks.length, complete,
           pace: s.paceMin, total: s.outsideNeededMin, weeks };
}

/* =========================================================
   TRANSACTION ENRICHMENT (§1)

   The only external API this project has is Anthropic, reached through the
   existing scan Edge Function — there is no third-party enrichment provider
   configured anywhere in the codebase. So enrichment runs through that same
   function with a dedicated, server-side prompt.

   The expensive mistake would be enriching per transaction. Enrichment is a
   property of a MERCHANT, not of a payment, so results are cached by
   normalised key: forty Publix visits cost one lookup, and a statement
   re-imported next month costs nothing at all. Concretely:

     - descriptors are normalised and de-duplicated before any call
     - anything already in the cache is never sent again
     - results persist in state, so they survive reloads and sync across devices
     - one batched request covers up to 60 unseen merchants
     - a failed call degrades to local normalisation; nothing blocks on it

   It is deliberately advisory. Enrichment can suggest a category, a cleaner
   merchant name, or that something looks like a card payment — but it never
   silently rewrites an amount, a date, or a cash/credit classification that
   would move money. Those need the user, because a wrong guess there corrupts
   the ledger rather than merely mislabelling a row.
========================================================= */
const ENRICH_BATCH = 60;
const ENRICH_TTL_DAYS = 180;      // brands change; re-check occasionally
function enrichmentFor(nameOrKey){
  const key = merchantKey(nameOrKey);
  const hit = state.enrichment[key];
  if(!hit) return null;
  if(hit.at && daysBetween(hit.at, todayISO()) > ENRICH_TTL_DAYS) return null;
  return hit;
}
function needsEnrichment(name){
  const key = merchantKey(name);
  return !!key && !enrichmentFor(key);
}
/* Enriches a set of raw descriptors. Returns a map of merchantKey -> result.
   Safe to call with anything: already-known keys never leave the browser. */
async function enrichMerchants(rawNames, opts){
  opts = opts || {};
  const wanted = new Map();          // merchantKey -> a representative raw descriptor
  (rawNames || []).forEach(raw=>{
    const key = merchantKey(raw);
    if(!key || wanted.has(key)) return;
    if(enrichmentFor(key) && !opts.force) return;
    wanted.set(key, String(raw).slice(0,160));
  });
  if(wanted.size === 0) return {};

  const keys = Array.from(wanted.keys());
  const out = {};
  for(let i=0; i<keys.length; i+=ENRICH_BATCH){
    const slice = keys.slice(i, i+ENRICH_BATCH);
    const descriptors = slice.map(k=>wanted.get(k));
    let parsed = null;
    try{
      parsed = await callScanAPI(null, null, 'enrich', descriptors);
    }catch(err){
      // Enrichment is an improvement, not a dependency. Local normalisation
      // already gave every transaction a usable merchant key.
      console.warn('enrichment unavailable, continuing without it', err);
      if(opts.onError) opts.onError(err);
      break;
    }
    const rows = (parsed && Array.isArray(parsed.merchants)) ? parsed.merchants : [];
    slice.forEach((key, n)=>{
      const r = rows[n];
      if(!r) return;
      const rec = {
        merchant: String(r.merchant || '').slice(0,120) || null,
        category: ALL_CATS.includes(r.category) ? r.category : null,
        likelyRecurring: !!r.likely_recurring,
        likelyFrequency: ['monthly','yearly','biweekly','weekly'].includes(r.likely_frequency) ? r.likely_frequency : null,
        kind: ['purchase','card_payment','transfer','income'].includes(r.kind) ? r.kind : 'purchase',
        confidence: Math.max(0, Math.min(1, num(r.confidence))),
        at: todayISO()
      };
      // A cleaner brand name gives a better key for future matching — but only
      // when the model was actually confident about it.
      if(rec.merchant && rec.confidence >= 0.6) rec.canonicalKey = merchantKey(rec.merchant);
      state.enrichment[key] = rec;
      out[key] = rec;
    });
  }
  scheduleSave();
  return out;
}
/* Applies a cached enrichment to a transaction-shaped record. Advisory only:
   it fills gaps and improves matching, and never overrides something the user
   set explicitly. Returns the list of fields it actually touched. */
function applyEnrichment(rec, opts){
  opts = opts || {};
  const e = enrichmentFor(rec.name);
  if(!e) return [];
  const touched = [];
  if(e.canonicalKey && e.canonicalKey !== rec.merchantKey){
    // Matching improves the most here: "SQ *JOE'S #14" and "Joes Coffee" end up
    // on the same key, so a transaction imported today can find an obligation
    // created months ago under a different descriptor.
    rec.merchantKey = e.canonicalKey;
    touched.push('merchantKey');
  }
  if(e.merchant && opts.renameDisplay && !rec.userNamed){
    rec.displayName = e.merchant;
    touched.push('displayName');
  }
  if(e.category && !rec.categoryLocked && (!rec.category || rec.category === 'Misc' || rec.category === ONETIME_CAT)){
    rec.category = e.category;
    touched.push('category');
  }
  /* A suspected card payment is SUGGESTED, never applied. Getting this wrong
     in either direction corrupts the cash total — a purchase mistaken for a
     payment vanishes from spending, and a payment mistaken for a purchase gets
     double-counted against the card. The user confirms it. */
  if(e.kind === 'card_payment' && rec.kind === 'expense' && e.confidence >= 0.7){
    rec.suggestedKind = 'cc_payment';
    touched.push('suggestedKind');
  }
  if(e.likelyRecurring){
    rec.suggestedRecurring = { frequency: e.likelyFrequency || 'monthly', confidence: e.confidence };
    touched.push('suggestedRecurring');
  }
  rec.enrichedAt = e.at;
  return touched;
}
/* Backfills enrichment across the whole stored history, so a merchant learned
   today also improves months-old transactions and their matching. */
async function backfillEnrichment(onProgress){
  const names = new Set();
  state.txns.forEach(t=>{ if(needsEnrichment(t.name)) names.add(t.name); });
  state.obligations.forEach(o=>{ if(needsEnrichment(o.name)) names.add(o.name); });
  state.incomeSources.forEach(s=>{ if(needsEnrichment(s.name)) names.add(s.name); });
  if(names.size === 0) return { enriched:0, updated:0 };
  if(onProgress) onProgress(names.size);
  await enrichMerchants(Array.from(names));
  let updated = 0;
  state.txns.forEach(t=>{ if(applyEnrichment(t).length) updated++; });
  state.obligations.forEach(o=>{ if(applyEnrichment(o).length) updated++; });
  clearMemo(); scheduleSave();
  return { enriched: names.size, updated };
}

/* =========================================================
   RECURRING IDENTITY (§4)

   The old system compared raw names as substrings, so "Netflix" matched
   "Netflix Premium Refund" and almost nothing else matched at all. Name alone
   cannot do this job: normalise hard enough to merge "Verizon" with "Verizon
   Wireless" and you also merge "Uber" with "Uber Eats".

   So this scores three independent signals and requires them to agree:

     NAME     normalised-key equality, token containment, or token overlap
     AMOUNT   how close, relative to the obligation's own size — relaxed for
              obligations flagged as variable-amount (utilities, usage bills)
     CADENCE  does this date land where the obligation was actually due?

   A confident match needs a strong name AND corroboration from amount or
   cadence. That is what keeps "Uber $23 on the 3rd" from being absorbed into
   an "Uber Eats $18 monthly" obligation, while still catching a rent payment
   that moved by three days and went up by $50.

   Matching runs against every stored transaction and obligation, not just the
   rows in the current import — a statement uploaded today can and does match
   an obligation created months ago.
========================================================= */
function tokenSet(key){ return new Set(String(key||'').split(' ').filter(Boolean)); }
/* Words that flip the meaning of a transaction rather than describing the
   merchant. "NETFLIX PREMIUM REFUND" is not a Netflix bill — it is money
   coming back — and letting it match the Netflix obligation is precisely how
   the old matcher rewrote a real bill's payment history. */
const POLARITY_TOKENS = new Set(['refund','refunded','reversal','reversed','return','returned',
                                 'chargeback','adjustment','credit','rebate','cashback','void']);
function hasPolarityWord(key){
  for(const t of tokenSet(key)) if(POLARITY_TOKENS.has(t)) return true;
  return false;
}
/* 0..1. Deliberately asymmetric-aware: "verizon" inside "verizon wireless"
   scores well, but containment degrades as the extra words pile up, because
   "uber" vs "uber eats delivery fee" is a different merchant, not a variant. */
function nameSimilarity(keyA, keyB){
  if(!keyA || !keyB) return 0;
  // One side is a refund/reversal and the other isn't: different events.
  if(hasPolarityWord(keyA) !== hasPolarityWord(keyB)) return 0;
  if(keyA === keyB) return 1;
  const a = tokenSet(keyA), b = tokenSet(keyB);
  if(!a.size || !b.size) return 0;
  const [small, big] = a.size <= b.size ? [a,b] : [b,a];
  let shared = 0;
  small.forEach(t=>{ if(big.has(t)) shared++; });
  if(shared === 0) return 0;
  if(shared === small.size){
    if(small.size === big.size) return 1;
    const extra = big.size - small.size;
    return Math.max(0.45, 0.86 - 0.14*extra);
  }
  return shared / (a.size + b.size - shared);        // Jaccard
}
function amountSimilarity(a, b, variable){
  const x = Math.abs(num(a)), y = Math.abs(num(b));
  if(x === 0 && y === 0) return 1;
  const rel = Math.abs(x - y) / Math.max(x, y, 1);
  if(variable) return rel <= 0.60 ? 1 - rel*0.5 : 0.2;   // usage bills swing wildly
  if(rel <= 0.02) return 1;
  if(rel <= 0.10) return 0.85;
  if(rel <= 0.25) return 0.5;
  return Math.max(0, 0.4 - rel);
}
/* Does this date sit where the obligation was actually due? */
function cadenceSimilarity(ob, dateISO){
  const near = obligationDueDates(ob, addDays(dateISO, -45), addDays(dateISO, 45));
  if(!near.length) return 0;
  let best = Infinity;
  for(const d of near) best = Math.min(best, Math.abs(daysBetween(d, dateISO)));
  if(best <= 2) return 1;
  if(best <= 5) return 0.8;
  if(best <= 9) return 0.45;
  return 0;
}
const MATCH_THRESHOLD = 0.72;
function scoreObligationMatch(txn, ob){
  if(!txn || !ob) return { score:0, reasons:[] };
  if(ob.status === 'cancelled' || ob.isBudget) return { score:0, reasons:['obligation inactive'] };
  // A credit-card purchase can never satisfy a cash obligation, or vice versa:
  // that would corrupt both the cash total and the credit total.
  if((txn.payment || 'cash') !== (ob.payment || 'cash')) return { score:0, reasons:['different payment type'] };
  if(ob.startDate && txn.date < ob.startDate) return { score:0, reasons:['before the obligation started'] };
  if(ob.endDate && txn.date > ob.endDate) return { score:0, reasons:['after the obligation ended'] };

  const name = nameSimilarity(txn.merchantKey || merchantKey(txn.name), ob.merchantKey || merchantKey(ob.name));
  const amount = amountSimilarity(txn.amount, ob.amount, ob.variableAmount);
  const cadence = cadenceSimilarity(ob, txn.date);
  const reasons = [];

  // A weak name is fatal regardless of the other two — otherwise every $15.99
  // charge in the month would attach itself to Netflix.
  if(name < 0.45) return { score:0, reasons:['name does not match'] };
  /* So is an amount that isn't in the same universe. A perfect name on the
     exact due date still must not absorb a $900 charge into a $15.49
     subscription: bills change, but not by 58x. */
  const relGap = Math.abs(Math.abs(num(txn.amount)) - Math.abs(num(ob.amount)))
               / Math.max(Math.abs(num(txn.amount)), Math.abs(num(ob.amount)), 1);
  if(relGap > (ob.variableAmount ? 0.90 : 0.60)){
    return { score:0, reasons:['amount is too far from the usual '+fmt(ob.amount)], name, amount, cadence };
  }
  const score = round2(name*0.5 + amount*0.28 + cadence*0.22);
  if(name >= 0.99) reasons.push('same merchant');
  else if(name >= 0.8) reasons.push('merchant name matches closely');
  if(amount >= 0.99) reasons.push('same amount');
  else if(amount >= 0.8) reasons.push('similar amount');
  if(cadence >= 0.8) reasons.push('lands on the expected date');
  // Name alone must not be enough.
  const corroborated = amount >= 0.8 || cadence >= 0.8;
  return { score: corroborated ? score : Math.min(score, 0.6), reasons, name, amount, cadence };
}
/* The single entry point for "is this transaction one of my known obligations?" */
function findObligationForTxn(txn){
  let best = null, bestScore = 0, bestReasons = [];
  for(const ob of state.obligations){
    const r = scoreObligationMatch(txn, ob);
    if(r.score > bestScore){ best = ob; bestScore = r.score; bestReasons = r.reasons; }
  }
  return bestScore >= MATCH_THRESHOLD
    ? { obligation: best, score: bestScore, reasons: bestReasons }
    : null;
}
/* Finds obligations hiding in transactions the user never declared — the
   "you seem to pay this every month" suggestion. Works across the whole
   history, not one import. */
function detectRecurringCandidates(minOccurrences){
  const need = minOccurrences || 3;
  const groups = new Map();
  for(const t of state.txns){
    if(t.kind !== 'expense' || t.obligationId) continue;
    const k = t.merchantKey || merchantKey(t.name);
    if(!groups.has(k)) groups.set(k, []);
    groups.get(k).push(t);
  }
  const out = [];
  groups.forEach((list, key)=>{
    if(list.length < need) return;
    if(state.obligations.some(o=>nameSimilarity(o.merchantKey, key) >= 0.99)) return;
    const dates = list.map(t=>t.date).sort();
    const gaps = [];
    for(let i=1;i<dates.length;i++) gaps.push(daysBetween(dates[i-1], dates[i]));
    const mean = gaps.reduce((s,g)=>s+g,0)/gaps.length;
    const spread = Math.max(...gaps) - Math.min(...gaps);
    // Regular enough to be a schedule rather than a coincidence.
    let frequency = null;
    if(mean >= 25 && mean <= 35 && spread <= 8) frequency = 'monthly';
    else if(mean >= 12 && mean <= 16 && spread <= 5) frequency = 'biweekly';
    else if(mean >= 6 && mean <= 8 && spread <= 3) frequency = 'weekly';
    else if(mean >= 350 && mean <= 380) frequency = 'yearly';
    if(!frequency) return;
    const amounts = list.map(t=>t.amount);
    const avg = round2(amounts.reduce((s,a)=>s+a,0)/amounts.length);
    const varies = Math.max(...amounts) - Math.min(...amounts) > avg*0.1;
    const last = list.slice().sort((a,b)=>a.date.localeCompare(b.date)).pop();
    out.push({
      merchantKey: key, name: last.name, frequency, amount: avg, variableAmount: varies,
      category: last.category, payment: last.payment, accountId: last.accountId,
      occurrences: list.length, txns: list, lastDate: last.date,
      dueDay: frequency==='monthly' ? parseISO(last.date).getDate() : null,
      anchorDate: (frequency==='biweekly'||frequency==='weekly') ? last.date : null,
      annualMonth: frequency==='yearly' ? parseISO(last.date).getMonth()+1 : null,
      annualDay: frequency==='yearly' ? parseISO(last.date).getDate() : null
    });
  });
  return out.sort((a,b)=>b.occurrences - a.occurrences);
}
/* Import-time duplicate guard (§16). Same account, same day, same amount, same
   merchant is the same transaction — importing a statement twice must not
   double the ledger. */
function txnFingerprint(t){
  return [t.accountId||'', t.date||'', Math.round(num(t.amount)*100),
          t.merchantKey || merchantKey(t.name), t.kind||'expense'].join('|');
}
/* Same account, same day, same amount, same kind is already a very strong
   duplicate signal — the merchant name only has to corroborate it, not match
   exactly. Banks re-issue the same charge under different descriptors
   ("PUBLIX #123" one month, "PUBLIX SUPER MAR #123" the next), so requiring
   identical keys would let a re-imported statement double the ledger.
   A stable provider id, when the importer has one, settles it outright. */
function isDuplicateTxn(candidate){
  if(candidate.externalId && state.txns.some(t=>t.externalId && t.externalId === candidate.externalId)) return true;
  const cKey = candidate.merchantKey || merchantKey(candidate.name);
  const cKind = candidate.kind || 'expense';
  const cCents = Math.round(num(candidate.amount)*100);
  return state.txns.some(t=>{
    if((t.accountId||'') !== (candidate.accountId||'')) return false;
    if(t.date !== candidate.date) return false;
    if(Math.round(num(t.amount)*100) !== cCents) return false;
    if((t.kind||'expense') !== cKind) return false;
    // Same account, day, amount and kind — accept a merely plausible name.
    return nameSimilarity(t.merchantKey || merchantKey(t.name), cKey) >= 0.4;
  });
}

/* ---------------------------------------------------------
   SETTING THE CASH BASELINE (§1, §2)

   A baseline is a claim about a specific day: "on this date I had this much".
   Recording one never rewrites history — it appends. If the amount disagrees
   with what the ledger predicted, the gap is recorded as a permanent
   discrepancy against the month of the update, so the books stay explainable
   instead of being silently forced to balance.
--------------------------------------------------------- */
function previewBaselineUpdate(amount, asOfISO){
  const entered = round2(amount);
  const expected = state.cashBaseline ? expectedCashOn(asOfISO) : null;
  const discrepancy = expected === null ? 0 : round2(entered - expected);
  return { entered, expected, discrepancy, hasDiscrepancy: Math.abs(discrepancy) >= 0.01 };
}
function applyBaselineUpdate(amount, asOfISO, byAccount, note){
  if(!isValidISO(asOfISO)) throw new Error('A stored cash total needs a date.');
  const {entered, expected, discrepancy, hasDiscrepancy} = previewBaselineUpdate(amount, asOfISO);
  const next = {
    id: uid(), asOf: asOfISO, amount: entered,
    byAccount: byAccount || { [(state.accounts.find(a=>a.kind==='cash')||{id:'acct-cash'}).id]: entered },
    recordedAt: new Date().toISOString(), inferred:false
  };
  state.cashBaseline = next;
  state.baselineHistory.push({ ...next, expected, discrepancy });
  if(hasDiscrepancy){
    // Permanent. Nothing in the UI deletes these, by design.
    state.discrepancies.push({
      id: uid(), date: asOfISO, amount: discrepancy,
      expected, entered, note: note || '', recordedAt: new Date().toISOString()
    });
  }
  clearMemo();
  return { discrepancy, expected, entered };
}

/* =========================================================
   THE FINANCIAL CORE

   One engine, three scopes. Every screen reads from here — dashboards,
   graphs, recurring totals, monthly summaries, goals and projections — so
   no two of them can compute "current balance" or "monthly spending" with
   slightly different formulas, which is how they disagreed before.

     A. storedCash   what I actually have, right now
     B. month        what happened this month, and what's still owed
     C. projection   where this is heading

   The scopes are deliberately isolated. A future obligation must never touch
   Stored Cash; a credit-card purchase must never reduce cash; a projection is
   never mixed into an actual. Each function below states which scope it
   belongs to and refuses to read from the others.
========================================================= */

/* ---- obligation scheduling (scope-free: pure calendar) ---- */
/* Every date this obligation is due inside a window. Yearly obligations are
   genuinely annual — due once, in their month, not amount/12 spread across
   the year, which is what made them contaminate every month's actuals. */
function obligationDueDates(ob, fromISO, toISO){
  if(!ob || ob.status === 'cancelled' || ob.isBudget) return [];
  if(!isValidISO(fromISO) || !isValidISO(toISO) || fromISO > toISO) return [];
  const lo = (ob.startDate && ob.startDate > fromISO) ? ob.startDate : fromISO;
  const hi = (ob.endDate && ob.endDate < toISO) ? ob.endDate : toISO;
  if(lo > hi) return [];

  if(ob.frequency === 'yearly'){
    const out = [];
    const m = Math.min(Math.max(Math.trunc(num(ob.annualMonth)) || 1, 1), 12);
    const d = Math.min(Math.max(Math.trunc(num(ob.annualDay)) || 1, 1), 31);
    for(let y = +lo.slice(0,4); y <= +hi.slice(0,4); y++){
      const lastDay = new Date(y, m, 0, 12).getDate();
      const occ = isoOf(new Date(y, m-1, Math.min(d, lastDay), 12));
      if(occ >= lo && occ <= hi) out.push(occ);
    }
    return out;
  }
  if(ob.frequency === 'weekly'){
    if(!isValidISO(ob.anchorDate)) return [];
    const out = [];
    const offset = daysBetween(ob.anchorDate, lo);
    let occ = addDays(ob.anchorDate, Math.ceil(offset/7)*7);
    for(let i=0; i<MAX_OCCURRENCES && occ <= hi; i++){
      if(occ >= lo) out.push(occ);
      occ = addDays(occ, 7);
    }
    return out;
  }
  // monthly / biweekly share the existing, well-tested generator.
  return itemOccurrences({
    frequency: ob.frequency, dueDay: ob.dueDay, anchorDate: ob.anchorDate,
    startDate: ob.startDate, endDate: ob.endDate, date: null, status: ob.status
  }, fromISO, toISO);
}
function obligationIsActive(ob){ return ob && ob.status !== 'cancelled' && ob.status !== 'paused'; }

/* The temporal state the Recurring section shows (§5). An obligation is a
   standing commitment: it stays visible whether or not it is inside either
   window, which is why 'upcoming'/'later' exist alongside PASSED/COMING UP. */
function obligationState(ob, todayISOv){
  const today = todayISOv || todayISO();
  const win = RECURRING_WINDOW_DAYS;
  const dates = obligationDueDates(ob, addDays(today, -400), addDays(today, 400));
  if(!dates.length) return { state:'none', date:null };
  let lastPassed = null, nextDue = null;
  for(const d of dates){ if(d <= today) lastPassed = d; else { nextDue = d; break; } }
  if(lastPassed && daysBetween(lastPassed, today) <= win) return { state:'passed', date:lastPassed, nextDue };
  if(nextDue && daysBetween(today, nextDue) <= win)       return { state:'coming', date:nextDue, lastPassed };
  return { state: nextDue ? 'scheduled' : 'ended', date: nextDue || lastPassed, nextDue, lastPassed };
}

/* Has this obligation's instance on `due` actually been paid? A matched txn is
   the fact; the obligation is only the expectation. */
function obligationTxnFor(ob, dueISO, index){
  const list = index ? (index.byObligation.get(ob.id) || []) : state.txns.filter(t=>t.obligationId === ob.id);
  // Tolerate a payment posting a few days either side of the nominal due date.
  let best = null, bestGap = Infinity;
  for(const t of list){
    const gap = Math.abs(daysBetween(dueISO, t.date));
    if(gap <= 6 && gap < bestGap){ best = t; bestGap = gap; }
  }
  return best;
}

/* An index so the engine walks the transaction list once, not once per query. */
function txnIndex(){
  return memo('txnIndex', ()=>{
    const byObligation = new Map();
    const byMonth = new Map();
    for(const t of state.txns){
      if(t.obligationId){
        if(!byObligation.has(t.obligationId)) byObligation.set(t.obligationId, []);
        byObligation.get(t.obligationId).push(t);
      }
      const mk = monthKey(t.date);
      if(!byMonth.has(mk)) byMonth.set(mk, []);
      byMonth.get(mk).push(t);
    }
    return { byObligation, byMonth };
  });
}
function txnsInMonth(mk){ return txnIndex().byMonth.get(mk) || []; }

/* =========================================================
   SCOPE A — STORED CASH  ("what do I actually have?")

   Position = dated baseline
            + income after the baseline date, up to today
            − cash expenses after the baseline date, up to today
            − credit-card payments made from a cash account
   Credit-card PURCHASES are deliberately absent: the purchase is tracked as
   spending, and only the payment that settles it moves cash. Counting both
   is the double-charge the spec warns about.
   Nothing dated after today appears here at all — that is scope C's job.
========================================================= */
function storedCash(){
  return memo('storedCash', ()=>{
    const base = state.cashBaseline;
    if(!base || !isValidISO(base.asOf)){
      return { ok:false, position:0, baseline:null, since:{income:0, cashOut:0, ccPayments:0}, asOf:null };
    }
    const today = todayISO();
    const from = addDays(base.asOf, 1);   // strictly AFTER the baseline date:
                                          // the baseline already contains that day.
    let income = 0, cashOut = 0, ccPayments = 0;
    if(from <= today){
      for(const t of state.txns){
        if(!inRange(t.date, from, today)) continue;
        if(t.kind === 'income')                              income += t.amount;
        else if(t.kind === 'expense' && t.payment === 'cash') cashOut += t.amount;
        else if(t.kind === 'cc_payment')                      ccPayments += t.amount;
        // credit expenses and transfers: no effect on cash
      }
    }
    const position = round2(base.amount + income - cashOut - ccPayments);
    return {
      ok:true, position, baseline:base, asOf:base.asOf,
      since: { income:round2(income), cashOut:round2(cashOut), ccPayments:round2(ccPayments) },
      byAccount: cashByAccount(position)
    };
  });
}
function cashByAccount(position){
  const out = {};
  const base = state.cashBaseline;
  const cashAccounts = state.accounts.filter(a=>a.kind === 'cash' && !a.archived);
  if(!base) return out;
  cashAccounts.forEach(a=>{ out[a.id] = round2((base.byAccount && base.byAccount[a.id]) || 0); });
  const today = todayISO(), from = addDays(base.asOf, 1);
  if(from <= today){
    for(const t of state.txns){
      if(!inRange(t.date, from, today)) continue;
      if(out[t.accountId] === undefined) continue;
      if(t.kind === 'income') out[t.accountId] = round2(out[t.accountId] + t.amount);
      else if((t.kind === 'expense' && t.payment === 'cash') || t.kind === 'cc_payment')
        out[t.accountId] = round2(out[t.accountId] - t.amount);
    }
  }
  return out;
}
/* What the app believes cash should be on a given date — the number an
   incoming baseline gets compared against to produce a discrepancy (§2). */
function expectedCashOn(dateISO){
  const base = state.cashBaseline;
  if(!base || !isValidISO(base.asOf)) return 0;
  if(dateISO <= base.asOf) return base.amount;
  let v = base.amount;
  for(const t of state.txns){
    if(!inRange(t.date, addDays(base.asOf,1), dateISO)) continue;
    if(t.kind === 'income') v += t.amount;
    else if(t.kind === 'expense' && t.payment === 'cash') v -= t.amount;
    else if(t.kind === 'cc_payment') v -= t.amount;
  }
  return round2(v);
}
/* Outstanding credit-card debt: purchases not yet settled by payments. Debt,
   not cash — reported alongside Stored Cash, never subtracted from it. */
function creditBalances(){
  return memo('creditBalances', ()=>{
    const out = {};
    state.accounts.filter(a=>a.kind === 'credit').forEach(a=>{ out[a.id] = 0; });
    for(const t of state.txns){
      if(t.kind === 'expense' && t.payment === 'credit'){
        const id = t.accountId;
        if(out[id] !== undefined) out[id] = round2(out[id] + t.amount);
      } else if(t.kind === 'cc_payment' && t.creditAccountId && out[t.creditAccountId] !== undefined){
        out[t.creditAccountId] = round2(out[t.creditAccountId] - t.amount);
      }
    }
    const total = round2(Object.keys(out).reduce((s,k)=>s+out[k],0));
    return { byAccount: out, total };
  });
}

/* =========================================================
   SCOPE B — THIS MONTH  ("what happened, what do I still owe?")

   thisMonthAllIn = other cash expenses + PASSED recurring cash expenses.
   COMING UP obligations are excluded by definition: they have not happened.
   Credit spending is computed and reported, never folded into the cash total.
========================================================= */
function monthReport(mk){
  return memo('month:'+mk, ()=>monthReportUncached(mk));
}
function monthReportUncached(mk){
  const {from, to} = monthRange(mk);
  const today = todayISO();
  const isCurrent = mk === monthKey(today);
  // For a past month the whole month has happened; for the current month only
  // up to today counts as actual.
  const actualThrough = isCurrent ? (today < to ? today : to) : to;
  const idx = txnIndex();
  const rows = txnsInMonth(mk);

  let income = 0, otherCash = 0, otherCredit = 0;
  let recurringCashPassed = 0, recurringCreditPassed = 0, ccPayments = 0;
  const byCategory = {};
  const bump = (cat, field, amt)=>{
    if(!byCategory[cat]) byCategory[cat] = { cash:0, credit:0, recurringCash:0, recurringCredit:0 };
    byCategory[cat][field] = round2(byCategory[cat][field] + amt);
  };

  for(const t of rows){
    if(t.date > actualThrough) continue;          // dated ahead: not actual yet
    if(t.kind === 'income'){ income += t.amount; continue; }
    if(t.kind === 'transfer') continue;
    if(t.kind === 'cc_payment'){ ccPayments += t.amount; continue; }
    const cat = ALL_CATS.includes(t.category) ? t.category : 'Misc';
    if(t.obligationId){
      if(t.payment === 'credit'){ recurringCreditPassed += t.amount; bump(cat,'recurringCredit',t.amount); }
      else { recurringCashPassed += t.amount; bump(cat,'recurringCash',t.amount); }
    } else {
      if(t.payment === 'credit'){ otherCredit += t.amount; bump(cat,'credit',t.amount); }
      else { otherCash += t.amount; bump(cat,'cash',t.amount); }
    }
  }

  /* Obligations due this month that have NO matching transaction. Before their
     due date they are COMING UP and excluded from actuals. After it, they are
     PASSED and count — even though no transaction was imported — because the
     obligation is the evidence the money went out. */
  let dueUnpaidPassedCash = 0, dueUnpaidPassedCredit = 0, comingUpCash = 0, comingUpCredit = 0;
  const obligationRows = [];
  for(const ob of state.obligations){
    if(!obligationIsActive(ob)) continue;
    if(ob.isBudget) continue;
    for(const due of obligationDueDates(ob, from, to)){
      const txn = obligationTxnFor(ob, due, idx);
      const passed = due <= actualThrough;
      const amount = txn ? txn.amount : round2(ob.amount);
      obligationRows.push({ obligation:ob, due, txn, passed, amount, payment: ob.payment });
      if(txn) continue;                            // already counted from rows above
      if(passed){
        if(ob.payment === 'credit'){ dueUnpaidPassedCredit += amount; bump(ob.category,'recurringCredit',amount); }
        else { dueUnpaidPassedCash += amount; bump(ob.category,'recurringCash',amount); }
      } else {
        if(ob.payment === 'credit') comingUpCredit += amount; else comingUpCash += amount;
      }
    }
  }

  const inc = incomeReport(from, to);
  /* Ongoing budgets (groceries, gas, "misc") have no due date, so they are
     neither a dated transaction nor a PASSED obligation — which means they fell
     out of the month total entirely and the headline silently understated real
     life. They are an ESTIMATE of spending, not a record of it, so they must
     not be folded into an actual; they are reported alongside it instead, and
     the projection uses them. */
  let budgetedCash = 0, budgetedCredit = 0;
  for(const ob of state.obligations){
    if(!obligationIsActive(ob) || !ob.isBudget) continue;
    if(!expenseLiveIn({frequency:'variable', startDate:ob.startDate, endDate:ob.endDate, status:ob.status}, from, to)) continue;
    if(ob.payment === 'credit') budgetedCredit += num(ob.amount); else budgetedCash += num(ob.amount);
  }
  const recurringCash   = round2(recurringCashPassed + dueUnpaidPassedCash);
  const recurringCredit = round2(recurringCreditPassed + dueUnpaidPassedCredit);
  const thisMonthAllIn  = round2(otherCash + recurringCash);
  const creditSpend     = round2(otherCredit + recurringCredit);

  return {
    mk, from, to, isCurrent, actualThrough,
    // `income` stays the ACTUAL figure every existing caller expects; the
    // scheduled/awaiting split rides alongside it rather than inflating it.
    income: round2(income),
    incomeScheduled: inc.scheduled, incomeAwaiting: inc.awaiting,
    incomeAllKnown: round2(income + inc.scheduled + inc.awaiting),
    otherCash: round2(otherCash), otherCredit: round2(otherCredit),
    recurringCash, recurringCredit,
    comingUpCash: round2(comingUpCash), comingUpCredit: round2(comingUpCredit),
    budgetedCash: round2(budgetedCash), budgetedCredit: round2(budgetedCredit),
    /* What the month is expected to cost once budgets play out — explicitly a
       forecast, never presented as money already spent. */
    expectedAllIn: round2(otherCash + recurringCash + comingUpCash + budgetedCash),
    ccPayments: round2(ccPayments),
    thisMonthAllIn, creditSpend,
    // A spending metric, explicitly labelled as such: it is NOT cash out.
    totalSpending: round2(thisMonthAllIn + creditSpend),
    net: round2(income - thisMonthAllIn),
    byCategory, obligationRows,
    discrepancies: state.discrepancies.filter(d=>monthKey(d.date) === mk),
    discrepancyTotal: round2(sumMoney(state.discrepancies.filter(d=>monthKey(d.date)===mk), d=>d.amount))
  };
}
/* =========================================================
   INCOME (§2, §11)

   Three states, kept strictly apart, because conflating them is how a
   forecast turns into a lie about your bank balance:

     RECEIVED   an income txn dated on or before today. Fact. Feeds Stored Cash.
     SCHEDULED  a known future payment — a pay period already on the calendar,
                or a recurring source whose next date hasn't arrived. Real, but
                not money yet. Feeds projections only.
     EXPECTED   a learned rate for the part of the future nothing is scheduled
                for. A guess, labelled as one.

   A pay period with no `actualNet` is NOT received income no matter what its
   date says: the app's own field says "leave blank until the stub arrives", so
   a blank one is an expectation, not a receipt.
========================================================= */
function incomeSourceDueDates(src, fromISO, toISO){
  // Same scheduling rules as an expense obligation, so "monthly on the 15th"
  // cannot mean two different things depending on which way the money flows.
  return obligationDueDates(src, fromISO, toISO);
}
/* Scheduled job pay in a window: periods that exist on the calendar but have
   no confirmed stub yet. */
function scheduledJobPay(fromISO, toISO){
  if(state.job.payType === 'weeklyVariable') return 0;
  return sumMoney(
    state.job.periods.filter(p=>
      inRange(p.payDate, fromISO, toISO) && (p.actualNet == null || p.actualNet === '')),
    p=>jobPeriodNetUsed(p).val);
}
/* Scheduled recurring income in a window that hasn't been received. */
function scheduledSourceIncome(fromISO, toISO){
  let total = 0;
  const idx = txnIndex();
  for(const src of state.incomeSources){
    if(!obligationIsActive(src) || src.isBudget) continue;
    for(const due of incomeSourceDueDates(src, fromISO, toISO)){
      if(obligationTxnFor(src, due, idx)) continue;   // already received
      total += num(src.amount);
    }
  }
  return round2(total);
}
/* The single answer to "what income belongs to this window, and in what state". */
function incomeReport(fromISO, toISO){
  const today = todayISO();
  const receivedEnd = toISO < today ? toISO : today;
  const futureStart = addDays(today, 1);
  const received = fromISO <= receivedEnd
    ? sumMoney(state.txns.filter(t=>t.kind==='income' && inRange(t.date, fromISO, receivedEnd)), t=>t.amount)
    : 0;
  const fStart = futureStart > fromISO ? futureStart : fromISO;
  const scheduled = fStart <= toISO
    ? round2(scheduledJobPay(fStart, toISO) + scheduledSourceIncome(fStart, toISO) +
             // income txns a user has entered ahead of time
             sumMoney(state.txns.filter(t=>t.kind==='income' && inRange(t.date, fStart, toISO)), t=>t.amount))
    : 0;
  /* Pay already earned but still awaiting its stub — dated in the past, not
     confirmed. Reported on its own so it is never silently treated as cash. */
  const awaiting = fromISO <= receivedEnd ? scheduledJobPay(fromISO, receivedEnd) : 0;
  return {
    received: round2(received), scheduled: round2(scheduled), awaiting: round2(awaiting),
    total: round2(received + scheduled + awaiting)
  };
}
function currentMonthIncome(){
  const {from, to} = currentMonthRange();
  return incomeReport(from, to);
}

/* All active recurring obligations, regardless of window (§5). */
function recurringObligations(){
  const today = todayISO();
  return state.obligations
    .filter(o=>o.status !== 'cancelled')
    .map(o=>({ obligation:o, ...obligationState(o, today) }))
    .sort((a,b)=>(a.date||'').localeCompare(b.date||''));
}

/* =========================================================
   SCOPE C — PROJECTION  ("where is this heading?")

   Built from the same records as the other two scopes, but never mixed into
   them. A projection is an opinion about days that haven't happened; Stored
   Cash is a fact about days that have. The boundary is `today`, everywhere.

   For any future month:
     income     = scheduled income txns + a learned rate for the rest
     cashOut    = obligations due that month (cash) + a learned rate for
                  everything that isn't an obligation
     creditOut  = obligations due that month (credit) + learned card spend
   Credit spending is projected but never subtracted from projected cash; only
   projected card PAYMENTS move cash, on the same rule as scope A.
========================================================= */
/* A month's actual cash out, used to learn the "everything else" rate. Only
   completed months feed this — the current one is partial and would drag the
   average down every time. */
function learnedMonthlyRates(){
  return memo('learnedRates', ()=>{
    const keys = completedMonthKeys(LOOKBACK_MONTHS);
    const series = keys.map(mk=>{
      const r = monthReport(mk);
      return { mk, other:r.otherCash, credit:r.otherCredit, income:r.income };
    });
    let firstActive = series.findIndex(s=>s.other || s.credit || s.income);
    const active = firstActive === -1 ? [] : series.slice(firstActive);
    const recent = active.slice(-RECENT_MONTHS);
    return {
      otherCash: estimateFromMonths(recent.map(s=>s.other)),
      credit:    estimateFromMonths(recent.map(s=>s.credit)),
      income:    estimateFromMonths(recent.map(s=>s.income)),
      series: active
    };
  });
}
/* Projects one month. `mk` may be the current month (partly actual) or a
   future one (entirely modelled). */
function projectMonthReport(mk){
  return memo('proj:'+mk, ()=>{
    const {from, to} = monthRange(mk);
    const today = todayISO();
    const rates = learnedMonthlyRates();
    const cur = monthKey(today);
    if(mk < cur) return { ...monthReport(mk), projected:false, mk };

    const actual = mk === cur ? monthReport(mk) : null;
    const D = daysBetween(from, to) + 1;
    const remainingFrom = mk === cur ? addDays(today, 1) : from;
    const R = mk === cur ? Math.max(daysBetween(today, to), 0) : D;
    const frac = D > 0 ? R/D : 0;

    // Obligations are known, not guessed — use them at full value.
    let obCash = 0, obCredit = 0;
    for(const ob of state.obligations){
      if(!obligationIsActive(ob) || ob.isBudget) continue;
      for(const due of obligationDueDates(ob, remainingFrom, to)){
        if(ob.payment === 'credit') obCredit += num(ob.amount); else obCash += num(ob.amount);
      }
    }
    // Budgets are a monthly estimate by definition; prorate them across what's left.
    let budget = 0;
    for(const ob of state.obligations){
      if(!obligationIsActive(ob) || !ob.isBudget) continue;
      if(!expenseLiveIn({frequency:'variable', startDate:ob.startDate, endDate:ob.endDate, status:ob.status}, from, to)) continue;
      budget += num(ob.amount) * frac;
    }
    /* Everything already KNOWN about the remaining window — future pay periods,
       recurring income sources, and any income the user entered ahead. Only the
       part nothing is scheduled for gets a learned rate on top, so a known
       paycheck is never double counted against the job rate. */
    const known = incomeReport(remainingFrom, to);
    const scheduledIncome = round2(known.scheduled + known.awaiting);
    const jobRate = jobEstimate().monthly;
    const expectedIncome = Math.max(round2(jobRate * frac) - scheduledIncome, 0)
                         + round2(sideGigEstimate().monthly * frac);

    const income    = round2((actual ? actual.income : 0) + scheduledIncome + expectedIncome);
    const cashOut   = round2((actual ? actual.thisMonthAllIn : 0) + obCash + budget + rates.otherCash.monthly * frac);
    const creditOut = round2((actual ? actual.creditSpend : 0) + obCredit + rates.credit.monthly * frac);
    const spread    = round2((rates.otherCash.high - rates.otherCash.monthly + (rates.income.high - rates.income.monthly)) * frac);

    return {
      mk, from, to, projected:true,
      income, cashOut, creditOut,
      net: round2(income - cashOut),
      low: round2(income - cashOut - spread), high: round2(income - cashOut + spread),
      spread,
      confidence: rates.otherCash.confidence,
      knownObligations: round2(obCash + obCredit)
    };
  });
}
/* Cash position at the end of each of the next N months, starting from the
   real Stored Cash position today. This is the app's honest forward line. */
function cashProjection(months){
  const n = months || 6;
  const out = [];
  let pos = storedCash().position;
  const cur = monthKey(todayISO());
  for(let i=0;i<n;i++){
    const mk = i === 0 ? cur : monthKey(addMonths(cur+'-01', i));
    const p = projectMonthReport(mk);
    // Only the not-yet-happened part of the current month moves the position.
    const deltaIncome = i === 0 ? round2(p.income - monthReport(cur).income) : p.income;
    const deltaOut    = i === 0 ? round2(p.cashOut - monthReport(cur).thisMonthAllIn) : p.cashOut;
    pos = round2(pos + deltaIncome - deltaOut);
    out.push({ mk, position: pos, income: p.income, cashOut: p.cashOut, creditOut: p.creditOut, projected: p.projected });
  }
  return out;
}

/* =========================================================
   SERIES — the inputs the charts read. Each is derived from the same
   functions the tables use, so a chart can never tell a different story
   from the number printed beside it.
========================================================= */
/* Running balance forward from today. Starts at the balance as it stands NOW,
   so it only ever applies transactions that haven't happened yet — the old
   version replayed the previous seven days on top of a today-dated balance
   and drifted by that week's whole swing. */
function runwayPoints(days){
  const today = todayISO();
  const to = addDays(today, days || 60);
  const events = timelineEvents(today, to).filter(ev=>ev.date >= today);
  const start = currentBalance();
  const pts = [{ date: today, balance: start }];
  let bal = start;
  events.forEach(ev=>{
    const d = ev.cashDelta === undefined ? ev.amount : ev.cashDelta;
    if(!d) return;                       // credit purchases move no cash
    bal = round2(bal + d);
    pts.push({ date: ev.date, balance: bal, label: ev.label });
  });
  if(pts[pts.length-1].date !== to) pts.push({ date: to, balance: bal });
  return pts;
}
/* The one place the app decides what "money on hand" means — now the real
   Stored Cash position rather than a number typed into the first goal. */
function currentBalance(){ return storedCash().position; }

/* =========================================================
   CHARTS

   Hand-rolled SVG. The app loads no charting library — a strict no-build,
   single-file app shouldn't pull a 200KB dependency over the network to draw
   twelve rectangles, and every series these need is already computed by the
   functions above. All of them degrade to an honest empty state rather than
   an empty axis, and all of them carry a text alternative.
========================================================= */
const CHART_COLORS = { job:'#4CAF7D', side:'#5B9BD9', other:'#A78BFA', exp:'#E2574C', net:'#C9A227' };

function svgEl(w, h, label){
  return el(`<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${esc(label)}"></svg>`);
}
function add(parent, tag, attrs, text){
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for(const k in attrs) n.setAttribute(k, attrs[k]);
  if(text != null) n.textContent = text;
  parent.appendChild(n);
  return n;
}
/* "Nice" axis maximum, so the top gridline is a number a human would pick. */
function niceMax(v){
  if(v <= 0) return 100;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v/mag;
  return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10) * mag;
}
function chartCard(title, subtitle, node, legend, emptyMsg){
  const wrap = el(`<div class="chart-wrap"></div>`);
  wrap.appendChild(el(`<div class="eyebrow" style="margin-bottom:2px;">${esc(title)}</div>`));
  if(subtitle) wrap.appendChild(el(`<div class="hint-sm" style="margin:0 0 12px;">${esc(subtitle)}</div>`));
  if(!node){ wrap.appendChild(el(`<div class="chart-empty">${esc(emptyMsg||'Not enough data yet.')}</div>`)); return wrap; }
  wrap.appendChild(node);
  if(legend && legend.length){
    const lg = el(`<div class="chart-legend"></div>`);
    legend.forEach(([color,label])=> lg.appendChild(
      el(`<span><span class="swatch" style="background:${esc(color)}"></span>${esc(label)}</span>`)));
    wrap.appendChild(lg);
  }
  return wrap;
}

/* Income vs expenses per month, with net as a line. Answers "am I improving?",
   which twelve rows of numbers never could. */
function chartMonthlyFlow(closes){
  if(!closes.length) return null;
  const W=760, H=230, padL=56, padR=12, padT=12, padB=30;
  const iw = W-padL-padR, ih = H-padT-padB;
  // The scale has to hold the net line too, and net is frequently negative —
  // clamping it to zero would draw a flat line across every month the user
  // overspent, which is exactly the month they need to see.
  const hi = niceMax(Math.max(1, ...closes.map(c=>Math.max(c.income, c.thisMonthAllIn, c.creditSpend, c.net))));
  const lowest = Math.min(0, ...closes.map(c=>c.net));
  const lo = lowest < 0 ? -niceMax(-lowest) : 0;
  const span = hi - lo;
  const y = v => padT + ih - ((v-lo)/span)*ih;
  const zeroY = y(0);
  const bw = iw/closes.length;
  const svg = svgEl(W,H, 'Income, costs and net for the last ' + closes.length + ' months');

  [hi, hi/2, 0, lo/2, lo].filter((v,i,a)=>v!==undefined && a.indexOf(v)===i).forEach(v=>{
    add(svg,'line',{class: v===0 ? 'zero' : 'grid', x1:padL, x2:W-padR, y1:y(v), y2:y(v)});
    add(svg,'text',{x:padL-7, y:y(v)+3, 'text-anchor':'end'}, fmt0(v));
  });
  closes.forEach((c,i)=>{
    const cx = padL + i*bw;
    const gap = Math.min(4, bw*0.08), barW = Math.max((bw - gap*4)/3, 1);
    add(svg,'rect',{x:cx+gap, y:y(c.income), width:barW, height:Math.max(zeroY-y(c.income),0),
                    fill:CHART_COLORS.job, rx:2});
    add(svg,'rect',{x:cx+gap*2+barW, y:y(c.thisMonthAllIn), width:barW, height:Math.max(zeroY-y(c.thisMonthAllIn),0),
                    fill:CHART_COLORS.exp, rx:2});
    // Credit is drawn beside cash, never stacked on top of it: they are
    // different financial concepts and summing them would misstate cash out.
    if(c.creditSpend) add(svg,'rect',{x:cx+gap*3+barW*2, y:y(c.creditSpend), width:barW,
                    height:Math.max(zeroY-y(c.creditSpend),0), fill:'#E8913F', rx:2});
    add(svg,'text',{x:cx+bw/2, y:H-10, 'text-anchor':'middle'}, monthLabelShort(c.mk));
    add(svg,'title',{}, monthLabel(c.mk)+' — in '+fmt(c.income)+', cash out '+fmt(c.thisMonthAllIn)+
                        ', credit '+fmt(c.creditSpend)+', net '+fmt(c.net));
  });
  add(svg,'polyline',{points: closes.map((c,i)=>(padL+i*bw+bw/2)+','+y(c.net)).join(' '),
                      fill:'none', stroke:CHART_COLORS.net, 'stroke-width':2, 'stroke-linejoin':'round'});
  closes.forEach((c,i)=> add(svg,'circle',{cx:padL+i*bw+bw/2, cy:y(c.net), r:2.5, fill:CHART_COLORS.net}));
  add(svg,'line',{class:'axis', x1:padL, x2:W-padR, y1:padT+ih, y2:padT+ih});
  return svg;
}

/* Ranked spending by category, with the recent average behind each bar as a
   ghost so "is this month unusual?" is answerable at a glance. */
function chartCategorySpend(rows){
  if(!rows.length) return null;
  const rowH=30, W=760, padL=132, padR=96;
  const H = rows.length*rowH + 8;
  const peak = niceMax(Math.max(1, ...rows.map(r=>Math.max(r.cash + (r.credit||0), r.avg))));
  const iw = W-padL-padR;
  const svg = svgEl(W,H, 'Spending by category this month, cash and credit shown separately');
  rows.forEach((r,i)=>{
    const cy = i*rowH + 5;
    add(svg,'text',{x:padL-10, y:cy+14, 'text-anchor':'end', fill:'#E7E9ED'}, r.category);
    if(r.avg>0) add(svg,'rect',{x:padL, y:cy+2, width:Math.max((r.avg/peak)*iw,1), height:16, fill:'#39424E', rx:3});
    const cashW = (r.cash/peak)*iw;
    if(r.cash) add(svg,'rect',{x:padL, y:cy+5, width:Math.max(cashW,1), height:10, fill:r.color, rx:3});
    /* Credit is appended as its own segment in its own colour, not merged into
       the cash bar — the legend names both, so the eye is never asked to read
       one number as if it were the other (§10). */
    if(r.credit) add(svg,'rect',{x:padL + Math.max(cashW,0) + (r.cash?2:0), y:cy+5,
                                 width:Math.max((r.credit/peak)*iw,1), height:10, fill:'#E8913F', rx:3});
    add(svg,'text',{x:W-padR+8, y:cy+11}, fmt0(r.cash));
    if(r.credit) add(svg,'text',{x:W-padR+8, y:cy+22, fill:'#E8913F'}, fmt0(r.credit)+' cr');
    add(svg,'title',{}, r.category+' — '+fmt(r.cash)+' cash'+(r.credit?', '+fmt(r.credit)+' credit':'')+
                        (r.avg>0?' · '+fmt(r.avg)+' typical':''));
  });
  return svg;
}

/* The running balance across the forecast window. The app already knew the
   balance dipped below zero; it only said so in a sentence, and refused to say
   when or how far. This draws the dip and dates it. */
function chartRunway(points){
  if(points.length<2) return null;
  const W=760, H=200, padL=52, padR=12, padT=14, padB=28;
  const iw=W-padL-padR, ih=H-padT-padB;
  const lo = Math.min(0, ...points.map(p=>p.balance));
  const hi = Math.max(1, ...points.map(p=>p.balance));
  const span = (hi-lo) || 1;
  const x = i => padL + (i/(points.length-1))*iw;
  const y = v => padT + ih - ((v-lo)/span)*ih;
  const svg = svgEl(W,H, 'Projected running balance over the next 60 days');
  const zeroY = y(0);
  add(svg,'line',{class:'zero', x1:padL, x2:W-padR, y1:zeroY, y2:zeroY});
  add(svg,'text',{x:padL-7, y:zeroY+3, 'text-anchor':'end'}, '$0');
  add(svg,'text',{x:padL-7, y:y(hi)+3, 'text-anchor':'end'}, fmt0(hi));

  // Stepped path: a balance holds flat until a transaction moves it.
  let d = 'M' + x(0) + ' ' + y(points[0].balance);
  points.forEach((p,i)=>{ if(i) d += ' L' + x(i) + ' ' + y(points[i-1].balance) + ' L' + x(i) + ' ' + y(p.balance); });
  add(svg,'path',{d: d + ' L' + x(points.length-1) + ' ' + zeroY + ' L' + x(0) + ' ' + zeroY + ' Z',
                  fill: 'url(#runwayFill)', opacity:.22, stroke:'none'});
  const defs = add(svg,'defs',{});
  const grad = add(defs,'linearGradient',{id:'runwayFill', x1:'0', y1:'0', x2:'0', y2:'1'});
  add(grad,'stop',{offset:'0%','stop-color':'#4CAF7D'});
  add(grad,'stop',{offset:'100%','stop-color':'#4CAF7D','stop-opacity':'0.15'});
  add(svg,'path',{d, fill:'none', stroke:CHART_COLORS.job, 'stroke-width':2, 'stroke-linejoin':'round'});

  const dip = points.find(p=>p.balance < 0);
  if(dip){
    const di = points.indexOf(dip);
    add(svg,'line',{x1:x(di), x2:x(di), y1:padT, y2:padT+ih, stroke:'#E2574C', 'stroke-width':1.5, 'stroke-dasharray':'4 3'});
    add(svg,'circle',{cx:x(di), cy:y(dip.balance), r:4, fill:'#E2574C'});
    add(svg,'text',{x:Math.min(x(di)+6, W-150), y:padT+11, fill:'#E2574C'}, 'below zero ' + dispDateShort(dip.date));
  }
  [0, Math.floor(points.length/2), points.length-1].forEach(i=>
    add(svg,'text',{x:x(i), y:H-9, 'text-anchor': i===0?'start':(i===points.length-1?'end':'middle')},
        dispDateShort(points[i].date)));
  return svg;
}

/* Goal progress: what has actually been banked, then a cone from the slow case
   to the fast case. The cone is the point — a single projected line would
   claim a precision this data does not have. */
function chartGoalCone(g, s){
  if(!s.valid || s.planWeeks<1) return null;
  const W=760, H=210, padL=56, padR=14, padT=14, padB=28;
  const iw=W-padL-padR, ih=H-padT-padB;
  const retro = goalWeeklyRetrospective(g);
  const past = []; let cum = s.A;
  past.push({t:0, v:cum});
  retro.weeks.forEach((w,i)=>{ cum = round2(cum + w.actual); past.push({t:i+1, v:cum}); });
  const totalT = past.length-1 + s.planWeeks;
  const fastEnd = round2(cum + s.paceMax*s.planWeeks + s.jobWindow - s.upkeep);
  const slowEnd = round2(cum + s.avgWeeklyPaceSoFar*s.planWeeks + s.jobWindow - s.upkeep);
  const hi = niceMax(Math.max(s.maxTarget, fastEnd, cum, 1));
  const x = t => padL + (totalT? t/totalT : 0)*iw;
  const y = v => padT + ih - (Math.max(v,0)/hi)*ih;
  const svg = svgEl(W,H, 'Goal progress and projected range to ' + dispDate(g.targetDate));

  [[s.minTarget,'min '+fmt0(s.minTarget)], [s.maxTarget,'max '+fmt0(s.maxTarget)]].forEach(([v,lab])=>{
    if(v<=0) return;
    add(svg,'line',{class:'grid', x1:padL, x2:W-padR, y1:y(v), y2:y(v), stroke:'#C9A227', 'stroke-dasharray':'4 4', opacity:.55});
    add(svg,'text',{x:W-padR, y:y(v)-5, 'text-anchor':'end', fill:'#C9A227'}, lab);
  });
  const t0 = past.length-1;
  add(svg,'path',{
    d:`M${x(t0)} ${y(cum)} L${x(totalT)} ${y(fastEnd)} L${x(totalT)} ${y(slowEnd)} Z`,
    fill:'#5B9BD9', opacity:.20});
  add(svg,'path',{d:`M${x(t0)} ${y(cum)} L${x(totalT)} ${y(fastEnd)}`, stroke:'#5B9BD9', 'stroke-width':1.5, 'stroke-dasharray':'5 4', fill:'none'});
  add(svg,'path',{d:`M${x(t0)} ${y(cum)} L${x(totalT)} ${y(slowEnd)}`, stroke:'#5B9BD9', 'stroke-width':1.5, 'stroke-dasharray':'5 4', fill:'none'});
  add(svg,'polyline',{points: past.map(p=>x(p.t)+','+y(p.v)).join(' '), fill:'none', stroke:CHART_COLORS.job, 'stroke-width':2.5, 'stroke-linejoin':'round'});
  add(svg,'circle',{cx:x(t0), cy:y(cum), r:4, fill:CHART_COLORS.job});
  add(svg,'line',{class:'axis', x1:padL, x2:W-padR, y1:padT+ih, y2:padT+ih});
  add(svg,'text',{x:padL, y:H-9}, dispDateShort(g.startDate));
  add(svg,'text',{x:W-padR, y:H-9, 'text-anchor':'end'}, dispDateShort(g.targetDate));
  add(svg,'text',{x:padL-7, y:y(0)+3, 'text-anchor':'end'}, '$0');
  return svg;
}

/* Weekly effort against the bar the goal was set with. */
function chartWeeklyPace(weeks){
  if(!weeks.length) return null;
  const W=760, H=170, padL=52, padR=12, padT=12, padB=26;
  const iw=W-padL-padR, ih=H-padT-padB;
  const target = weeks[0].target;
  const peak = niceMax(Math.max(1, target, ...weeks.map(w=>w.actual)));
  const y = v => padT + ih - (v/peak)*ih;
  const bw = iw/weeks.length;
  const svg = svgEl(W,H, 'Weekly outside income versus target for ' + weeks.length + ' weeks');
  weeks.forEach((w,i)=>{
    const gap = Math.min(5, bw*0.18);
    add(svg,'rect',{x:padL+i*bw+gap/2, y:y(w.actual), width:Math.max(bw-gap,1),
                    height:Math.max(padT+ih-y(w.actual),0), rx:2,
                    fill: w.diff>=0 ? CHART_COLORS.job : CHART_COLORS.exp});
    add(svg,'title',{}, 'Week '+w.n+' ('+dispDateShort(w.weekStart)+') — '+fmt(w.actual)+' vs '+fmt(w.target));
  });
  if(target>0){
    add(svg,'line',{x1:padL, x2:W-padR, y1:y(target), y2:y(target), stroke:'#C9A227', 'stroke-width':1.5, 'stroke-dasharray':'5 4'});
    add(svg,'text',{x:W-padR, y:y(target)-5, 'text-anchor':'end', fill:'#C9A227'}, 'target ' + fmt0(target));
  }
  add(svg,'text',{x:padL-7, y:y(peak)+3, 'text-anchor':'end'}, fmt0(peak));
  add(svg,'line',{class:'axis', x1:padL, x2:W-padR, y1:padT+ih, y2:padT+ih});
  return svg;
}

   RENDER SHELL
========================================================= */
let activeTab = 'dashboard';
let activeIncomeSub = 'job';
let expandedGoal = null;
let expandedWeeklyGoal = null;
let expandedHistoryMonths = new Set();
let expenseSearchQuery = '';
let selectedExpenseIds = new Set();
let ctxMenuState = null;

function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function elAll(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content;
}

/* render() clears #app before it builds anything, so a throw halfway through
   used to leave a header and an empty page — and because the handler had
   already called scheduleSave(), the state that caused it was persisted and
   the break survived a reload. Now a failure is caught, shown, and always
   leaves the user a way out. */
function render(){
  const app = document.getElementById('app');
  const scrollY = window.scrollY;
  clearMemo();
  closeCtxMenu();
  try{
    renderInner(app);
    // Restoring scroll makes edits in a long list survive the rebuild.
    window.scrollTo(0, scrollY);
  }catch(err){
    console.error('render failed', err);
    renderFatalError('Something went wrong drawing this screen',
      esc((err && err.message) || String(err)) +
      ' — your data is safe. Try another tab, or export a backup.');
  }
}
function renderInner(app){
  app.innerHTML = '';
  if(state && state.settings && !state.settings.onboarded){
    renderOnboarding();
    return;
  }
  app.appendChild(renderHeader());
  app.appendChild(renderTabs());
  const body = el(`<main id="tab-body" tabindex="-1" role="tabpanel" aria-labelledby="tab-${esc(activeTab)}"></main>`);
  if(activeTab==='dashboard') body.appendChild(renderDashboard());
  else if(activeTab==='income') body.appendChild(renderIncome());
  else if(activeTab==='expenses') body.appendChild(renderExpenses());
  else if(activeTab==='goals') body.appendChild(renderGoals());
  else if(activeTab==='timeline') body.appendChild(renderTimeline());
  else if(activeTab==='settings') body.appendChild(renderSettings());
  // Guarded: activeTab could still say 'admin' from a previous user on a
  // shared browser, and renderTabs' own guard doesn't cover the dispatch.
  else if(activeTab==='admin' && profile && profile.is_admin) body.appendChild(renderAdmin());
  else body.appendChild(renderDashboard());
  app.appendChild(body);
  app.appendChild(el(`<footer class="hint">Everything here saves automatically as you type · your data stays private to you</footer>`));
  updateSyncIndicator();
}
/* Every module-level UI global, reset together. Leaving these set across a
   logout leaked one user's search text, selection and expanded rows into the
   next person's session on a shared browser. */

function renderHeader(){
  const hasPendingReview = !!(state.pendingDocReview && state.pendingDocReview.rows && state.pendingDocReview.rows.length>0);
  const header = el(`
    <header style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;">
      <div>
        <div class="brand"><span class="stamp">T</span><h1>TALLY</h1><span class="tag">personal finance ledger</span></div>
        <div class="subhead">Income, expenses, and goals — kept honest.</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;">
        <span class="muted" style="font-size:var(--fs-xs);"><span id="sync-dot" class="sync-dot ok"></span><span id="sync-label">Synced</span></span>
        <div style="display:flex;flex-direction:column;gap:6px;align-items:stretch;">
          <button class="btn btn-sm btn-gold" id="upload-doc">Upload Document</button>
          ${hasPendingReview ? `<button class="btn btn-sm btn-danger" id="unfinished-review">Unfinished Review (${state.pendingDocReview.rows.length})</button>` : ''}
        </div>
        <button class="btn btn-sm" id="export-data">Export backup</button>
        <button class="btn btn-sm" id="import-data">Import backup</button>
        <input type="file" id="import-file" accept="application/json" style="display:none;">
        <button class="btn btn-sm" id="logout-btn">Log out</button>
      </div>
    </header>
  `);
  header.querySelector('#upload-doc').addEventListener('click', ()=> openDocumentUploadModal());
  const unfinishedBtn = header.querySelector('#unfinished-review');
  if(unfinishedBtn) unfinishedBtn.addEventListener('click', ()=> openSavedDocReview());
  header.querySelector('#export-data').addEventListener('click', exportBackup);
  header.querySelector('#import-data').addEventListener('click', ()=> header.querySelector('#import-file').click());
  header.querySelector('#logout-btn').addEventListener('click', ()=>{ logOutFlow(); });
  header.querySelector('#import-file').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      const res = parseBackup(await file.text());
      if(!res.ok){ alert(res.error); return; }
      const counts = res.state.expenses.items.length + ' expenses, ' +
                     res.state.sideGig.entries.length + ' side gig entries, ' +
                     res.state.goals.length + ' goals';
      if(!confirm('Replace everything in this ledger with the backup?\n\nThe backup contains: ' + counts + '\n\nThis cannot be undone.')) return;
      state = res.state;
      scheduleSave();
      render();
      toast('Backup imported', {kind:'ok'});
    }catch(err){
      alert('Could not read that backup file.');
      console.error(err);
    }
  });
  return header;
}
/* Validates a parsed backup WITHOUT touching the live ledger.
   The old path did `state = parsed` and then ran the migration — so a file of
   {"job":1,"expenses":1} passed the guard, the migration threw partway through
   writing to a Number primitive, the catch said "could not read that backup
   file", and the app was already sitting on the garbage object with the old
   data still on screen. The next click pushed it to the cloud.
   Now the candidate is migrated in isolation and only swapped in on success. */
function parseBackup(text){
  let parsed;
  try{ parsed = JSON.parse(text); }
  catch(e){ return { ok:false, error:'That file isn\'t valid JSON.' }; }
  if(!isPlainObject(parsed) || !isPlainObject(parsed.job) || !isPlainObject(parsed.expenses)){
    return { ok:false, error:"That file doesn't look like a Tally backup." };
  }
  if(num(parsed.schemaVersion) > 3){
    return { ok:false, error:'That backup was made by a newer version of Tally. Update this page first — importing it here would drop the newer fields.' };
  }
  const live = state;
  try{
    state = parsed;
    migrateState();
    const candidate = state;
    return { ok:true, state:candidate };
  }catch(e){
    return { ok:false, error:'That backup is damaged and could not be repaired: ' + ((e && e.message) || e) };
  }finally{
    state = live;   // the live ledger is never left holding a rejected import
  }
}
function exportBackup(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `tally-backup-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function renderTabs(){
  const nav = el(`<nav class="tabs" role="tablist" aria-label="Sections"></nav>`);
  const tabList = [['dashboard','Dashboard'],['income','Income'],['expenses','Expenses'],['goals','Goals'],['timeline','Timeline'],['settings','Settings']];
  if(profile && profile.is_admin) tabList.push(['admin','Admin']);
  tabList.forEach(([key,label])=>{
    const isActive = key===activeTab;
    const b = el(`<button id="tab-${key}" role="tab" aria-controls="tab-body"
                    aria-selected="${isActive}" tabindex="${isActive?0:-1}">${label}</button>`);
    if(isActive) b.classList.add('active');
    b.addEventListener('click', ()=>{ switchTab(key); });
    // Arrow-key navigation is the expected behaviour for a tablist.
    b.addEventListener('keydown', e=>{
      const i = tabList.findIndex(t=>t[0]===key);
      if(e.key==='ArrowRight' || e.key==='ArrowLeft'){
        e.preventDefault();
        const d = e.key==='ArrowRight' ? 1 : -1;
        switchTab(tabList[(i + d + tabList.length) % tabList.length][0]);
      } else if(e.key==='Home'){ e.preventDefault(); switchTab(tabList[0][0]); }
      else if(e.key==='End'){ e.preventDefault(); switchTab(tabList[tabList.length-1][0]); }
    });
    nav.appendChild(b);
  });
  return nav;
}
function switchTab(key){
  activeTab = key;
  render();
  const btn = document.getElementById('tab-' + key);
  if(btn) btn.focus();
  announce(key.charAt(0).toUpperCase() + key.slice(1) + ' tab');
}

/* =========================================================
   MODAL SYSTEM (generic add/edit forms)
========================================================= */
const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
/* A modal that a keyboard and a screen reader can both actually use: it
   announces itself, takes focus, keeps Tab inside itself, closes on Escape,
   and hands focus back to whatever opened it. None of that was true before —
   focus stayed on the page behind the overlay and there was no way out
   without finding the Cancel button with the mouse. */
function openModal({title, desc, bodyBuilder, onMount, wide}){
  const opener = document.activeElement;
  const overlay = el(`<div class="modal-overlay"></div>`);
  const titleId = 'modal-title-' + uid();
  const modal = el(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="${titleId}" tabindex="-1"></div>`);
  if(wide) modal.style.maxWidth = '760px';
  modal.appendChild(el(`<h3 id="${titleId}">${esc(title)}</h3>`));
  if(desc) modal.appendChild(el(`<div class="desc">${esc(desc)}</div>`));

  let closed = false;
  function close(){
    if(closed) return;
    closed = true;
    document.removeEventListener('keydown', onKey, true);
    overlay.remove();
    const app = document.getElementById('app');
    if(app) app.removeAttribute('aria-hidden');
    if(opener && document.contains(opener)) opener.focus();
  }
  function onKey(e){
    if(e.key === 'Escape'){ e.stopPropagation(); close(); return; }
    if(e.key !== 'Tab') return;
    const items = Array.from(modal.querySelectorAll(FOCUSABLE)).filter(n=>n.offsetParent !== null || n === modal);
    if(!items.length) return;
    const first = items[0], last = items[items.length-1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }

  const body = document.createElement('div');
  bodyBuilder(body, close);
  modal.appendChild(body);
  overlay.appendChild(modal);
  // Only treat this as "dismiss" if it was a real tap/click, not a scroll or
  // drag gesture that happened to start or end over the background.
  let downX=null, downY=null;
  overlay.addEventListener('pointerdown', e=>{ downX=e.clientX; downY=e.clientY; });
  overlay.addEventListener('click', e=>{
    if(e.target!==overlay) return;
    const moved = downX==null || Math.abs(e.clientX-downX)>10 || Math.abs(e.clientY-downY)>10;
    if(!moved) close();
  });
  document.body.appendChild(overlay);
  const app = document.getElementById('app');
  if(app) app.setAttribute('aria-hidden','true');
  document.addEventListener('keydown', onKey, true);
  const firstField = modal.querySelector(FOCUSABLE);
  (firstField || modal).focus();
  if(onMount) onMount(modal, close);
  return { overlay, close };
}

/* ---- toasts + undo -------------------------------------------------------
   Deleting a row used to be instant and irreversible on five different
   tables, and the only proof that anything ever saved was a 7px dot. */
function toastHost(){
  let host = document.getElementById('toast-host');
  if(!host){
    host = el(`<div id="toast-host" aria-live="polite" aria-atomic="false"></div>`);
    document.body.appendChild(host);
  }
  return host;
}
function toast(message, opts){
  opts = opts || {};
  const box = el(`<div class="toast ${opts.kind||''}" role="status"><span class="t-msg">${esc(message)}</span></div>`);
  if(opts.actionLabel && opts.onAction){
    const b = el(`<button type="button">${esc(opts.actionLabel)}</button>`);
    b.addEventListener('click', ()=>{ box.remove(); opts.onAction(); });
    box.appendChild(b);
  }
  toastHost().appendChild(box);
  const ms = opts.ms || (opts.actionLabel ? 9000 : 3200);
  setTimeout(()=>{ box.remove(); }, ms);
  return box;
}
/* Removes rows from a collection but keeps them (and their original positions)
   so a single click can put them back exactly where they were. */
function deleteWithUndo(label, removeFn, restoreFn){
  removeFn();
  scheduleSave(); render();
  toast(label, { kind:'ok', actionLabel:'Undo', onAction:()=>{
    restoreFn(); scheduleSave(); render(); toast('Restored', {kind:'ok'});
  }});
}
/* A real confirmation for the handful of actions that genuinely cannot be
   undone. Native confirm() is unstyleable, can't name what it's about to
   destroy, and — after a browser offers to "prevent additional dialogs" —
   silently returns false, which on a delete path means the click just does
   nothing. Typing the word is the standard guard for this class of action.
   (The app's own code used to apologise for this: "type-to-confirm isn't
   available here".) */
function confirmDestructive({title, desc, confirmWord, onConfirm}){
  openModal({
    title, desc,
    bodyBuilder(body, close){
      body.appendChild(elAll(`
        <div class="field">
          <label for="cd-input">Type <strong style="color:var(--red);">${esc(confirmWord)}</strong> to confirm</label>
          <input type="text" id="cd-input" autocomplete="off" autocapitalize="characters" spellcheck="false">
        </div>
        <div class="modal-actions">
          <button class="btn" id="cd-export">Export a backup first</button>
          <button class="btn" id="cd-cancel">Cancel</button>
          <button class="btn btn-danger" id="cd-go" disabled>Delete</button>
        </div>`));
      const input = body.querySelector('#cd-input');
      const go = body.querySelector('#cd-go');
      input.addEventListener('input', ()=>{ go.disabled = input.value.trim().toUpperCase() !== confirmWord.toUpperCase(); });
      input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !go.disabled) go.click(); });
      body.querySelector('#cd-export').addEventListener('click', exportBackup);
      body.querySelector('#cd-cancel').addEventListener('click', close);
      go.addEventListener('click', ()=>{ close(); onConfirm(); });
    }
  });
}
/* One coercion rule for every editable row in the app. There were six
   hand-written copies with subtly different rules, and the differences were
   the actual bug: one stored null for a cleared date (crashing the tab, then
   losing the row on next load), another stored '' (which never throws, so the
   row stayed visible while silently dropping out of every total).
   Returns false if the edit was rejected, so the caller doesn't save. */
const DATE_FIELDS = new Set(['date','payDate','start','end','weekEnd','anchorDate','startDate','endDate','targetDate']);
const MONEY_FIELDS = new Set(['amount','actualNet','currentSavings','minTarget','maxTarget']);
function setEntryField(rec, field, raw, inputEl){
  if(DATE_FIELDS.has(field)){
    const optional = (field==='endDate' || field==='startDate');
    if(raw === '' && optional){ rec[field] = null; return true; }
    if(!isValidISO(raw)){
      if(inputEl) inputEl.value = rec[field] || '';
      toast('That date isn\'t valid, so it was left as it was', {kind:'err'});
      return false;
    }
    rec[field] = raw;
    return true;
  }
  if(MONEY_FIELDS.has(field)){ rec[field] = raw === '' ? null : round2(raw); return true; }
  if(field === 'hours' || field === 'dueDay'){ rec[field] = raw === '' ? null : num(raw); return true; }
  if(field === 'memberId'){ rec[field] = raw || null; return true; }
  rec[field] = String(raw).slice(0, 500);
  return true;
}
function announce(msg){
  let live = document.getElementById('live-region');
  if(!live){
    live = el(`<div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>`);
    document.body.appendChild(live);
  }
  live.textContent = '';
  setTimeout(()=>{ live.textContent = msg; }, 60);
}
